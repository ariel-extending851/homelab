apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oom-hog
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: oom-hog
    app.kubernetes.io/component: chaos-fixture
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oom-hog
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: __TARGET_NODE__
      containers:
        - name: hog
          image: alexeiled/stress-ng:latest-ubuntu
          args: ["--vm", "1", "--vm-bytes", "120M", "--vm-keep", "--timeout", "30s"]
          resources:
            requests:
              memory: 50Mi
              cpu: 10m
            limits:
              memory: 100Mi
              cpu: 100m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: chaos-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["__TARGET_NODE__"]
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m
