# GitHub Actions Workflow: Markdown Link Checker
#
# This workflow runs on every pull request and push to the 'develop' branch
# to ensure there are no broken links in the project's documentation.
#
# It uses 'lychee', a fast and powerful link checker.
# See: https://github.com/lycheeverse/lychee-action

name: "Docs: Check Broken Links"

on:
  pull_request:
    paths:
      - '**.md'
  push:
    branches:
      - develop
    paths:
      - '**.md'

jobs:
  link-checker:
    name: "Run Lychee Link Checker"
    runs-on: ubuntu-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Run Lychee Link Checker"
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          # Arguments to pass to Lychee
          # --verbose: Show detailed output
          # --no-progress: Cleaner logs for CI
          # --exclude-path: Ignore the archive directory
          # "**/*.md": Scan all markdown files recursively
          args: >-
            --verbose
            --no-progress
            --exclude-path ./docs/archive
            --scheme https
            --scheme http
            --exclude "\.ts\.net"
            --exclude "raspberrypi\.com"
            --exclude-file .lycheeignore
            --max-retries 5
            --retry-wait-time 10
            --timeout 30
            "**/*.md"
        env:
          # GitHub token is used to avoid rate-limiting when checking github.com links
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
