name: CD Pipeline — Post-Deployment Validation

# Runs AFTER ci-validation.yml (all validation must pass first).
# Orchestrates: Terraform apply → Ansible deploy → ArgoCD wait → E2E tests → Rollback on failure
#
# Architecture:
# - This workflow calls Makefile targets as SOURCE OF TRUTH
# - All logic lives in Makefile — CI simply calls `make target`
# - Local parity: user runs `make terraform-apply` locally = same as CI runs
#
# Prerequisites:
# - AWS_ACCOUNT_ID repository variable
# - SOPS_AGE_KEY secret
# - GitHub OIDC provider configured in AWS IAM
# - ci-validation.yml must pass first

on:
  push:
    branches: ["main"]  # Only on main (production)
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: "prod"
      skip_staging:
        description: "Emergency: skip staging canary + manual approval (prod only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # GATE: Wait for validation to pass
  # ============================================================================
  validate-gate:
    name: Wait for Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Validation Pipeline Status
        run: |
          echo "✅ CI validation gate must pass before deployment proceeds"
          echo "   This ensures all tests, linting, and policy checks passed first"

  # ============================================================================
  # STAGING CANARY — full deploy + tests against ephemeral staging workspace
  # ----------------------------------------------------------------------------
  # Skipped when workflow_dispatch input `skip_staging=true` (emergency hotfix).
  # State is isolated by Terraform workspace `staging`; cleanup runs always() so
  # prod never inherits orphaned EC2/EBS resources from a failed staging run.
  # ============================================================================
  staging-terraform-apply:
    name: "Staging: Apply Terraform"
    runs-on: ubuntu-latest
    needs: [validate-gate]
    if: inputs.skip_staging != 'true'
    environment: staging-deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-apply
          aws-region: us-east-1

      - name: Setup CI Dependencies (SOPS)
        run: make setup-ci-deps-terraform

      - name: Initialize Terraform
        working-directory: infra/aws
        run: terraform init

      - name: Select staging workspace
        working-directory: infra/aws
        run: terraform workspace select staging || terraform workspace new staging

      - name: Apply Staging Terraform
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          terraform apply -auto-approve -lock=true \
            -var-file=staging.tfvars 2>&1 | tee staging-apply.log

      - name: Export Staging Kubeconfig
        working-directory: infra/aws
        run: |
          terraform output -raw kubeconfig_content > /tmp/k3s-homelab-kubeconfig-staging.yaml
          chmod 600 /tmp/k3s-homelab-kubeconfig-staging.yaml
          export KUBECONFIG=/tmp/k3s-homelab-kubeconfig-staging.yaml
          kubectl cluster-info --request-timeout=5s || exit 1

      - name: Upload Staging Kubeconfig Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig-staging
          path: /tmp/k3s-homelab-kubeconfig-staging.yaml
          retention-days: 1

      - name: Upload Staging Terraform Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-terraform-apply-logs
          path: infra/aws/staging-apply.log
          retention-days: 7

  staging-ansible-deploy:
    name: "Staging: Run Ansible Configuration"
    runs-on: ubuntu-latest
    needs: [staging-terraform-apply]
    if: inputs.skip_staging != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Staging Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig-staging
          path: /tmp/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup CI Dependencies (Ansible + Python)
        run: make setup-ci-deps-ansible

      - name: Install Ansible Collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Validate Playbook Syntax
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig-staging.yaml
        working-directory: ansible
        run: ansible-playbook -i terraform_inventory_aws.py playbooks/site.yml --syntax-check

      - name: Run Ansible Playbook
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig-staging.yaml
        run: make ansible-deploy 2>&1 | tee /tmp/staging-ansible-deploy.log

      - name: Upload Staging Ansible Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-ansible-deploy-logs
          path: /tmp/staging-ansible-deploy.log
          retention-days: 7

  staging-argocd-wait:
    name: "Staging: Wait for ArgoCD Convergence"
    runs-on: ubuntu-latest
    needs: [staging-ansible-deploy]
    if: inputs.skip_staging != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Staging Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig-staging
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Wait for ArgoCD Sync + Health
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig-staging.yaml
        run: make validate-argocd-synced

  staging-smoke-test:
    name: "Staging: Smoke Tests"
    runs-on: ubuntu-latest
    needs: [staging-argocd-wait]
    if: inputs.skip_staging != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Staging Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig-staging
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Run Smoke Tests
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig-staging.yaml
        run: make smoke-test 2>&1 | tee /tmp/staging-smoke-test.log

      - name: Upload Staging Smoke Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-test-logs
          path: /tmp/staging-smoke-test.log
          retention-days: 7

  staging-e2e-tests:
    name: "Staging: E2E Full Suite"
    runs-on: ubuntu-latest
    needs: [staging-argocd-wait]
    if: inputs.skip_staging != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Staging Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig-staging
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Setup bats Testing Framework
        run: make setup-ci-deps-bats

      - name: Run E2E Tests
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig-staging.yaml
        run: make test-e2e-post-deploy 2>&1 | tee /tmp/staging-e2e-test.log

      - name: Upload Staging E2E Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-test-logs
          path: /tmp/staging-e2e-test.log
          retention-days: 7

  staging-velero-restore-test:
    name: "Staging: Velero Backup + Restore Validation"
    runs-on: ubuntu-latest
    needs: [staging-argocd-wait]
    if: inputs.skip_staging != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Staging Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig-staging
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Run Velero Restore Test
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig-staging.yaml
        run: make test-velero-restore 2>&1 | tee /tmp/staging-velero-restore.log

      - name: Upload Staging Velero Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-velero-restore-logs
          path: /tmp/staging-velero-restore.log
          retention-days: 7

  staging-gate:
    name: "Staging: Aggregate Test Results"
    runs-on: ubuntu-latest
    needs: [staging-smoke-test, staging-e2e-tests, staging-velero-restore-test]
    if: always() && inputs.skip_staging != 'true'
    steps:
      - name: Check Staging Tests
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          failed = [
              name for name, data in needs.items()
              if data['result'] != 'success'
          ]
          if failed:
              print('❌ Staging FAILED or SKIPPED:', ', '.join(failed))
              sys.exit(1)
          print('✅ Staging tests passed — proceeding to cleanup + approval gate')
          "

  staging-cleanup:
    name: "Staging: Destroy Ephemeral Workspace"
    runs-on: ubuntu-latest
    needs: [staging-terraform-apply, staging-gate]
    if: always() && inputs.skip_staging != 'true' && needs.staging-terraform-apply.result == 'success'
    environment: staging-deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-apply
          aws-region: us-east-1

      - name: Setup CI Dependencies (SOPS)
        run: make setup-ci-deps-terraform

      - name: Initialize Terraform
        working-directory: infra/aws
        run: terraform init

      - name: Select staging workspace
        working-directory: infra/aws
        run: terraform workspace select staging

      - name: Destroy Staging
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          terraform destroy -auto-approve -lock=true \
            -var-file=staging.tfvars 2>&1 | tee staging-destroy.log

      - name: Verify Staging Cleanup (EC2 + ENI + IAM + SG)
        env:
          AWS_REGION: us-east-1
        run: python3 bin/verify_aws_rollback.py

      - name: Upload Staging Destroy Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-destroy-logs
          path: infra/aws/staging-destroy.log
          retention-days: 30

  # ============================================================================
  # PROD PLAN — generate the exact plan a reviewer will approve
  # ----------------------------------------------------------------------------
  # The plan binary is the source of truth that `terraform-apply` consumes.
  # If state shifts between this job and apply (e.g., someone runs apply
  # locally), `terraform apply plan.tfplan` will fail with a state mismatch
  # — that is the desired behavior; re-run the workflow to re-plan.
  # ============================================================================
  terraform-plan-prod:
    name: "Prod: Generate Terraform Plan (for approval)"
    runs-on: ubuntu-latest
    needs: [validate-gate, staging-cleanup]
    if: always() && inputs.skip_staging != 'true' && needs.staging-cleanup.result == 'success'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials (OIDC, plan-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Setup CI Dependencies (SOPS)
        run: make setup-ci-deps-terraform

      - name: Initialize Terraform
        working-directory: infra/aws
        run: terraform init

      - name: Generate Plan
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          terraform plan -lock=false -out=plan.tfplan 2>&1 | tee plan.log
          terraform show -no-color plan.tfplan > plan.txt

      - name: Upload Plan Binary (for apply step)
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod
          path: infra/aws/plan.tfplan
          retention-days: 1

      - name: Upload Plan Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod-logs
          path: |
            infra/aws/plan.log
            infra/aws/plan.txt
          retention-days: 7

      - name: Post Plan Summary on Commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/aws/plan.txt', 'utf8');
            const body = plan.length > 60000
              ? plan.slice(0, 60000) + '\n...(truncated, see workflow artifact terraform-plan-prod-logs)'
              : plan;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## Terraform Plan — awaiting prod approval\n\n\`\`\`\n${body}\n\`\`\``,
            });

  # ============================================================================
  # MANUAL APPROVAL GATE
  # ----------------------------------------------------------------------------
  # Requires reviewer approval (configured at GitHub UI: Settings → Environments
  # → production-approval → required reviewers). Skipped only when
  # workflow_dispatch input skip_staging=true (emergency hotfix path).
  # Reviewers should inspect the plan posted as a commit comment by
  # `terraform-plan-prod` before approving.
  # ============================================================================
  await-prod-approval:
    name: "Approval: Promote staging → prod"
    runs-on: ubuntu-latest
    needs: [staging-cleanup, terraform-plan-prod]
    if: inputs.skip_staging != 'true'
    environment: production-approval
    steps:
      - name: Approval Granted
        run: echo "✅ Reviewer approved — proceeding with prod deploy"

  # ============================================================================
  # PRE-DEPLOY VELERO BACKUP — capture live state before infra changes.
  # ----------------------------------------------------------------------------
  # Terraform can replace EC2 instances (e.g., instance type bump), wiping
  # ephemeral state. The post-deploy restore test only proves the loop
  # works on the *new* cluster — it doesn't preserve the rollback target.
  # No-op (exit 0) if cluster is unreachable (first deploy / post-destroy).
  # ============================================================================
  pre-deploy-backup:
    name: "Pre-Deploy: Velero Snapshot of Live State"
    runs-on: ubuntu-latest
    needs: [validate-gate, await-prod-approval]
    if: always() && needs.validate-gate.result == 'success' && (inputs.skip_staging == 'true' || needs.await-prod-approval.result == 'success')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CI Dependencies
        run: |
          make setup-ci-deps-terraform
          make setup-ci-deps-kubernetes
          make setup-ci-deps-ansible

      - name: Configure AWS Credentials (OIDC, plan-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Generate Live Kubeconfig (best-effort)
        id: kubeconfig
        continue-on-error: true
        run: |
          make k8s-kubeconfig
          test -f /tmp/k3s-homelab-kubeconfig.yaml

      - name: Install Velero CLI
        if: steps.kubeconfig.outcome == 'success'
        run: |
          VELERO_VERSION="v1.13.2"
          curl -fsSL -o /tmp/velero.tar.gz \
            "https://github.com/vmware-tanzu/velero/releases/download/${VELERO_VERSION}/velero-${VELERO_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/velero.tar.gz -C /tmp/
          sudo install -m 0755 "/tmp/velero-${VELERO_VERSION}-linux-amd64/velero" /usr/local/bin/velero
          velero version --client-only

      - name: Take Pre-Deploy Backup
        if: steps.kubeconfig.outcome == 'success'
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
          GIT_SHA: ${{ github.sha }}
        run: python3 bin/velero_pre_deploy_backup.py | tee /tmp/pre-deploy-backup.log

      - name: Skip Notice (no live cluster)
        if: steps.kubeconfig.outcome != 'success'
        run: echo "ℹ️  No reachable cluster — pre-deploy backup skipped (likely first deploy)."

      - name: Upload Backup Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup-logs
          path: /tmp/pre-deploy-backup.log
          if-no-files-found: ignore
          retention-days: 30

  # ============================================================================
  # TERRAFORM APPLY (Makefile as source of truth)
  # ============================================================================
  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs: [validate-gate, await-prod-approval, pre-deploy-backup]
    if: always() && needs.validate-gate.result == 'success' && needs.pre-deploy-backup.result == 'success' && (inputs.skip_staging == 'true' || needs.await-prod-approval.result == 'success')
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-apply
          aws-region: us-east-1

      - name: Setup CI Dependencies (SOPS)
        run: make setup-ci-deps-terraform

      - name: Initialize Terraform
        working-directory: infra/aws
        run: terraform init

      # In normal flow we apply the binary plan that the reviewer already
      # approved. In emergency mode (workflow_dispatch skip_staging=true)
      # there is no plan artifact, so we fall back to -auto-approve.
      - name: Download Pre-Approved Plan (skipped in emergency mode)
        if: inputs.skip_staging != 'true'
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod
          path: infra/aws/

      - name: Apply Terraform Configuration
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -f plan.tfplan ]; then
            echo "✅ Applying pre-approved plan (plan.tfplan)..."
            terraform apply -lock=true plan.tfplan 2>&1 | tee apply.log
          else
            echo "⚠️  Emergency mode: applying with -auto-approve (no plan artifact)..."
            terraform apply -auto-approve -lock=true 2>&1 | tee apply.log
          fi

      - name: Export Kubeconfig
        working-directory: infra/aws
        run: |
          terraform output -raw kubeconfig_content > /tmp/k3s-homelab-kubeconfig.yaml
          chmod 600 /tmp/k3s-homelab-kubeconfig.yaml
          export KUBECONFIG=/tmp/k3s-homelab-kubeconfig.yaml
          kubectl cluster-info --request-timeout=5s || exit 1

      - name: Upload Kubeconfig Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubeconfig
          path: /tmp/k3s-homelab-kubeconfig.yaml
          retention-days: 1

      - name: Upload Terraform Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-logs
          path: infra/aws/apply.log
          retention-days: 7

  # ============================================================================
  # ANSIBLE DEPLOY (Makefile as source of truth)
  # ============================================================================
  ansible-deploy:
    name: Run Ansible Configuration
    runs-on: ubuntu-latest
    needs: [terraform-apply]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig
          path: /tmp/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup CI Dependencies (Ansible + Python)
        run: make setup-ci-deps-ansible

      - name: Install Ansible Collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Validate Playbook Syntax
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        working-directory: ansible
        run: ansible-playbook -i terraform_inventory_aws.py playbooks/site.yml --syntax-check

      - name: Run Ansible Playbook
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make ansible-deploy 2>&1 | tee /tmp/ansible-deploy.log

      - name: Upload Ansible Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-deploy-logs
          path: /tmp/ansible-deploy.log
          retention-days: 7

  # ============================================================================
  # WAIT FOR ARGOCD CONVERGENCE (Makefile as source of truth)
  # ============================================================================
  argocd-wait:
    name: Wait for ArgoCD Convergence
    runs-on: ubuntu-latest
    needs: [ansible-deploy]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Wait for ArgoCD Sync + Health
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make validate-argocd-synced

      - name: Verify Core Namespaces
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: |
          for ns in argocd monitoring adguard golink otel-collector; do
            kubectl get namespace "$ns" >/dev/null 2>&1 || {
              echo "❌ Namespace not found: $ns"
              exit 1
            }
            echo "✅ Namespace exists: $ns"
          done

  # ============================================================================
  # OBSERVABILITY GATE — query Prometheus for silent failures post-sync.
  # ----------------------------------------------------------------------------
  # ArgoCD's "Healthy" signal misses pods that crash within seconds of sync.
  # This gate port-forwards Prometheus and asserts no OOM, no unavailable
  # replicas, and no CrashLoopBackOff over a 5-minute observation window.
  # ============================================================================
  observability-gate:
    name: Observability Gate (Prometheus quiescence)
    runs-on: ubuntu-latest
    needs: [argocd-wait]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Port-forward Prometheus
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: |
          kubectl -n prometheus port-forward svc/prometheus 9090:9090 \
            >/tmp/prom-pf.log 2>&1 &
          echo $! > /tmp/prom-pf.pid
          # Wait up to 30s for the port to accept connections.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/-/ready >/dev/null; then
              echo "✓ Prometheus ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Prometheus port-forward never became ready"
          cat /tmp/prom-pf.log
          exit 1

      - name: Run Observability Gate
        env:
          PROMETHEUS_URL: http://localhost:9090
          OBSERVATION_WINDOW: "300"
        run: python3 bin/post_deploy_observability_gate.py | tee /tmp/observability-gate.log

      - name: Stop Port-forward
        if: always()
        run: |
          if [ -f /tmp/prom-pf.pid ]; then
            kill "$(cat /tmp/prom-pf.pid)" 2>/dev/null || true
          fi

      - name: Upload Gate Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-gate-logs
          path: |
            /tmp/observability-gate.log
            /tmp/prom-pf.log
          retention-days: 7

  # ============================================================================
  # VELERO RESTORE TEST (DR validation)
  # ============================================================================
  velero-restore-test:
    name: Velero Backup + Restore Validation
    runs-on: ubuntu-latest
    needs: [argocd-wait]
    # Implicit `if: success()` — never run against an incomplete deploy.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Run Velero Restore Test
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make test-velero-restore 2>&1 | tee /tmp/velero-restore.log

      - name: Upload Velero Restore Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velero-restore-logs
          path: /tmp/velero-restore.log
          retention-days: 7

  # ============================================================================
  # SMOKE TESTS (20+ checks)
  # ============================================================================
  smoke-test:
    name: Smoke Tests (20+ checks)
    runs-on: ubuntu-latest
    needs: [argocd-wait]
    # Implicit `if: success()` — never validate an incomplete cluster.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Run Smoke Tests
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make smoke-test 2>&1 | tee /tmp/smoke-test.log

      - name: Upload Smoke Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: /tmp/smoke-test.log
          retention-days: 7

  # ============================================================================
  # E2E TESTS (40+ BATS test cases via Makefile)
  # ============================================================================
  e2e-tests:
    name: E2E Full Suite (40+ tests)
    runs-on: ubuntu-latest
    needs: [argocd-wait]
    # Implicit `if: success()` — never run E2E against an incomplete deploy.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Kubeconfig
        uses: actions/download-artifact@v4
        with:
          name: kubeconfig
          path: /tmp/

      - name: Setup Kubernetes Tools
        run: make setup-ci-deps-kubernetes

      - name: Setup bats Testing Framework
        run: make setup-ci-deps-bats

      - name: Run E2E Tests
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make test-e2e-post-deploy 2>&1 | tee /tmp/e2e-test.log

      - name: Upload E2E Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/e2e-test.log
          retention-days: 7

  # ============================================================================
  # DEPLOYMENT GATE (Aggregate Results)
  # ============================================================================
  deployment-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: [observability-gate, smoke-test, e2e-tests, velero-restore-test]
    if: always()
    permissions:
      statuses: write
    steps:
      - name: Check All Tests Passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          # A skipped post-deploy test is NOT a pass. Require explicit success.
          failed = [
              name for name, data in needs.items()
              if data['result'] != 'success'
          ]
          if failed:
              print('❌ FAILED or SKIPPED tests:', ', '.join(failed))
              sys.exit(1)
          print('✅ All E2E tests passed — cluster is production-ready')
          "

      - name: Create Deployment Status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              description: 'All E2E tests passed - deployment successful',
              context: 'cd/deployment-complete',
            });

  # ============================================================================
  # ROLLBACK (on test failure via Makefile)
  # ============================================================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deployment-gate]
    if: failure()
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-apply
          aws-region: us-east-1

      - name: Setup CI Dependencies (SOPS)
        run: make setup-ci-deps-terraform

      - name: Initialize Terraform
        working-directory: infra/aws
        run: terraform init

      - name: Destroy Infrastructure (Rollback)
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          echo "🚨 E2E tests failed — initiating automatic rollback..."
          terraform destroy -auto-approve -lock=true 2>&1 | tee destroy.log
          echo "✅ terraform destroy command completed — verifying..."

      - name: Verify Rollback Succeeded (EC2 + ENI + IAM + SG)
        env:
          AWS_REGION: us-east-1
        run: python3 bin/verify_aws_rollback.py

      - name: Upload Destroy Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-logs
          path: infra/aws/destroy.log
          retention-days: 30

      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deployment Rollback: E2E Test Failure',
              body: `Commit: \`${context.sha}\`\n\nE2E tests failed after deployment. Automatic rollback initiated. Check artifacts for logs:\n- smoke-test-logs\n- e2e-test-logs\n- rollback-logs`,
              labels: ['deployment', 'failure', 'e2e-tests'],
            });

      - name: Create Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              description: 'E2E tests failed - deployment rolled back',
              context: 'cd/rollback-complete',
            });
