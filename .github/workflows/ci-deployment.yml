name: CD Pipeline — Terraform Apply

# Scope: this workflow provisions AWS infrastructure ONLY. It does NOT run
# ansible-deploy or post-deploy validation (smoke/e2e/velero-restore). After
# `terraform-apply` succeeds, the operator runs the rest from a workstation
# already on the tailnet:
#
#   make ansible-deploy
#   make smoke-test
#   make test-e2e-post-deploy
#   make test-velero-restore
#
# Why split (see docs/operations/terraform.md "CI vs operator responsibilities"):
#   1. k3s API server only listens on the server's Tailscale IP (CGNAT). A stock
#      GitHub-hosted runner can't reach it without TS_AUTH_KEY, and adding a
#      long-lived tailnet auth key as a CI secret on a PUBLIC repo is a pivot
#      risk we don't accept.
#   2. Ansible's `community.aws.aws_ssm` connection plugin needs IAM perms
#      (ssm:StartSession, S3 transfer bucket, etc.) that are intentionally
#      out of scope for the terraform-apply role's permissions boundary.
#   3. The k3s kubeconfig is generated by Ansible (slurp from the server +
#      rewrite the API endpoint to the Tailscale IP). It cannot be exposed
#      via a Terraform output, because k3s isn't installed at the time
#      `terraform apply` finishes — Ansible installs it next.
#
# Prerequisites:
#   - AWS_ACCOUNT_ID repository variable (gh variable set AWS_ACCOUNT_ID ...)
#   - SOPS_AGE_KEY repository secret
#   - GitHub OIDC provider + roles in AWS (infra/aws-oidc/, applied once)
#   - GitHub Environment "production-approval" with required reviewer
#   - ci-validation.yml must pass first (enforced via branch protection)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: "prod"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # GATE: Validation must have passed first (enforced via branch protection)
  # ============================================================================
  validate-gate:
    name: Wait for Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Validation Pipeline Status
        run: |
          echo "✅ CI validation gate must pass before deployment proceeds."
          echo "   Branch protection rules on the source branch enforce this."

  # ============================================================================
  # PROD PLAN — generate the exact plan a reviewer will approve
  # ----------------------------------------------------------------------------
  # The plan binary is the source of truth that `terraform-apply` consumes.
  # If state shifts between this job and apply (e.g., someone runs apply
  # locally), `terraform apply plan.tfplan` will fail with a state mismatch
  # — that is the desired behavior; re-run the workflow to re-plan.
  # ============================================================================
  terraform-plan-prod:
    name: "Prod: Generate Terraform Plan (for approval)"
    runs-on: ubuntu-latest
    needs: [validate-gate]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials (OIDC, plan-only role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Setup CI Dependencies (SOPS)
        run: make setup-ci-deps-terraform

      - name: Initialize Terraform
        working-directory: infra/aws
        run: terraform init

      - name: Generate Plan
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          terraform plan -lock=false -out=plan.tfplan 2>&1 | tee plan.log
          terraform show -no-color plan.tfplan > plan.txt

      - name: Upload Plan Binary (for apply step)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-prod
          path: infra/aws/plan.tfplan
          retention-days: 1

      - name: Upload Plan Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-prod-logs
          path: |
            infra/aws/plan.log
            infra/aws/plan.txt
          retention-days: 7

  # ============================================================================
  # MANUAL APPROVAL GATE
  # ----------------------------------------------------------------------------
  # Reviewer inspects the plan via the workflow artifact `terraform-plan-prod-logs`
  # (download `plan.txt` from the GitHub Actions run page) before approving.
  # Configured at GitHub UI: Settings → Environments → production-approval →
  # required reviewers.
  # ============================================================================
  await-prod-approval:
    name: "Approval: Reviewer approves plan"
    runs-on: ubuntu-latest
    needs: [terraform-plan-prod]
    environment: production-approval
    steps:
      - name: Approval Granted
        run: echo "✅ Reviewer approved — proceeding with prod terraform-apply"

  # ============================================================================
  # TERRAFORM APPLY (only mutating step in this workflow)
  # ----------------------------------------------------------------------------
  # Applies the pre-approved plan binary. After this succeeds, the cluster's
  # EC2 instances exist but k3s/Ansible have not run yet — the operator must
  # run `make ansible-deploy` from a workstation on the tailnet to finish the
  # deployment and produce a working kubeconfig.
  # ============================================================================
  terraform-apply:
    name: Apply Terraform
    runs-on: ubuntu-latest
    needs: [validate-gate, await-prod-approval]
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-apply
          aws-region: us-east-1

      - name: Setup CI Dependencies (SOPS)
        run: make setup-ci-deps-terraform

      - name: Initialize Terraform
        working-directory: infra/aws
        run: terraform init

      - name: Download Pre-Approved Plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terraform-plan-prod
          path: infra/aws/

      # Re-plan immediately before apply. terraform itself errors with
      # "Saved plan is stale" if state shifted since the artifact was made
      # — but the failure happens deep inside terraform apply, not at this
      # gate. Running a refresh-only plan here surfaces drift earlier with
      # a clearer message, *before* any resource is mutated.
      - name: Pre-apply state sanity (detect plan staleness)
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set +e
          terraform plan -lock=false -input=false -refresh=true \
            -detailed-exitcode -out=preapply-check.tfplan \
            > preapply-check.log 2>&1
          rc=$?
          set -e
          # detailed-exitcode: 0=no diff, 1=error, 2=diff present
          if [ "$rc" = "1" ]; then
            echo "❌ Pre-apply re-plan failed — state may be unreadable or providers"
            echo "   misconfigured. Fix root cause before re-running deploy."
            tail -100 preapply-check.log || true
            exit 1
          fi
          if [ "$rc" = "0" ]; then
            echo "ℹ️  Re-plan shows no changes — state may already match the desired"
            echo "   configuration. Proceeding to apply (idempotent no-op)."
          else
            echo "✅ Re-plan completed with expected diffs — proceeding to apply."
          fi
          rm -f preapply-check.tfplan

      - name: Apply Terraform Configuration
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        # set -o pipefail is REQUIRED — without it, `tee` masks a failed
        # apply by always returning 0. A 2026-05-04 deploy reported success
        # while terraform errored "Cannot apply incomplete plan" mid-pipeline,
        # leaving prod state unmodified but the workflow green. Future
        # operators trust the green check; the silent failure mode is worse
        # than a noisy one.
        run: |
          set -o pipefail
          terraform apply -lock=true plan.tfplan 2>&1 | tee apply.log

      - name: Operator Handoff Notice
        run: |
          cat <<'EOF'
          ✅ Terraform apply succeeded — infrastructure provisioned.

          NEXT STEPS (operator workstation, must be on the tailnet):

            make ansible-deploy
            make smoke-test
            make test-e2e-post-deploy
            make test-velero-restore   # optional DR drill

          The cluster's k3s API only listens on the server's Tailscale IP, so
          these steps cannot run from a stock GitHub-hosted runner. See
          docs/operations/terraform.md "CI vs operator responsibilities".
          EOF

      - name: Upload Terraform Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-apply-logs
          path: infra/aws/apply.log
          retention-days: 7
