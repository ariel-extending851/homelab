name: CI Validation

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # TERRAFORM VALIDATION (AWS Infrastructure)
  # ============================================================================
  terraform:
    name: Terraform Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7" # Pinned for stability

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format
        run: terraform fmt -check -diff

      - name: TFLint Init
        run: tflint --init

      - name: TFLint Run
        run: tflint --format=compact

  # ============================================================================
  # YAML LINTING (Kubernetes, Ansible, Docker Compose)
  # ============================================================================
  yaml-lint:
    name: YAML Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
          strict: false

  # ============================================================================
  # BASH SCRIPT ANALYSIS (Automation Scripts)
  # ============================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: "."

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ⚠️ CRÍTICO: Necessário para o TruffleHog olhar o histórico

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # For pull_request: compare PR base to PR head.
          # For push: compare previous commit to current; if `before` is all-zero, fallback to default branch.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch) }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

  # ============================================================================
  # PIPELINE GATE (Aggregate Status Check)
  # ============================================================================
  # This job serves as the single status check required by branch protection.
  # It only passes if all upstream jobs succeed.
  pipeline-gate:
    name: Pipeline Gate
    runs-on: ubuntu-latest
    needs: [terraform, yaml-lint, shellcheck, security]
    steps:
      - name: All Checks Passed
        run: echo "✅ All CI validation checks passed successfully"
