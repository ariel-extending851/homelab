name: CI Validation

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

# Default permissions for all jobs. Individual jobs can widen via
# their own `permissions:` block — none currently need more than read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_CACHE_DIR: ~/.cache/mise
  MISE_FETCH_TIMEOUT: 300
  # mise calls the GitHub API to resolve tool versions; pass the auto-generated
  # token so unauthenticated rate limits (60/h per IP, shared across runners)
  # don't sporadically break setup-ci-deps-* targets.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  terraform:
    name: "Terraform: Validate + Test"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-terraform-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-terraform-

      - name: Setup Terraform dependencies via Makefile
        run: make setup-ci-deps-terraform

      - name: Run Terraform Validation
        run: make validate-terraform-all

      - name: Run Terraform Unit Tests
        run: make validate-terraform-tests

      - name: Run Terraform Guardrail Tests
        run: make test-terraform

  terraform-cost-gate:
    name: "Terraform: Infracost PR Gate"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      MAX_COST_DELTA: "5"
    steps:
      - name: Skip if PR carries 'cost-approved' label
        id: label-check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const hasInfracostApiKey = !!process.env.INFRACOST_API_KEY;
            const skip = labels.includes('cost-approved') || !hasInfracostApiKey;
            core.setOutput('skip', skip ? 'true' : 'false');
            if (labels.includes('cost-approved')) core.notice('cost-approved label set — Infracost gate skipped');
            if (!hasInfracostApiKey) core.notice('INFRACOST_API_KEY is not set — Infracost gate skipped');

      - name: Checkout PR ref
        if: steps.label-check.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Restore Mise Cache
        if: steps.label-check.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-terraform-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-terraform-

      - name: Setup Terraform dependencies via Makefile
        if: steps.label-check.outputs.skip != 'true'
        run: make setup-ci-deps-terraform

      - name: Generate baseline (base ref)
        if: steps.label-check.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add /tmp/base-tree "origin/$BASE_REF"
          BASELINE_OUT=/tmp/infracost-base.json make -C /tmp/base-tree terraform-cost-baseline

      - name: Diff and gate
        if: steps.label-check.outputs.skip != 'true'
        run: BASELINE_JSON=/tmp/infracost-base.json make terraform-cost-diff

      - name: Comment cost diff on PR
        if: steps.label-check.outputs.skip != 'true' && always()
        run: |
          if [ -f /tmp/infracost-diff.json ]; then
            ${MISE_EXEC:-mise exec --} infracost comment github \
              --path /tmp/infracost-diff.json \
              --repo "${GITHUB_REPOSITORY}" \
              --pull-request "${{ github.event.pull_request.number }}" \
              --github-token "${{ secrets.GITHUB_TOKEN }}" \
              --behavior update || echo "infracost comment failed (non-fatal)"
          fi

  yaml-lint:
    name: "YAML: Lint + K8s Schemas"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Self-hosted Pi-4 runner. GitHub Actions does NOT auto-fallback: if no
    # matching runner is online, the job queues until 24h expiry. Verify
    # rasp-pi-04 shows Idle in repo Settings > Actions > Runners before
    # merging changes to this `runs-on:` list.
    runs-on: [self-hosted, arm64, pi-homelab]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Yamllint Dependencies via Makefile
        run: make setup-ci-deps-yamllint

      - name: Run Yamllint via Makefile
        run: make validate-yaml-lint

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-k8s-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-k8s-

      - name: Setup Kubernetes dependencies via Makefile
        run: |
          make setup-ci-deps-kustomize
          make setup-ci-deps-kubeconform

      - name: Run Kubernetes Manifest Validation
        run: make validate-k8s-all

      - name: Setup Conftest via Makefile
        run: make setup-ci-deps-conftest

      - name: Run OPA Policy Checks
        run: make validate-k8s-policies

      - name: Setup Python test dependencies via Makefile
        run: make setup-ci-deps-python

      - name: Run Jinja2 Template Validation via Makefile
        run: make test-templates

      - name: Verify Service Catalog is in sync with k8s/apps/
        run: make check-catalog

      - name: Validate Catalog Scorecard (catalog-info.yaml entities)
        run: make catalog-score

  enforce-molecule-tests:
    name: Enforce Molecule Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Python Runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install PyYAML for idempotence checker
        # Pinned via pyproject.toml [project.optional-dependencies] ci.
        run: python3 -m pip install --quiet -e '.[ci]'

      - name: Validate New Roles Have Molecule Structure
        run: make validate-ansible-structure

      - name: Validate Ansible Idempotence Coverage
        run: make test-ansible-idempotency

  molecule:
    name: "Ansible: Molecule Role Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-ansible-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-ansible-

      - name: Setup Molecule dependencies via Makefile
        run: make setup-ci-deps-molecule

      - name: Setup Python Runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Ansible Collections
        run: make ansible-galaxy-install

      - name: Run Ansible Syntax Validation
        run: make validate-ansible

      - name: Run Ansible Lint (yamllint + ansible-lint)
        run: make test-molecule-lint

      - name: Run Molecule Role Tests
        run: make test-molecule

  shell-tests:
    name: "Shell: Unit Tests"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-shell-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-shell-

      - name: Setup Shell Test Dependencies via Makefile
        run: |
          make setup-ci-deps-bats
          make setup-ci-deps-kustomize

      - name: Run Shell Test Suite
        run: make test-contracts test-shell

  python-tests-collect:
    # PR-fast guard against import-level regressions in the Python test tree.
    # The full python-tests job is nightly-only because coverage runs are slow,
    # but a broken import in a live-only test (e.g., test_velero_restore_live.py)
    # would silently neuter the staging-canary Velero gate in ci-deployment.yml.
    # `pytest --collect-only` is ~5s and catches that class of regression at PR time.
    name: "Python: Test Collection (import guard)"
    # Self-hosted Pi-4 runner: 5s collect, no heavy compute.
    runs-on: [self-hosted, arm64, pi-homelab]
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python Runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pytest + minimal test deps
        # Pinned via pyproject.toml [project.optional-dependencies] ci.
        run: python3 -m pip install --quiet -e '.[ci]'

      - name: Verify all test modules import cleanly
        run: make test-python-collect

  python-tests:
    name: "Python: Unit Tests + Coverage"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python Runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-python-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-python-

      - name: Setup Python test dependencies via Makefile
        run: make setup-ci-deps-python

      - name: Run Python tests with coverage via Makefile
        run: make test-python-ci

      - name: Upload Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Publish Coverage Summary
        if: always()
        run: |
          COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; root = ET.parse('coverage.xml').getroot(); print(f\"{float(root.attrib['line-rate'])*100:.1f}%\")" 2>/dev/null || echo "N/A")
          echo "## Python Test Coverage: ${COVERAGE}" >> "$GITHUB_STEP_SUMMARY"

  arm64-validation:
    name: "ARM64: ${{ matrix.platform }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            safe_platform: linux-arm64
          - platform: linux/arm/v7
            safe_platform: linux-arm-v7
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: ${{ matrix.platform }}

      - name: Setup Python Runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Setup ARM64 validation dependencies via Makefile
        run: make setup-ci-deps-arm64

      - name: Run Molecule Test Suite
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          echo "Testing ${{ matrix.platform }} (QEMU emulated)..."
          make test-molecule 2>&1 | tee "molecule-${{ matrix.safe_platform }}.log"

      - name: Upload Molecule Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: molecule-${{ matrix.safe_platform }}
          path: ansible/roles/*/.molecule/
          retention-days: 7

  sops-validation:
    name: "SOPS: Workflow Validation"
    # Self-hosted Pi-4 runner: sops + age are mise-managed ARM64 binaries.
    runs-on: [self-hosted, arm64, pi-homelab]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-sops-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-sops-

      - name: Setup SOPS dependencies via Makefile
        run: |
          make setup-ci-deps-age
          make setup-ci-deps-terraform
          make setup-ci-deps-bats

      - name: Run SOPS Encrypt/Decrypt Validation
        run: make validate-sops-workflow

      - name: Run SOPS Secret Structure Validation
        run: make test-contracts

  lint-workflows:
    name: "Workflows: actionlint + zizmor"
    # Self-hosted Pi-4 runner: actionlint + zizmor are mise-managed Go binaries.
    runs-on: [self-hosted, arm64, pi-homelab]
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-workflow-lint-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-workflow-lint-

      - name: Setup Workflow Lint Dependencies via Makefile
        run: make setup-ci-deps-workflow-lint

      - name: Run actionlint + zizmor (HIGH severity)
        run: make lint-workflows

  shellcheck:
    name: ShellCheck
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Self-hosted Pi-4 runner: shellcheck is a mise-managed ARM64 binary.
    runs-on: [self-hosted, arm64, pi-homelab]
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup shellcheck dependencies via Makefile
        run: make setup-ci-deps-shellcheck

      - name: Run ShellCheck Validation via Makefile
        run: make validate-shellcheck

  integration-localstack:
    name: "Integration: LocalStack (terraform apply + output schema)"
    # Advisory job — LocalStack free tier has known limitations (no spot);
    # failures here flag drift but must not block PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Start LocalStack via docker-compose
        run: docker compose -f docker-compose.localstack.yml up -d

      - name: Wait for LocalStack health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then
              echo "LocalStack ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become healthy in time"
          exit 1

      - name: Setup tooling (terraform + python)
        run: |
          make setup-ci-deps-terraform
          make setup-ci-deps-python
          pip install --quiet --break-system-packages terraform-local awscli-local

      - name: Run LocalStack integration validator
        run: python3 infra/aws/scripts/validate_localstack.py

      - name: Upload LocalStack logs on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localstack-logs
          path: |
            /tmp/tf-*.log
          if-no-files-found: ignore

      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml down

  security:
    name: Secret Scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@0328a19a9d3877c9f04d0dbee5717aabff5b575d # v3.82.6 # matches .pre-commit-config.yaml rev
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && '' || (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

      - name: Run Security Guardrail Tests
        run: make test-security

  trivy-image-scan:
    name: "Security: Trivy Image Scan (strict, HIGH/CRITICAL blocks)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-trivy-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-trivy-

      - name: Restore Trivy Vulnerability DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Setup Trivy + Python via Makefile
        run: |
          make setup-ci-deps-trivy
          make setup-ci-deps-kustomize
          make setup-ci-deps-python

      - name: Run Trivy Image Scan (strict — fails on HIGH/CRITICAL fixable CVE)
        run: make test-trivy-strict

      - name: Run Trivy Misconfig Scan (advisory — IaC coverage, .trivyignore.yaml filtered)
        if: always()
        run: make test-trivy-config

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: .qa/trivy/
          retention-days: 14

  disaster-recovery-tests:
    name: "Disaster Recovery: Readiness Tests"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Molecule Dependencies via Makefile
        run: make setup-ci-deps-molecule

      - name: Run Disaster Recovery Readiness Tests
        run: make test-dr

  disaster-recovery-execution:
    name: "Disaster Recovery: Real Execution (Molecule)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-dr-execution-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-dr-execution-

      - name: Setup Molecule Dependencies via Makefile
        run: make setup-ci-deps-molecule

      - name: Run Disaster Recovery Execution Tests
        run: make test-dr-execution

  policy-as-code-critical:
    name: "Security: Policy-as-Code Critical Gate"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-policy-critical-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-policy-critical-

      - name: Setup Critical Policy Dependencies via Makefile
        run: |
          make setup-ci-deps-kustomize
          make setup-ci-deps-conftest

      - name: Run Critical Policy Gate
        run: make validate-k8s-policies-critical

      - name: Run OPA Policy Unit Tests (conftest verify on *_test.rego)
        run: make test-k8s-policies-rego

  k8s-dry-run:
    name: "Kubernetes: Dry-Run (kind)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup kind dependencies via Makefile
        run: make setup-ci-deps-kind

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-k8s-dry-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-k8s-dry-

      - name: Setup Kubernetes dependencies via Makefile
        run: |
          make setup-ci-deps-kubernetes
          make setup-ci-deps-kustomize

      - name: Run Kubernetes Dry-Run Validation
        run: make validate-k8s-dry-run

  k3d-convergence:
    # Pre-merge gate: spin up an ephemeral k3d cluster, install ArgoCD,
    # apply the homelab app-of-apps, and assert every Application converges
    # to Synced+Healthy. Closes the gap that `validate-k8s-dry-run` (kind,
    # schema-only) leaves: schema-valid manifests can still fail to converge
    # because of sync waves, CRD ordering, or broken refs.
    name: "Kubernetes: GitOps Convergence (k3d)"
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-k3d-convergence-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-k3d-convergence-

      - name: Setup k3d + Kubernetes dependencies via Makefile
        run: |
          make setup-ci-deps-kubernetes
          make setup-ci-deps-python
          make setup-ci-deps-k3d

      - name: Run k3d GitOps Convergence Test
        env:
          IGNORE_MISSING_SECRET_APPS: "1"
          # The repo is private, so ArgoCD's in-cluster repo-server needs
          # creds to clone. Inject the runner's GITHUB_TOKEN via the URL
          # using x-access-token basic-auth. Token is auto-masked in logs
          # and expires at job end (any leaked clone-URL artifact is dead
          # within minutes). `contents: read` (the minimum permission
          # granted to every workflow run, including dependabot context)
          # is sufficient for `git clone` / `git fetch`.
          K3D_REPO_URL_OVERRIDE: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # Pin to the actual PR head — tests THIS branch's GitOps tree,
          # not develop's. github.event.pull_request.head.sha is set on PR
          # events; falls through to github.sha for push/dispatch.
          K3D_TARGET_REVISION_OVERRIDE: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: make test-k3d-convergence

      # The diagnostic dump now happens INSIDE the test (in a
      # try/finally) so kubectl still has a cluster to query. By the
      # time this step runs, the k3d cluster has already been torn down
      # by the pytest fixture's finally:. We just need to upload what
      # the test wrote to /tmp/k3d-failure-state/.
      - name: Upload Failure Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k3d-convergence-state-${{ github.run_id }}
          path: /tmp/k3d-failure-state/
          if-no-files-found: ignore
          retention-days: 14

  terraform-plan:
    name: "Terraform: Plan (OIDC)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [terraform]
    if: >
      vars.AWS_ACCOUNT_ID != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform Runtime
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.0"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-terraform-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-terraform-

      - name: Setup SOPS Dependency
        run: |
          if ! command -v mise &> /dev/null; then
            curl https://mise.jdx.dev/install.sh | sh
          fi
          export PATH="$HOME/.local/bin:$PATH"
          mise install sops

      - name: Run Terraform Init
        working-directory: infra/aws
        run: terraform init

      - name: Run Terraform Plan
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: terraform plan -lock=false -no-color 2>&1 | tee plan.txt

      - name: Publish Terraform Plan Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/aws/plan.txt', 'utf8');
            const body = plan.length > 65000 ? plan.slice(0, 65000) + '\n...(truncado)' : plan;
             github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${body}\n\`\`\``,
            });

  qa-audit-evidence:
    name: "QA: Sequential Audit Evidence"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bats Dependency via Makefile
        run: make setup-ci-deps-bats

      - name: Run QA Audit Sequence
        run: make qa-audit

      - name: Generate QA Scorecard (14-run history)
        run: make qa-scorecard

      - name: Enforce Required No-Skip Policy
        run: make qa-verify-required-no-skips

      - name: Enforce QA Duration Budgets
        run: make qa-verify-duration-budgets

      - name: Upload QA Evidence Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-audit-evidence
          path: |
            .qa/evidence/qa-audit-*.md
            .qa/evidence/qa-audit-*.json
            .qa/evidence/qa-scorecard-*.md
            .qa/evidence/qa-scorecard-*.json
            .qa/evidence/qa-audit-latest.md
            .qa/evidence/qa-scorecard-latest.md
            .qa/evidence/qa-scorecard-latest.json
            .qa/evidence/logs-*/
          retention-days: 14

  offline-required-profile:
    name: "QA: Offline Required Profile"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore Mise Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.mise
            ~/.cache/mise
          key: mise-offline-required-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-offline-required-

      - name: Setup CI Dependencies via Makefile
        run: make setup-ci-deps-all

      - name: Install Ansible Collections
        run: make ansible-galaxy-install

      - name: Run Offline Required QA Profile
        run: make test-offline-required

  nightly-e2e-live:
    name: "Nightly: Mandatory Live E2E"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Terraform Dependencies via Makefile
        run: make setup-ci-deps-terraform

      - name: Setup Kubernetes Dependencies via Makefile
        run: |
          make setup-ci-deps-kubernetes
          make setup-ci-deps-bats

      - name: Setup Ansible Dependencies via Makefile
        run: |
          make setup-ci-deps-ansible
          make ansible-galaxy-install

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Generate Live Kubeconfig via Makefile
        run: |
          make k8s-kubeconfig
          test -f /tmp/k3s-homelab-kubeconfig.yaml
          kubectl --kubeconfig=/tmp/k3s-homelab-kubeconfig.yaml cluster-info --request-timeout=15s

      - name: Live Test Preflight
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make test-live-preflight

      - name: Run Mandatory Nightly Live E2E
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make test-e2e-live-nightly

      - name: Upload Nightly E2E Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-live-e2e-evidence
          path: .qa/evidence/
          retention-days: 14

  pipeline-gate-pr:
    name: Pipeline Gate
    runs-on: ubuntu-latest
    needs: [terraform, terraform-plan, yaml-lint, k8s-dry-run, shellcheck, lint-workflows, security, trivy-image-scan, policy-as-code-critical, disaster-recovery-tests, disaster-recovery-execution, enforce-molecule-tests, molecule, shell-tests, python-tests, python-tests-collect, arm64-validation, sops-validation, qa-audit-evidence, offline-required-profile, nightly-e2e-live]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: Validate Required Job Outcomes
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          required_success = {
            'k8s-dry-run',
            'disaster-recovery-execution',
            'molecule',
            'policy-as-code-critical',
            'trivy-image-scan',
            'arm64-validation',
            'sops-validation',
            'qa-audit-evidence',
            'offline-required-profile',
            'python-tests-collect',
          }

          failed = []
          for name, data in needs.items():
            result = data['result']
            if name in required_success:
              if result != 'success':
                failed.append(f'{name}={result}')
            elif result not in ('success', 'skipped'):
              failed.append(f'{name}={result}')

          if failed:
            print('[FAIL] Pipeline gate failed:', ', '.join(failed))
            sys.exit(1)
          print('[OK] Required jobs passed; optional jobs are success/skipped')
          "

  pipeline-gate-nightly:
    name: Pipeline Gate (Nightly)
    runs-on: ubuntu-latest
    needs: [terraform, terraform-plan, yaml-lint, k8s-dry-run, shellcheck, lint-workflows, security, trivy-image-scan, policy-as-code-critical, disaster-recovery-tests, disaster-recovery-execution, enforce-molecule-tests, molecule, shell-tests, python-tests, python-tests-collect, arm64-validation, sops-validation, qa-audit-evidence, offline-required-profile, nightly-e2e-live]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Validate Nightly Required Outcomes
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          required_success = {
            'terraform',
            'yaml-lint',
            'k8s-dry-run',
            'shellcheck',
            'security',
            'trivy-image-scan',
            'policy-as-code-critical',
            'disaster-recovery-tests',
            'disaster-recovery-execution',
            'enforce-molecule-tests',
            'molecule',
            'shell-tests',
            'python-tests',
            'arm64-validation',
            'sops-validation',
            'qa-audit-evidence',
            'offline-required-profile',
            'nightly-e2e-live',
            'lint-workflows',
          }

          failed = []
          for name, data in needs.items():
            result = data['result']
            if name in required_success:
              if result != 'success':
                failed.append(f'{name}={result}')
            elif result not in ('success', 'skipped'):
              failed.append(f'{name}={result}')

          if failed:
            print('[FAIL] Nightly pipeline gate failed:', ', '.join(failed))
            sys.exit(1)
          print('[OK] Nightly required jobs passed; optional jobs are success/skipped')
          "
