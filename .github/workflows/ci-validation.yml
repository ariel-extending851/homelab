name: CI Validation

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # TERRAFORM VALIDATION (AWS Infrastructure)
  # Installs tools, then delegates all logic to: make validate-terraform-all
  # ============================================================================
  terraform:
    name: Terraform Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7" # Pinned for stability

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Validate all Terraform modules (validate + fmt + tflint)
        run: make validate-terraform-all

  # ============================================================================
  # YAML LINTING + KUBERNETES MANIFEST VALIDATION
  # yamllint uses the action for PR annotations; k8s validation via make.
  # ============================================================================
  yaml-lint:
    name: YAML Syntax + K8s Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint
          strict: false

      - name: Install kustomize
        run: |
          sudo rm -f /usr/local/bin/kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- /usr/local/bin

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate all Kubernetes manifests (kustomize + kubeconform)
        run: make validate-k8s-all

      - name: Install Python template validation deps
        run: pip install --quiet jinja2 pyyaml

      - name: Validate k3s Jinja2 templates
        run: make test-templates

  # ============================================================================
  # ANSIBLE ROLE TESTS (Molecule — offline Docker-based)
  # Also runs validate-ansible (syntax-check all playbooks) — was missing from CI.
  # ============================================================================
  molecule:
    name: Molecule Role Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Molecule and dependencies
        run: |
          pip install --quiet \
            molecule \
            molecule-plugins[docker] \
            ansible \
            ansible-lint \
            yamllint

      - name: Validate Ansible playbook syntax (all playbooks)
        run: make validate-ansible

      - name: Run ArgoCD role tests
        run: make test-molecule-argocd

      - name: Run k3s role tests
        run: make test-molecule-k3s

      - name: Run rpi_optimization role tests
        run: make test-molecule-rpi

      - name: Run tailscale role tests
        run: make test-molecule-tailscale

      - name: Run gatekeeper role tests
        run: make test-molecule-gatekeeper

      - name: Run emergency_recovery role tests
        run: make test-molecule-emergency-recovery

  # ============================================================================
  # SHELL UNIT TESTS (bats — deploy script functions + contract tests)
  # ============================================================================
  shell-tests:
    name: Shell Unit Tests (bats)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install bats
        uses: bats-core/bats-action@3.0.0

      - name: Install kustomize (required by contract tests)
        run: |
          sudo rm -f /usr/local/bin/kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- /usr/local/bin

      - name: Run deploy script function tests
        run: make test-shell

      - name: Run contract tests (App-of-Apps path + SOPS structure)
        run: make test-contracts

  # ============================================================================
  # PYTHON UNIT TESTS
  # ============================================================================
  python-tests:
    name: Python Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --quiet pytest boto3

      - name: Run Python tests
        run: make test-python

  # ============================================================================
  # SOPS WORKFLOW VALIDATION
  # Installs age + sops, then delegates to Makefile targets.
  # ============================================================================
  sops-validation:
    name: SOPS Workflow Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install age
        run: |
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin age/age age/age-keygen

      - name: Install SOPS
        run: |
          curl -sLO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          install -m 0755 sops-v3.9.4.linux.amd64 /usr/local/bin/sops

      - name: Install bats (required by test-contracts)
        uses: bats-core/bats-action@3.0.0

      - name: Validate SOPS encrypt/decrypt workflow
        run: make validate-sops-workflow

      - name: Validate committed SOPS secret structure
        run: make test-contracts

  # ============================================================================
  # BASH SCRIPT ANALYSIS
  # Uses GitHub Action for PR annotations — make validate-shellcheck for local use.
  # ============================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: "."

  # ============================================================================
  # SECRET SCAN
  # TruffleHog requires full git history — kept as GitHub Action only.
  # ============================================================================
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ⚠️ CRÍTICO: Necessário para o TruffleHog olhar o histórico

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # For pull_request: compare PR base to PR head.
          # For workflow_dispatch: scan full history by using an empty base to avoid identical base/head.
          # For push: compare previous commit to current; if `before` is all-zero, empty, or missing, fallback to default branch.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event_name == 'workflow_dispatch' && ''
            || (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before)
            || github.event.repository.default_branch }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

  # ============================================================================
  # TERRAFORM PLAN (OIDC — real AWS state, requires GitHub secrets)
  # Kept as inline steps — uses OIDC credentials + real backend, not replicable locally.
  # ============================================================================
  terraform-plan:
    name: Terraform Plan (OIDC)
    runs-on: ubuntu-latest
    needs: [terraform]
    # Skip on pull_requests from forks — secrets are not available there.
    if: >
      vars.AWS_ACCOUNT_ID != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      id-token: write   # Required for OIDC token exchange
      contents: read
      pull-requests: write  # Required to comment plan output on PRs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0" # >= 1.10 required by use_lockfile=true in backend

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Install SOPS
        run: |
          curl -sLO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          install -m 0755 sops-v3.9.4.linux.amd64 /usr/local/bin/sops

      - name: Terraform Init
        working-directory: infra/aws
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/aws
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: terraform plan -lock=false -no-color 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/aws/plan.txt', 'utf8');
            const body = plan.length > 65000 ? plan.slice(0, 65000) + '\n...(truncado)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`\n${body}\n\`\`\``,
            });

  # ============================================================================
  # PIPELINE GATE (Aggregate Status Check)
  # Single required status check for branch protection.
  # terraform-plan is conditional (skipped on forks) — treated as passing when skipped.
  # ============================================================================
  pipeline-gate:
    name: Pipeline Gate
    runs-on: ubuntu-latest
    needs: [terraform, terraform-plan, yaml-lint, shellcheck, security, molecule, shell-tests, python-tests, sops-validation]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          # terraform-plan is conditional (skipped on forks) — treat skipped as passing
          echo "$results" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          failed = [
              name for name, data in needs.items()
              if data['result'] not in ('success', 'skipped')
          ]
          if failed:
              print('FAILED jobs:', ', '.join(failed))
              sys.exit(1)
          print('All checks passed or were skipped (fork PR)')
          "
