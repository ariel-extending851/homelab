name: DR Drill — Monthly Velero Restore Validation

# Runs on the 1st of every month. Validates that the Velero
# backup/restore loop still works against the LIVE prod cluster:
#
#   1. Fetch prod kubeconfig via the same OIDC flow as nightly-e2e-live
#   2. Run `make test-velero-restore` → bin/tests/test_velero_restore_live.py
#      (creates a marker namespace, takes a backup, deletes the namespace,
#      restores it, verifies the marker)
#   3. On failure, open a GitHub issue tagged 'dr-drill' so it can't be
#      silently ignored
#
# This is the operationalization of `make test-velero-restore` — the same
# target ci-deployment.yml uses post-deploy, but on a recurring cadence
# decoupled from deploys (so DR doesn't silently rot between releases).
#
# Manual run: workflow_dispatch trigger from the Actions tab.

on:
  schedule:
    - cron: "0 9 1 * *"  # 09:00 UTC on day 1 of every month (~06:00 BRT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-drill
  cancel-in-progress: false

jobs:
  velero-restore-drill:
    name: Velero Backup + Restore Drill (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup CI Dependencies (Terraform + Kubernetes + Ansible)
        run: |
          make setup-ci-deps-terraform
          make setup-ci-deps-kubernetes
          make setup-ci-deps-ansible

      - name: Configure AWS Credentials (OIDC, plan-only role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Generate Live Kubeconfig
        run: |
          make k8s-kubeconfig
          test -f /tmp/k3s-homelab-kubeconfig.yaml
          kubectl --kubeconfig=/tmp/k3s-homelab-kubeconfig.yaml \
            cluster-info --request-timeout=15s

      - name: Run Velero Restore Drill
        env:
          KUBECONFIG: /tmp/k3s-homelab-kubeconfig.yaml
        run: make test-velero-restore 2>&1 | tee /tmp/dr-drill.log

      - name: Upload Drill Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dr-drill-logs-${{ github.run_id }}
          path: /tmp/dr-drill.log
          retention-days: 90

      - name: Open Issue on Drill Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DR Drill failed — ${new Date().toISOString().slice(0,10)}`,
              body: [
                'The monthly Velero backup/restore drill failed against prod.',
                '',
                `Run: ${runUrl}`,
                `Artifact: dr-drill-logs-${context.runId}`,
                '',
                'Fix priority is **high** — DR rot means RTO claims are unverified.',
                'Investigate before next month\'s drill.',
              ].join('\n'),
              labels: ['dr-drill', 'high-priority'],
            });
