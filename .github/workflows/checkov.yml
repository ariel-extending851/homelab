---
name: Checkov (IaC SAST)

# Static analysis for Terraform, Kubernetes manifests, GitHub Actions, and
# Dockerfiles. Complements Trivy config (broader rule corpus, ~1000 checks)
# and surfaces findings in the GitHub Security tab via SARIF.
#
# Convention: every action is pinned by 40-char SHA. Dependabot keeps these
# fresh — see .github/dependabot.yml.
#
# Why CLI instead of bridgecrewio/checkov-action? The action wrapper has
# version-specific input quirks (output_file_path / skip_path were rejected
# by v12.1347.0; soft_fail handling varies). Invoking checkov directly via
# pip is one fewer layer to reason about and gives us the full CLI surface
# for skip-path, output-file-path, etc.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "30 5 * * 1"   # Mondays 05:30 UTC — weekly drift catch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: "Security: Checkov SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # SARIF upload to GitHub Security tab
      pull-requests: write     # PR annotations
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        run: pip install --quiet "checkov==3.2.382"

      # Phase 1 rollout: --soft-fail. Findings still appear in the GitHub
      # Security tab via the SARIF upload below. Flip to a hard gate after
      # the initial baseline is triaged (mirrors the Kyverno Audit ->
      # Enforce playbook documented in the audit plan).
      - name: Run Checkov
        id: checkov
        run: |
          set -euxo pipefail
          mkdir -p .qa/checkov
          checkov \
            --directory . \
            --framework terraform,kubernetes,github_actions,dockerfile \
            --output sarif \
            --output-file-path .qa/checkov \
            --skip-check CKV_K8S_43 \
            --skip-path .git \
            --skip-path .qa \
            --skip-path htmlcov \
            --skip-path .venv \
            --skip-path venv \
            --skip-path node_modules \
            --quiet \
            --soft-fail

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('.qa/checkov/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84  # v3.35.3
        with:
          sarif_file: .qa/checkov/results_sarif.sarif
          category: checkov

      - name: Upload SARIF as workflow artifact
        if: always() && hashFiles('.qa/checkov/results_sarif.sarif') != ''
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: checkov-sarif
          path: .qa/checkov/results_sarif.sarif
          retention-days: 14
