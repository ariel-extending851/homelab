---
name: Checkov (IaC SAST)

# Static analysis for Terraform, Kubernetes manifests, GitHub Actions, and
# Dockerfiles. Complements Trivy config (broader rule corpus, ~1000 checks)
# and surfaces findings in the GitHub Security tab via SARIF.
#
# Convention: every action is pinned by 40-char SHA. Dependabot keeps these
# fresh — see .github/dependabot.yml.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "30 5 * * 1"   # Mondays 05:30 UTC — weekly drift catch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: "Security: Checkov SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # SARIF upload to GitHub Security tab
      pull-requests: write     # PR annotations
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf  # v12.1347.0
        with:
          directory: .
          # Frameworks aligned with what this repo actually contains.
          framework: terraform,kubernetes,github_actions,dockerfile
          output_format: sarif
          # Honour the existing .trivyignore.yaml justifications by mirroring
          # their check IDs here. Keep this list short; prefer fixing.
          skip_check: CKV_K8S_43
          quiet: true
          soft_fail: false

      # Locate whichever SARIF file the action produced (filename varies by
      # version: results.sarif, results_sarif.sarif, ...). Defensive find +
      # GITHUB_OUTPUT lets the next step run regardless.
      - name: Locate SARIF report
        if: always()
        id: sarif
        run: |
          set -euo pipefail
          file=$(find . -maxdepth 3 -name "*.sarif" -type f | head -n1 || true)
          echo "file=${file}" >> "${GITHUB_OUTPUT}"
          if [ -n "${file}" ]; then
            echo "Found SARIF: ${file}"
          else
            echo "No SARIF file produced by Checkov."
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.sarif.outputs.file != ''
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd  # v3.27.0
        with:
          sarif_file: ${{ steps.sarif.outputs.file }}
          category: checkov

      - name: Upload SARIF as workflow artifact
        if: always() && steps.sarif.outputs.file != ''
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: checkov-sarif
          path: ${{ steps.sarif.outputs.file }}
          retention-days: 14
