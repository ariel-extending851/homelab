apiVersion: v1
kind: Namespace
metadata:
  name: adguard
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: adguard-local-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage-adguard
  local:
    path: /mnt/ssd/k3s-storage/adguard
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - rasp-pi-03
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-pvc
  namespace: adguard
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-adguard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: rasp-pi-03
      containers:
      - name: adguardhome
        image: adguard/adguardhome:v0.107.43
        securityContext:
          privileged: true # Required for host network DNS (port 53)
          allowPrivilegeEscalation: true
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "250Mi"
            cpu: "800m"
        ports:
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 3000
          name: setup-ui
          protocol: TCP
        volumeMounts:
        - name: adguard-storage
          mountPath: /opt/adguardhome/conf
        - name: adguard-storage
          mountPath: /opt/adguardhome/work
          subPath: data
      volumes:
      - name: adguard-storage
        persistentVolumeClaim:
          claimName: adguard-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-service
  namespace: adguard
spec:
  type: NodePort
  selector:
    app: adguardhome
  ports:
    - name: setup-ui
      port: 3000
      targetPort: 3000
      nodePort: 30000
    - name: http-ui
      port: 80
      targetPort: 80
      nodePort: 30080
