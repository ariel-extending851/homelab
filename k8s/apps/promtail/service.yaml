apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: promtail
  labels:
    app: promtail
spec:
  type: ClusterIP
  clusterIP: None  # Headless — one endpoint per DaemonSet pod for scrape.
  selector:
    app: promtail
  ports:
    - name: http-metrics
      port: 3101
      targetPort: http-metrics
      protocol: TCP
