apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: otel-collector
  labels:
    app: opentelemetry
data:
  otel-collector-config: |
    receivers:
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
          memory:
          load:
          filesystem:
          network:
          paging:

      # Collect LOGS from containers
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/otel-collector_otel-collector*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container

    processors:
      batch:
        send_batch_size: 1000
        timeout: 10s
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: true
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name

      # CRITICAL FIX: Copy resource attributes to log record attributes
      # This enables Loki to index them as labels (10x faster queries)
      transform/loki:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["namespace"], attributes["k8s.namespace.name"])
              - set(attributes["pod"], attributes["k8s.pod.name"])
              - set(attributes["container"], attributes["k8s.container.name"])
              - set(attributes["namespace"], resource.attributes["k8s.namespace.name"]) where attributes["namespace"] == nil
              - set(attributes["pod"], resource.attributes["k8s.pod.name"]) where attributes["pod"] == nil
              - set(attributes["container"], resource.attributes["k8s.container.name"]) where attributes["container"] == nil
              - set(attributes["loki.attribute.labels"], "namespace,pod,container")

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        resource_to_telemetry_conversion:
          enabled: true

      # Send logs to Loki
      # Labels are automatically promoted from log record attributes
      loki:
        endpoint: "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        timeout: 30s

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [hostmetrics]
          processors: [k8sattributes, batch]
          exporters: [prometheus]
        logs:
          receivers: [filelog]
          # CRITICAL: Add attributes/loki processor to promote labels
          processors: [k8sattributes, transform/loki, batch]
          exporters: [loki]
