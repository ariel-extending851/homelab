apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: otel-collector
  labels:
    app: opentelemetry
data:
  otel-collector-config: |
    receivers:
      # Container logs from /var/log/pods (host metrics handled by node-exporter)
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/otel-collector_otel-collector*/*/*.log
          - /var/log/pods/media_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container

    processors:
      batch:
        send_batch_size: 1000
        timeout: 10s
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: true
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name

      # Promote resource attributes to log attributes so Loki indexes them as labels
      transform/loki:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["namespace"], attributes["k8s.namespace.name"])
              - set(attributes["pod"], attributes["k8s.pod.name"])
              - set(attributes["container"], attributes["k8s.container.name"])
              - set(attributes["namespace"], resource.attributes["k8s.namespace.name"]) where attributes["namespace"] == nil
              - set(attributes["pod"], resource.attributes["k8s.pod.name"]) where attributes["pod"] == nil
              - set(attributes["container"], resource.attributes["k8s.container.name"]) where attributes["container"] == nil
              - set(attributes["loki.attribute.labels"], "namespace,pod,container")

    exporters:
      loki:
        endpoint: "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        timeout: 30s

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, transform/loki, batch]
          exporters: [loki]
