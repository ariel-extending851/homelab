apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golink-data
  namespace: golink
  labels:
    app: golink
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # GoLink database size is minimal (< 100MB for typical use)
      # Allocating 1Gi provides ample room for growth
      storage: 1Gi
  # Uses default storageClass (local-path on k3s)
