# IMPORTANT: Before deploying, create the Tailscale auth key secret:
# kubectl create secret generic tailscale-auth-key \
#   --from-literal=authkey=tskey-auth-XXXXXXXXXXXX-YYYYYYYYYYYYYYYYYYYY \
#   -n golink
#
# Generate an auth key at: https://login.tailscale.com/admin/settings/keys
# Recommended settings:
#   - Reusable: No (one-time use)
#   - Ephemeral: No (persist across restarts)
#   - Pre-approved: Yes
#   - Tags: tag:golink
---
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth-key
  namespace: golink
type: Opaque
stringData:
  # PLACEHOLDER - Replace with actual auth key before deployment
  # This placeholder will fail deployment intentionally
  authkey: "REPLACE-WITH-TAILSCALE-AUTH-KEY-BEFORE-DEPLOYMENT"
