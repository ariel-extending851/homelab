apiVersion: apps/v1
kind: Deployment
metadata:
  name: golink
  namespace: golink
  labels:
    app: golink
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: golink
  template:
    metadata:
      labels:
        app: golink
    spec:
      serviceAccountName: golink
      containers:
        - name: golink
          image: ghcr.io/tailscale/golink:v1.0.0
          imagePullPolicy: IfNotPresent

          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth-key
                  key: authkey
            - name: TS_HOSTNAME
              value: "golink-backend"

          args:
            - "-addr"
            - "0.0.0.0:8080"
            - "-sqlite-path"
            - "/data/golink.db"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65532

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: golink-data
