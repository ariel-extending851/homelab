apiVersion: apps/v1
kind: Deployment
metadata:
  name: golink
  namespace: golink
  labels:
    app: golink
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: golink
  template:
    metadata:
      labels:
        app: golink
    spec:
      serviceAccountName: golink
      containers:
        - name: golink
          # Pin to digest — GoLink has no SemVer releases, :main is rolling
          # Last pulled: 2026-02-14
          image: ghcr.io/tailscale/golink:main@sha256:ba5303fefc041cf9f11f960a90c3e16ca922dad8140ef43f704670f5c55f581b
          imagePullPolicy: IfNotPresent

          args:
            - "-dev-listen"
            - "0.0.0.0:8080"
            - "-sqlitedb"
            - "/data/golink.db"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65532

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: golink-data
