apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-ingress
  namespace: adguard
  labels:
    app: adguardhome
  annotations:
    # Fix for AdGuard Home blank page issue
    # Ensures proper cookie/session handling through HTTPS proxy
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: adguard-service
      port:
        number: 3000
  tls:
    - hosts:
        - adguard.tail57bf10.ts.net
