apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-ingress
  namespace: adguard
  labels:
    app: adguardhome
  annotations:
    # Disable cluster traffic forwarding since AdGuard uses hostNetwork
    # This allows Tailscale to route directly to the pod IP for better performance
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "false"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: adguard-service
      port:
        number: 3000
  tls:
    - hosts:
        - adguard.tail57bf10.ts.net
