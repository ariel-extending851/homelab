# NOTE: Service is optional since AdGuard uses hostNetwork
# This service is mainly for cluster-internal DNS queries
apiVersion: v1
kind: Service
metadata:
  name: adguard-service
  namespace: adguard
  labels:
    app: adguardhome
spec:
  type: ClusterIP
  selector:
    app: adguardhome
  ports:
    - name: admin-ui
      # Post-wizard port — see deployment.yaml note. Pre-wizard the UI is on 3000.
      port: 80
      targetPort: 80
      protocol: TCP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
