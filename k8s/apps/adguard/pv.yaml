apiVersion: v1
kind: PersistentVolume
metadata:
  name: adguard-local-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage-adguard
  local:
    path: /mnt/storage/k3s-storage/adguard
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-agent-2
---
# IMPORTANT: Host path ownership requirement
# The directory /mnt/storage/k3s-storage/adguard on k3s-agent-2 must be owned by UID:GID 65534:65534
# to match the container's security context (nobody:nogroup).
#
# One-time setup on k3s-agent-2 (via Ansible or SSM):
#   sudo mkdir -p /mnt/storage/k3s-storage/adguard
#   sudo chown -R 65534:65534 /mnt/storage/k3s-storage/adguard
#   sudo chmod -R u+rwX,g+rX,o-rwx /mnt/storage/k3s-storage/adguard
