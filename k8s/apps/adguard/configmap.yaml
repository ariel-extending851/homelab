apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-config
  namespace: adguard
  labels:
    app: adguardhome
data:
  # AdGuard Home configuration snippet
  # This configures trusted proxies to support HTTPS ingress routing
  # The full configuration is stored in the PersistentVolume at /opt/adguardhome/conf/AdGuardHome.yaml
  # This ConfigMap provides reference values for trusted_proxies that should be manually
  # configured in the AdGuard Home web UI or merged into the config file
  trusted-proxies.txt: |
    # Kubernetes Pod Network (default k3s pod CIDR)
    10.42.0.0/16

    # Kubernetes Service Network (default k3s service CIDR)
    10.43.0.0/16

    # Localhost
    127.0.0.0/8
    ::1/128

    # Tailscale CGNAT range (if routing through Tailscale)
    100.64.0.0/10

  # README for configuration
  README.md: |
    # AdGuard Home Configuration

    ## Trusted Proxies

    AdGuard Home needs to trust the Kubernetes service network and Tailscale ingress
    to properly handle HTTPS requests through the reverse proxy.

    ### How to Configure

    1. Access AdGuard Home web UI: https://adguard.<YOUR-TAILSCALE-FUNNEL-URL>/
    2. Go to Settings → General Settings
    3. Find "Trusted proxies" field
    4. Add the CIDRs listed in `trusted-proxies.txt`

    ### Why This is Needed

    When accessing AdGuard through Tailscale HTTPS ingress:
    - Traffic flows: Browser → Tailscale Ingress (<TAILSCALE_INGRESS_IP>) → Service (<K8S_SERVICE_IP>) → Pod
    - AdGuard needs to trust these intermediate proxies to:
      - Accept X-Forwarded-For headers
      - Properly handle session cookies
      - Recognize client IPs correctly

    ### Current Configuration

    The running pod has these trusted proxies configured (manually added):
    - 10.42.0.0/16 (Pod network)
    - 10.43.0.0/16 (Service network)
    - 127.0.0.0/8 (Localhost)
    - ::1/128 (IPv6 localhost)

    ### Note

    AdGuard Home does not support partial config files or environment variable injection
    for trusted_proxies. The configuration must be set through:
    1. Web UI (recommended - persists in PersistentVolume)
    2. Manual edit of /opt/adguardhome/conf/AdGuardHome.yaml
    3. API call to /control/set_all_settings

    This ConfigMap serves as documentation and reference, not active configuration.
