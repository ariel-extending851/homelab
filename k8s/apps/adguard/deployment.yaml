apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguard
  labels:
    app: adguardhome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      # CRITICAL: Must use hostNetwork for DNS (UDP 53) to function as LAN DNS server
      # PREREQUISITE: systemd-resolved must be disabled on target node to free port 53
      #   sudo systemctl disable --now systemd-resolved
      #   sudo rm /etc/resolv.conf && echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Pin to Raspberry Pi with local PV and available resources (rasp-pi-04 has 8GB RAM)
      nodeSelector:
        kubernetes.io/hostname: rasp-pi-04

      containers:
        # AdGuard Home Application
        - name: adguardhome
          image: adguard/adguardhome:v0.107.71  # Upgraded to latest to support config schema v32
          imagePullPolicy: IfNotPresent

          securityContext:
            # With hostNetwork=true, container uses host's network namespace for port 53
            # Apply least privilege principle: drop all capabilities
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "800m"
              memory: "250Mi"

          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 3000
              name: admin-ui
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: adguard-storage
              mountPath: /opt/adguardhome/conf
            - name: adguard-storage
              mountPath: /opt/adguardhome/work
              subPath: data
            - name: adguard-config-docs
              mountPath: /opt/adguardhome/docs
              readOnly: true

      volumes:
        - name: adguard-storage
          persistentVolumeClaim:
            claimName: adguard-pvc
        - name: adguard-config-docs
          configMap:
            name: adguard-config
