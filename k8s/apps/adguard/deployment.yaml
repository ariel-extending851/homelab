apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguard
  labels:
    app: adguardhome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      # CRITICAL: Must use hostNetwork for DNS (UDP 53) to function as LAN DNS server
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Pin to Raspberry Pi with local PV
      nodeSelector:
        kubernetes.io/hostname: rasp-pi-03

      containers:
        # AdGuard Home Application
        - name: adguardhome
          image: adguard/adguardhome:v0.107.54  # Upgraded from v0.107.43 to support config schema v32
          imagePullPolicy: IfNotPresent

          securityContext:
            # Requires elevated privileges for DNS (port 53) on hostNetwork
            privileged: true
            allowPrivilegeEscalation: true

          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "800m"
              memory: "250Mi"

          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 3000
              name: admin-ui
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: adguard-storage
              mountPath: /opt/adguardhome/conf
            - name: adguard-storage
              mountPath: /opt/adguardhome/work
              subPath: data

      volumes:
        - name: adguard-storage
          persistentVolumeClaim:
            claimName: adguard-pvc
