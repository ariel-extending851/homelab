apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguard
  labels:
    app: adguardhome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      # CRITICAL: Must use hostNetwork for DNS (UDP 53) to function as LAN DNS server
      # PREREQUISITE: systemd-resolved must be disabled on target node to free port 53
      #   sudo systemctl disable --now systemd-resolved
      #   sudo rm /etc/resolv.conf && echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # No nodeAffinity — scheduler places this on any available node.
      # IMPORTANT — hostNetwork constraints with DNS:
      #   1. Only ONE AdGuard instance can run cluster-wide (port 53 is a singleton per host).
      #   2. DNS binds to whichever node's IP the pod lands on — clients must use that IP.
      #   3. Pod rescheduling changes the DNS IP; for stability, add a nodeSelector with
      #      a custom label (e.g. role=dns-server) on the chosen node.

      # Security context: Run as nobody user (UID 65534) to match image ownership
      # fsGroup ensures mounted volumes are accessible by the container user
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

      containers:
        # AdGuard Home Application
        - name: adguardhome
          image: adguard/adguardhome:v0.107.74  # Phase 1 bump 2026-05-02 (was v0.107.71); config schema v32 still supported
          imagePullPolicy: IfNotPresent

          securityContext:
            # With hostNetwork=true, container uses host's network namespace for port 53
            # Minimal security: prevent privilege escalation, no privileged mode
            # Required capabilities:
            #   - NET_BIND_SERVICE: Bind to privileged port 53 (DNS)
            #   - SETUID/SETGID: AdGuard may need to switch users during initialization
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - SETUID
                - SETGID
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "800m"
              memory: "250Mi"

          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 3000
              name: admin-ui
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: adguard-storage
              mountPath: /opt/adguardhome/conf
            - name: adguard-storage
              mountPath: /opt/adguardhome/work
              subPath: data
            - name: adguard-config-docs
              mountPath: /opt/adguardhome/docs
              readOnly: true

      volumes:
        - name: adguard-storage
          persistentVolumeClaim:
            claimName: adguard-pvc
        - name: adguard-config-docs
          configMap:
            name: adguard-config
