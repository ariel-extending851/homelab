apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguard
  labels:
    app: adguardhome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguardhome
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      # CRITICAL: Must use hostNetwork for DNS (UDP 53) to function as LAN DNS server
      # PREREQUISITE: systemd-resolved must be disabled on target node to free port 53
      #   sudo systemctl disable --now systemd-resolved
      #   sudo rm /etc/resolv.conf && echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Pin to rasp-pi-03 to keep AdGuard's LAN-facing DNS endpoint stable at
      # 192.168.8.12 (the LAN IP of rasp-pi-03 per group_vars/router.sops.yml).
      # The GL.iNet router's gatekeeper failover script (ansible/roles/gatekeeper)
      # DNATs LAN :53 to `pi_adguard_ip` and only works when that IP matches the
      # pod's actual host. rasp-pi-04 is loaded with the media stack (jellyfin +
      # *arr + qbittorrent + 11 Tailscale ingress proxies); pi-03 is light.
      # Prerequisite: ansible/roles/rpi_optimization disables systemd-resolved
      # on rasp-pi-03 (gated by adguard_dns_host=true in host_vars).
      nodeSelector:
        kubernetes.io/hostname: rasp-pi-03

      # AdGuard Home v0.107.50+ permcheck reads the binary's *file* capabilities
      # (cap.GetFile on /opt/adguardhome/AdGuardHome), not the Pod-level caps
      # injected by Kubernetes. The upstream image ships without setcap, so any
      # non-root UID fails the first-launch admin check with
      # "this is the first launch of adguard home; you must run it as administrator".
      # hostNetwork + privileged port 53 makes root the upstream-recommended runtime
      # for this app — see docs/runbooks/adguard-firstlaunch-permcheck.md.
      # Mitigations retained: privileged=false, allowPrivilegeEscalation=false, capabilities drop ALL.
      securityContext:
        runAsUser: 0
        runAsGroup: 0

      containers:
        # AdGuard Home Application
        - name: adguardhome
          image: adguard/adguardhome:v0.107.74@sha256:f29c58a91f79387cbbbb042e140814f58e830d457d44af03d662c8df43db9dea  # Phase 1 bump 2026-05-02 (was v0.107.71); config schema v32 still supported
          imagePullPolicy: IfNotPresent

          securityContext:
            # With hostNetwork=true, container uses host's network namespace for port 53.
            # Required capabilities:
            #   - NET_BIND_SERVICE: Bind to privileged port 53 (DNS)
            #   - NET_RAW: also consulted by AdGuard's permcheck on first launch
            #   - SETUID/SETGID: AdGuard may switch users during initialization
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - NET_RAW
                - SETUID
                - SETGID
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "800m"
              memory: "250Mi"

          ports:
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            # AdGuard's first-launch wizard lives on :3000; once the admin password
            # is set, the web UI binds to the configured `bind_port` (default 80)
            # from /opt/adguardhome/conf/AdGuardHome.yaml. Probes and Service must
            # match the post-wizard port, otherwise the pod CrashLoops.
            - containerPort: 80
              name: admin-ui
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: adguard-storage
              mountPath: /opt/adguardhome/conf
            - name: adguard-storage
              mountPath: /opt/adguardhome/work
              subPath: data
            - name: adguard-config-docs
              mountPath: /opt/adguardhome/docs
              readOnly: true

      volumes:
        - name: adguard-storage
          persistentVolumeClaim:
            claimName: adguard-pvc
        - name: adguard-config-docs
          configMap:
            name: adguard-config
