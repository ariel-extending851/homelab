# NetworkPolicy for kube-state-metrics namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kube-state-metrics
  labels:
    app.kubernetes.io/part-of: homelab-security
    policy-type: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-state-metrics
  namespace: kube-state-metrics
  labels:
    app.kubernetes.io/part-of: homelab-security
    app: kube-state-metrics
spec:
  podSelector:
    matchLabels:
      app: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes /metrics (8080) + /metrics/telemetry (8081).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
  egress:
    # Talk to kube-apiserver via the cluster service network (service
    # CIDR varies per-cluster; 10.43.0.0/16 is k3s default — the kubernetes
    # default service is reachable here).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    # In-cluster traffic (apiserver via service IP, DNS).
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
