apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for PVC with ReadWriteOnce
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # Schedule on Oracle Cloud node (more memory available)
      nodeSelector:
        kubernetes.io/hostname: k3s-node-0

      containers:
        # Grafana Application
        - name: grafana
          image: grafana/grafana:10.2.3
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false # Grafana needs to write to /var/lib/grafana
            runAsNonRoot: true
            runAsUser: 472

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"  # Increased from 500m to eliminate CFS throttling (was 0.38% throttled)
              memory: "512Mi"

          ports:
            - containerPort: 3000
              name: http
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            # Dashboard provider configuration (tells Grafana where to find dashboards)
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            # Actual dashboard JSON file (mounted in the same directory as provider expects)
            - name: grafana-dashboard-homelab-k3s-overview
              mountPath: /etc/grafana/provisioning/dashboards/homelab-k3s-overview.json
              subPath: homelab-k3s-overview.json

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboard-homelab-k3s-overview
          configMap:
            name: grafana-dashboard-homelab-k3s-overview
