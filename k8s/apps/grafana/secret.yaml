# Tailscale Authentication Secret
# IMPORTANT: Create this secret before deployment:
# kubectl create secret generic tailscale-auth \
#   --from-literal=authkey=tskey-auth-XXXXXXXXXXXX-YYYYYYYYYYYYYYYYYYYY \
#   -n grafana
#
# Generate at: https://login.tailscale.com/admin/settings/keys
# Recommended settings:
#   - Reusable: Yes (for pod restarts)
#   - Ephemeral: No (maintain persistent identity)
#   - Pre-approved: Yes
#   - Tags: tag:k8s,tag:grafana
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: grafana
type: Opaque
stringData:
  # PLACEHOLDER - Replace with actual Tailscale auth key
  authkey: "REPLACE-WITH-TAILSCALE-AUTH-KEY-BEFORE-DEPLOYMENT"
