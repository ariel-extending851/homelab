# Root Kustomization for All Applications
# Aggregates all app-specific kustomizations for ArgoCD App-of-Apps pattern
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

  # Observability Stack

  # Applications

resources:
- ./prometheus
- ./grafana
- ./loki
- ./alloy
- ./blackbox
- ./kube-state-metrics
- ./node-exporter
- ./otel-collector
- ./golink
- ./adguard
- ./velero
# Cilium temporarily removed — its `cni.exclusive: true` Helm value forced a
# CNI takeover from the flannel that k3s installs at boot. apps-root sync would
# brick the cluster mid-bootstrap (kubectl + SSM both timeout). To re-enable,
# install Cilium pre-cluster (Ansible role with `--flannel-backend=none`) or
# add a sync-wave that runs after cluster is fully Ready.
# See gotcha #9 in docs/runbooks/staging-deploy-2026-05-postmortem.md.
- ./falco
- ./hl-kyverno
- ./unifi
- ./storage-latency
- ./priority-classes
- ./lifeops-jd
