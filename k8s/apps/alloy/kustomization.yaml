apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alloy

# NOTE: secret.yaml is intentionally NOT listed here until the operator
# has encrypted it via `sops -e`. See k8s/apps/alloy/secret.yaml.example
# and docs/runbooks/alloy-troubleshooting.md for the bootstrap procedure.
# ArgoCD will fail-closed on the missing envFrom secret until that's done,
# which is the intended UX — no half-configured agent goes live.
resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - daemonset.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - policy-exception.yaml
