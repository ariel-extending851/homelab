# Kyverno PolicyException — scoped narrowly to the Alloy DaemonSet only.
# Justifies the privileged + hostPID configuration that Beyla eBPF requires.
# Audited entry: docs/security/audit-history.md (2026-05-23).
# Linked to: docs/security/runtime-enforcement.md.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: alloy-ebpf-privileged
  namespace: alloy
spec:
  exceptions:
    # privileged: false on the container, so no disallow-privileged-containers
    # exception is needed — Falco DaemonSet uses the same pattern.
    - policyName: disallow-host-namespaces
      ruleNames:
        - host-namespaces
        - autogen-host-namespaces
    - policyName: disallow-capabilities
      ruleNames:
        - adding-capabilities
        - autogen-adding-capabilities
  match:
    any:
      - resources:
          kinds:
            - Pod
            - DaemonSet
          namespaces:
            - alloy
          selector:
            matchLabels:
              app: alloy
