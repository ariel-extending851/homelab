apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alloy-ingress
  namespace: alloy
  labels:
    app: alloy
  annotations:
    # high-bandwidth ProxyClass — matches the Grafana / Loki / Prometheus
    # ingresses; the livedebugging stream can bursty.
    tailscale.com/proxy-class: "high-bandwidth"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: alloy
      port:
        number: 12345
  tls:
    - hosts:
        - alloy.tail57bf10.ts.net
