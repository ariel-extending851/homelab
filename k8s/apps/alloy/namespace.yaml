apiVersion: v1
kind: Namespace
metadata:
  name: alloy
  labels:
    # Beyla eBPF + hostPID + privileged container require the privileged PSA.
    # Justification + compensating controls live in:
    #   docs/security/audit-history.md (2026-05-23 entry)
    #   docs/security/runtime-enforcement.md (Kyverno PolicyException)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    app.kubernetes.io/part-of: observability
