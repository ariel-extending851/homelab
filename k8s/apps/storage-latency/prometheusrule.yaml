apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-latency
  namespace: storage-latency
  labels:
    prometheus: homelab
    role: alert-rules
spec:
  groups:
    - name: storage-latency.rules
      rules:
        # The CronJob exits 1 on SLA breach (p99 > threshold) and 2 on
        # exec failure. kube-state-metrics surfaces both as a Failed Job
        # condition; this rule fires on either, with annotations that
        # let the operator distinguish via runbook lookup of the Job's
        # exit code.
        - alert: StorageLatencyDegraded
          expr: |
            kube_job_status_failed{job_name=~"storage-latency-.*", namespace="storage-latency"} > 0
          for: 10m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "RPi4 SD/USB latency SLA breach (p99 > 50ms) or test exec failure"
            description: >-
              The storage-latency CronJob on rasp-pi-04 reported a Failed Job.
              Exit code 1 means the measured p99 write/read latency exceeded
              the 50ms SLA — the SD card or USB drive is likely wearing out.
              Exit code 2 means the test itself couldn't run (fio install or
              parsing error). Inspect:
                kubectl -n storage-latency logs -l app.kubernetes.io/name=storage-latency --tail=100
              Loki query for trend:
                {namespace="storage-latency"} | json | event="storage_latency"
            runbook_url: docs/runbooks/storage-latency-degraded.md

        # Catch the silent-success case: if the CronJob hasn't reported
        # ANY result in 24h, the schedule is stuck (nodeSelector mismatch,
        # image pull loop, etc.). Without this we'd assume "no breach"
        # when the truth is "no signal".
        - alert: StorageLatencyMonitorStalled
          expr: |
            time() - max(kube_job_status_completion_time{job_name=~"storage-latency-.*"}) > 86400
          for: 1h
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "storage-latency CronJob has not produced a result in 24h"
            description: >-
              No Completed Job from the storage-latency CronJob has been
              seen in 24 hours. The schedule may be stuck. Check:
                kubectl -n storage-latency get cronjob storage-latency
                kubectl -n storage-latency describe cronjob storage-latency
            runbook_url: docs/runbooks/storage-latency-degraded.md
