# Pi-only environment overlay.
#
# Lists only the apps that fit and belong on the Raspberry Pi cluster
# (rasp-pi-04 server + rasp-pi-03 agent dedicated to AdGuard). The "Cloud"
# apps (grafana, kyverno, velero, falco, golink, storage-latency, unifi)
# stay in the repo at k8s/apps/<name>/ — they are intentionally left out of
# this overlay because they target AWS resources (or are too heavy for the
# Pis). They will return via a separate overlay (k8s/apps/envs/cloud) when
# the AWS side is back online.
#
# Selected by the Pi-only deploy via inventory/pi-only.yml overriding
# `apps_root_manifest_path: k8s/gitops/apps-root-pi-only.yaml`, whose
# Application points at this path.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../adguard
  - ../../prometheus
  - ../../loki
  - ../../blackbox
  - ../../kube-state-metrics
  - ../../node-exporter
  - ../../otel-collector
