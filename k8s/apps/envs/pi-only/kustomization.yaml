# Pi-only environment overlay.
#
# Lists only the apps that BELONG on the Raspberry Pis — the apps that
# either physically must run there (adguard for LAN DNS via hostNetwork),
# are Pi-specific (storage-latency measures the SD card), or operate
# always-on regardless of cloud tier state (Velero backup + Promtail
# edge log shipping).
#
# Security/full-observability (Alloy + Beyla + S3 cold-archive) still
# live AWS-side in k8s/apps/envs/cloud/ — those schedule on EC2 when
# AWS Full is active. Edge logs ARE shipped from the Pis themselves
# via Promtail, independent of AWS state.
#
# rasp-pi-04 ALSO hosts the homelab-media stack (jellyfin, sonarr,
# radarr, prowlarr, qbittorrent, flaresolverr) — but those manifests
# come from the private `ariel-extending851/homelab-media` repo and are
# applied by ArgoCD's `homelab-media-root` Application (configured via
# argocd_extra_* SOPS vars in ansible/group_vars/k3s_server.sops.yml).
# They are NOT in this overlay.
#
# Used by two ArgoCD entry points:
#   - apps-root-pi-only.yaml      (Pi-only deploy: no AWS at all)
#   - apps-root-hybrid.yaml       (Hybrid: this overlay + envs/cloud)
# Both reference `k8s/apps/envs/pi-only`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../adguard               # hostNetwork :53 on rasp-pi-03 (nodeSelector pinned)
  - ../../storage-latency       # CronJob on rasp-pi-04 (nodeSelector pinned)
  - ../../k3s-snapshot          # CronJob on rasp-pi-04 — SQLite control-plane backup → S3
  - ../../node-exporter         # DaemonSet — runs on every Linux node
  - ../../promtail              # DaemonSet — edge log shipper, replaces Alloy edge (2026-05-29)
  - ../../velero                # AWS Lite — backups always on (S3 + IAM in infra/aws-velero/)
  - ../../priority-classes      # cluster-scoped — tenant tier protection on this Pi-only cluster
