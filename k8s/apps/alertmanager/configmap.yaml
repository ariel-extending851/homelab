apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'telegram-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'telegram-notifications'
          group_wait: 10s
          repeat_interval: 1h

    receivers:
      - name: 'telegram-notifications'
        telegram_configs:
          - bot_token: "REPLACE_WITH_BOT_TOKEN"
            chat_id: 123456789
            send_resolved: true
            parse_mode: 'HTML'
            message: "🔔 <b>Homelab Alert</b> ({{ .Status | toUpper }})\n\n<b>Alert:</b> {{ .CommonLabels.alertname }}\n<b>Severity:</b> {{ .CommonLabels.severity }}\n<b>Summary:</b> {{ .CommonAnnotations.summary }}\n<b>Description:</b> {{ .CommonAnnotations.description }}"
