apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero
  namespace: velero
---
# Velero needs broad cluster access to back up and restore arbitrary resource
# types — including CRDs that may be added in the future. Wildcard RBAC is
# permitted here per the documented allowlist in:
#   k8s/policies/rbac_safety.rego (wildcard_allowed_clusterroles)
#   k8s/policies/README.md (justification + reviewer record)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero
subjects:
  - kind: ServiceAccount
    name: velero
    namespace: velero
