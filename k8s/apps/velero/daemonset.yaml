apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: velero
  labels:
    app: velero
    component: node-agent
spec:
  selector:
    matchLabels:
      app: velero
      component: node-agent
  template:
    metadata:
      labels:
        app: velero
        component: node-agent
    spec:
      serviceAccountName: velero

      # Pin to rasp-pi-04 — the restic node-agent only needs to run where
      # the PVCs it backs up live. The Pi-only overlay puts all PVC-heavy
      # workloads on pi-04 (media-stack, adguard config, etc.); pi-03 just
      # runs AdGuard with hostNetwork (no PVCs to back up apart from
      # adguard-pvc which is small and pi-04-mounted-too via local-path?
      # Actually adguard-pvc lives on pi-03 — Velero PV backup pipeline
      # uses CSI snapshots or restic via PSP; restic only needs to be on
      # the node where the volume is mounted. For the current homelab the
      # important PVCs (jellyfin, sonarr, radarr, prowlarr, qbittorrent)
      # all sit on pi-04, so pinning the node-agent here is correct.
      nodeSelector:
        kubernetes.io/hostname: rasp-pi-04

      containers:
        - name: node-agent
          image: velero/velero:v1.14.1@sha256:c14904c6f93d129f5ba1fad1a0bbbb20a71f5a003a3cc615313097c7f49eb3e0
          imagePullPolicy: IfNotPresent

          command:
            - /velero
          args:
            - node-agent
            - server
            - --metrics-address=0.0.0.0:8085

          env:
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud

          ports:
            - name: metrics
              containerPort: 8085
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # restic uploader needs to read pod volumes via /var/lib/kubelet/pods,
            # which on most distros is owned by root. Run as root with capabilities
            # dropped — privilege escalation still blocked.
            runAsUser: 0

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "200Mi"

          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 30

          volumeMounts:
            - name: cloud-credentials
              mountPath: /credentials
              readOnly: true
            - name: host-pods
              mountPath: /host_pods
              mountPropagation: HostToContainer
            - name: scratch
              mountPath: /scratch
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: cloud-credentials
          secret:
            secretName: velero-aws-credentials
        - name: host-pods
          hostPath:
            path: /var/lib/kubelet/pods
        - name: scratch
          emptyDir: {}
        - name: tmp
          emptyDir: {}
