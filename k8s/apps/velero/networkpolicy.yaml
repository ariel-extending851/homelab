# NetworkPolicy for velero namespace.
# Velero ClusterRole holds wildcard verbs (documented exception in
# k8s/policies/rbac_safety.rego); NetworkPolicy is the network-layer
# defense-in-depth around that broad RBAC.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: velero
  labels:
    app.kubernetes.io/part-of: homelab-security
    policy-type: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-velero
  namespace: velero
  labels:
    app.kubernetes.io/part-of: homelab-security
    app: velero
spec:
  podSelector:
    matchLabels:
      app: velero
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes Velero metrics on 8085.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - { protocol: TCP, port: 8085 }
  egress:
    # AWS S3 (HTTPS), STS, KMS — anything outside cluster + LAN.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
              - 100.64.0.0/10
      ports:
        - { protocol: TCP, port: 443 }
    # kube-apiserver for backup discovery (resource enumeration, CRD reads,
    # GVK preferred-version probes during plugin registration).
    #
    # The correct destination is the LAN/tailnet where the k3s control plane
    # advertises the apiserver on :6443 — NOT the Service ClusterIP, which
    # is rewritten before the NP egress rule fires. Why:
    # kube-router (k3s' default NetworkPolicy engine) inserts its NP rules
    # in the FORWARD chain, evaluated AFTER kube-proxy's PREROUTING DNAT.
    # By the time the egress NP runs, the destination has been rewritten
    # from 10.43.0.1:443 to <node-ip>:6443. That node IP is RFC1918 or CGNAT
    # (Tailscale), both excluded by the first egress rule above ("S3 only"),
    # so without this rule the packet gets dropped and Velero crashloops on:
    #   `Get "https://10.43.0.1:443/...": dial tcp 10.43.0.1:443:
    #    connect: connection refused`
    #
    # Two CIDRs are allowed on :6443:
    #   - 192.168.0.0/16  → all common home LAN /24s (covers Pi cluster
    #                       reachable via eth0 today, and any future
    #                       reroute to a different /24)
    #   - 100.64.0.0/10   → Tailscale CGNAT range (when the hybrid AWS
    #                       deploy lands, the EC2 control plane advertises
    #                       its apiserver via its 100.x address)
    # Scope is the apiserver port (:6443) only, so this does not open
    # generic LAN/tailnet egress — only the k3s control-plane endpoint.
    - to:
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - { protocol: TCP, port: 6443 }
    # Backwards-compatible reach to apiserver pods in other distros (kubeadm,
    # EKS, etc.) where the apiserver IS a pod. No-op on k3s but harmless.
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
