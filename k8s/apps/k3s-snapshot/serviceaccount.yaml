# The CronJob never calls the Kubernetes API — it reads a hostPath and talks to
# S3 — so it gets a token-less ServiceAccount and NO RBAC. (Contrast Velero's
# wildcard ClusterRole; deliberately not copied here.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-snapshot
  namespace: k3s-snapshot
automountServiceAccountToken: false
