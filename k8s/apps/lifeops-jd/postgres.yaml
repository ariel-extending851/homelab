apiVersion: v1
kind: Service
metadata:
  name: lifeops-jd-db
  namespace: lifeops-jd
  labels: { app: lifeops-jd-db }
spec:
  clusterIP: None
  selector: { app: lifeops-jd-db }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lifeops-jd-db
  namespace: lifeops-jd
spec:
  serviceName: lifeops-jd-db
  replicas: 1
  selector: { matchLabels: { app: lifeops-jd-db } }
  template:
    metadata:
      labels: { app: lifeops-jd-db }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Always
          ports:
            - { name: pg, containerPort: 5432 }
          env:
            # _FILE variants: postgres reads the credential value from disk,
            # avoiding kubelet writing the secret into the container env
            # (Checkov CKV_K8S_35). Files are projected by the secret volume
            # below.
            - { name: POSTGRES_DB_FILE,       value: /var/run/secrets/db/db-name }
            - { name: POSTGRES_USER_FILE,     value: /var/run/secrets/db/username }
            - { name: POSTGRES_PASSWORD_FILE, value: /var/run/secrets/db/password }
            - { name: PGDATA,                 value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data,       mountPath: /var/lib/postgresql/data }
            - { name: db-secrets, mountPath: /var/run/secrets/db, readOnly: true }
            - { name: run,        mountPath: /var/run/postgresql }
            - { name: tmp,        mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            # Probe via socket rather than -U $(POSTGRES_USER) — the user env
            # var no longer exists when we use POSTGRES_USER_FILE.
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"] }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db-secrets
          secret:
            secretName: lifeops-jd-db
            defaultMode: 0400
        - name: run
          emptyDir: { sizeLimit: 16Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
