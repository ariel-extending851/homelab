apiVersion: v1
kind: Namespace
metadata:
  name: searxng
---
# SearXNG Secret Key
# Generate before deployment:
# kubectl create secret generic searxng-secret \
#   --from-literal=secret-key=$(openssl rand -hex 32) \
#   -n searxng
apiVersion: v1
kind: Secret
metadata:
  name: searxng-secret
  namespace: searxng
type: Opaque
stringData:
  secret-key: "REPLACE-WITH-SECURE-RANDOM-KEY"
---
# Tailscale Auth Key
# Create manually to avoid overwrites:
# kubectl create secret generic tailscale-auth-key \
#   --from-literal=authkey=tskey-auth-XXXXXXXXXXXX \
#   -n searxng
---
# Tailscale Authentication Secret
# IMPORTANT: Create this secret before deployment:
# kubectl create secret generic searxng-tailscale-auth \
#   --from-literal=authkey=tskey-auth-XXXXXXXXXXXX-YYYYYYYYYYYYYYYYYYYY \
#   -n searxng
#
# Generate at: https://login.tailscale.com/admin/settings/keys
# Recommended settings:
#   - Reusable: Yes (for pod restarts)
#   - Ephemeral: No (maintain persistent identity)
#   - Pre-approved: Yes
#   - Tags: tag:k8s,tag:searxng
apiVersion: v1
kind: Secret
metadata:
  name: searxng-tailscale-auth
  namespace: searxng
type: Opaque
stringData:
  # PLACEHOLDER - Replace with actual Tailscale auth key
  authkey: "REPLACE-WITH-TAILSCALE-AUTH-KEY-BEFORE-DEPLOYMENT"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    # Performance tuning for k3s-node-1 (Oracle Cloud VM)
    uwsgi:
      threads: 4
      workers: 4
      
    server:
      # OPTIMIZATION: Disable image proxy to offload bandwidth to client
      # This fixes slow image loading over Tailscale relays
      image_proxy: false
      limiter: false
      
    ui:
      static_use_hash: true
      
    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      max_request_timeout: 1.5    # Aggressive timeout for low latency
      default_timeout: 1.5        # Aggressive timeout
    engines:
      - name: qwant videos
        disabled: true
      - name: vimeo
        disabled: true
    enabled_plugins:
      - 'Hash plugin'
      - 'Self Information'
      - 'Tracker URL remover'
---
# PersistentVolumeClaim for Tailscale state
# Ensures the Tailscale node maintains its identity across pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hl-searxng-tailscale-state
  namespace: searxng
  labels:
    app: searxng
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Minimal storage for Tailscale state (~10MB typical)
      storage: 100Mi
  # Uses default storageClass (local-path on k3s)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # Migrated from rasp-pi-03 (1 GiB RAM) to k3s-node-1 (12 GiB RAM)
      # RPi3 was hitting 90% memory usage and causing node instability
      nodeSelector:
        kubernetes.io/hostname: k3s-node-1

      containers:
        # Tailscale Sidecar - Provides HTTPS access via Tailnet
        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: searxng-tailscale-auth
                  key: authkey
            - name: TS_HOSTNAME
              value: "searxng"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            # CRITICAL: Disable kube secret storage to prevent TPM attestation errors
            - name: TS_KUBE_SECRET
              value: ""
            # NOTE: Tailscale Serve must be configured manually after pod starts:
            # kubectl exec -n searxng deployment/searxng -c tailscale -- \
            #   tailscale serve --bg 8080

          securityContext:
            runAsUser: 0 # Required for state directory access
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
            - name: tmp
              mountPath: /tmp

        # SearXNG Application
        - name: searxng
          image: searxng/searxng:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: SEARXNG_BASE_URL
              value: "https://searxng/"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: secret-key

          resources:
            requests:
              cpu: "500m" # Reserve 0.5 core
              memory: "512Mi" # Reserve 512Mi RAM
            limits:
              cpu: "4000m" # Allow full burst to all 4 cores
              memory: "4Gi" # Allow up to 4Gi RAM (we have 12Gi)

          livenessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: searxng-config
              mountPath: /etc/searxng
              readOnly: true

      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: hl-searxng-tailscale-state
        - name: tmp
          emptyDir: {}
