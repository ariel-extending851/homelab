apiVersion: v1
kind: Namespace
metadata:
  name: searxng
---
# SearXNG Secret Key
# Generate before deployment:
# kubectl create secret generic searxng-secret \
#   --from-literal=secret-key=$(openssl rand -hex 32) \
#   -n searxng
apiVersion: v1
kind: Secret
metadata:
  name: searxng-secret
  namespace: searxng
type: Opaque
stringData:
  secret-key: "REPLACE-WITH-SECURE-RANDOM-KEY"
---
# Tailscale Auth Key
# Create manually to avoid overwrites:
# kubectl create secret generic tailscale-auth-key \
#   --from-literal=authkey=tskey-auth-XXXXXXXXXXXX \
#   -n searxng
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    # Performance tuning for k3s-node-1 (Oracle Cloud VM)
    uwsgi:
      threads: 4
      workers: 4

    server:
      # OPTIMIZATION: Disable image proxy to offload bandwidth to client
      # This fixes slow image loading over Tailscale relays
      image_proxy: false
      limiter: false

    ui:
      static_use_hash: true

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      max_request_timeout: 1.5    # Aggressive timeout for low latency
      default_timeout: 1.5        # Aggressive timeout
    engines:
      - name: qwant videos
        disabled: true
      - name: vimeo
        disabled: true
    enabled_plugins:
      - 'Hash plugin'
      - 'Self Information'
      - 'Tracker URL remover'
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # Migrated from rasp-pi-03 (1 GiB RAM) to k3s-node-1 (12 GiB RAM)
      # RPi3 was hitting 90% memory usage and causing node instability
      nodeSelector:
        kubernetes.io/hostname: k3s-node-1

      containers:
        # SearXNG Application
        - name: searxng
          image: searxng/searxng:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: SEARXNG_BASE_URL
              value: "https://searxng/"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: secret-key

          resources:
            requests:
              cpu: "500m" # Reserve 0.5 core
              memory: "512Mi" # Reserve 512Mi RAM
            limits:
              cpu: "4000m" # Allow full burst to all 4 cores
              memory: "4Gi" # Allow up to 4Gi RAM (we have 12Gi)

          livenessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: searxng-config
              mountPath: /etc/searxng
              readOnly: true

      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config
