apiVersion: v1
kind: Namespace
metadata:
  name: searxng
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    # Performance tuning for k3s-agent-2 (AWS t3.small, 2 vCPU)
    uwsgi:
      threads: 2
      workers: 2

    server:
      # OPTIMIZATION: Disable image proxy to offload bandwidth to client
      # This fixes slow image loading over Tailscale relays
      image_proxy: false
      limiter: false

    ui:
      static_use_hash: true

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      max_request_timeout: 1.5    # Aggressive timeout for low latency
      default_timeout: 1.5        # Aggressive timeout
    engines:
      - name: qwant videos
        disabled: true
      - name: vimeo
        disabled: true
    enabled_plugins:
      - 'Hash plugin'
      - 'Self Information'
      - 'Tracker URL remover'
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # No nodeAffinity — let the scheduler place this on any available node.
      containers:
        # SearXNG Application
        - name: searxng
          image: searxng/searxng:2026.2.14-39ac4d438
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: SEARXNG_BASE_URL
              value: "https://searxng/"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: secret-key

          resources:
            requests:
              cpu: "500m" # Reserve 0.5 core
              memory: "512Mi" # Reserve 512Mi RAM
            limits:
              cpu: "1000m" # Constrained: k3s-agent-2 has 2 vCPUs (shared with other apps)
              memory: "512Mi" # Constrained: k3s-agent-2 has only 2GB total

          livenessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: searxng-config
              mountPath: /etc/searxng
              readOnly: true

      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config
