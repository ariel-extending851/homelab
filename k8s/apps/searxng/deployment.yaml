apiVersion: v1
kind: Namespace
metadata:
  name: searxng
---
# NOTE: Before deploying, generate a secure random secret key:
# kubectl create secret generic searxng-secret --from-literal=secret-key=$(openssl rand -hex 32) -n searxng
apiVersion: v1
kind: Secret
metadata:
  name: searxng-secret
  namespace: searxng
type: Opaque
stringData:
  # IMPORTANT: Replace this placeholder with a secure random key before deployment
  # Generate one with: openssl rand -hex 32
  secret-key: "REPLACE-WITH-SECURE-RANDOM-KEY-BEFORE-DEPLOYMENT"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    # Performance tuning for k3s-node-1 (Oracle Cloud VM)
    uwsgi:
      threads: 4
      workers: 4
      
    server:
      # OPTIMIZATION: Disable image proxy to offload bandwidth to client
      # This fixes slow image loading over Tailscale relays
      image_proxy: false
      limiter: false
      
    ui:
      static_use_hash: true
      
    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      max_request_timeout: 1.5    # Aggressive timeout for low latency
      default_timeout: 1.5        # Aggressive timeout
    engines:
      - name: qwant videos
        disabled: true
      - name: vimeo
        disabled: true
    enabled_plugins:
      - 'Hash plugin'
      - 'Self Information'
      - 'Tracker URL remover'
---
# PersistentVolumeClaim for Tailscale state
# Ensures the Tailscale node maintains its identity across pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hl-searxng-tailscale-state
  namespace: searxng
  labels:
    app: searxng
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Minimal storage for Tailscale state (~10MB typical)
      storage: 100Mi
  # Uses default storageClass (local-path on k3s)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # Force pod to run on rasp-pi-03 (Raspberry Pi 3)
      nodeSelector:
        kubernetes.io/hostname: rasp-pi-03
      containers:
      - name: searxng
        # Official SearXNG image with ARM64 support
        image: searxng/searxng:latest
        imagePullPolicy: IfNotPresent
        # STRICT resource limits for RPi3 with ~800MB free RAM
        # Request: 150Mi, Limit: 400Mi to leave room for OS
        resources:
          requests:
            memory: "150Mi"
            cpu: "100m"
          limits:
            memory: "400Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SEARXNG_BASE_URL
          value: "http://searxng.local/"
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              name: searxng-secret
              key: secret-key
        # Liveness probe to detect zombie processes
        livenessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness probe to ensure pod is ready before receiving traffic
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: searxng-config
          mountPath: /etc/searxng
          readOnly: true
      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: hl-searxng-tailscale-state
        - name: tmp
          emptyDir: {}
