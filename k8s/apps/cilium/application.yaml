apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.19.3
    helm:
      releaseName: cilium
      values: |
        # Tailscale-aware lightweight profile for hybrid x86/ARM64 K3s.
        # Tailscale already encrypts node-to-node — do NOT double-encrypt.
        # MTU=1280 matches Tailscale's WireGuard MTU.
        kubeProxyReplacement: false
        routingMode: tunnel
        tunnelProtocol: vxlan
        mtu: 1280
        devices: tailscale0

        encryption:
          enabled: false

        ipam:
          mode: kubernetes

        bpf:
          masquerade: false
          mapDynamicSizeRatio: 0.0025
          lbExternalClusterIP: false

        l7Proxy: false
        bandwidthManager:
          enabled: false

        hubble:
          enabled: false
          relay:
            enabled: false
          ui:
            enabled: false

        operator:
          replicas: 1
          # Keep operator off the 1GB Pi3.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.kubernetes.io/instance-type
                        operator: NotIn
                        values: [raspberry-pi-3]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
          prometheus:
            enabled: true
            serviceMonitor:
              enabled: false

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

        cni:
          exclusive: true

        nodeinit:
          enabled: false

        prometheus:
          enabled: true
          serviceMonitor:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
