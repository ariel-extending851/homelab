# Tailscale Authentication Secret
# kubectl create secret generic tailscale-auth \
#   --from-literal=authkey=tskey-auth-XXXXXXXXXXXX-YYYYYYYYYYYYYYYYYYYY \
#   -n prometheus
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: prometheus
type: Opaque
stringData:
  authkey: "REPLACE-WITH-TAILSCALE-AUTH-KEY-BEFORE-DEPLOYMENT"
