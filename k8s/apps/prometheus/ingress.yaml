apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: prometheus
  labels:
    app: prometheus
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: prometheus
      port:
        number: 9090
  tls:
    - hosts:
        - prometheus.tail57bf10.ts.net
