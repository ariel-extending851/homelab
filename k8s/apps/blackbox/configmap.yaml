apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: blackbox
data:
  blackbox.yml: |
    modules:
      # ICMP Ping
      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: "ip4"
      
      # DNS Test (Google)
      dns_google:
        prober: dns
        dns:
          transport_protocol: "udp"
          preferred_ip_protocol: "ip4"
          query_name: "google.com"
          query_type: "A"
