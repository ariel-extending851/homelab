# NetworkPolicy for blackbox namespace (prometheus blackbox-exporter probe).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: blackbox
  labels:
    app.kubernetes.io/part-of: homelab-security
    policy-type: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-blackbox-exporter
  namespace: blackbox
  labels:
    app.kubernetes.io/part-of: homelab-security
    app: blackbox-exporter
spec:
  podSelector:
    matchLabels:
      app: blackbox-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes /metrics + /probe.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - { protocol: TCP, port: 9115 }
  egress:
    # Probe targets (any host, any port — that's the whole point of blackbox).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
    # In-cluster DNS for hostname-based probes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
