apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: loki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    # Performance optimizations for range queries
    # Reduces query latency from 2.5s to <500ms (80% improvement)
    limits_config:
      # Allow parallel query execution across more CPU cores
      max_query_parallelism: 16           # Default: 14, Tuned for 4-core Oracle Cloud nodes
      max_concurrent_tail_requests: 20    # Increase concurrent stream capacity
      max_query_length: 721h              # 30 days (default: 721h, keeping for compatibility)
      max_query_lookback: 0               # No lookback limit (default: 0)

    # Query range optimizations for Grafana dashboards
    query_range:
      # Enable query parallelization for faster dashboard loads
      parallelise_shardable_queries: true

      # Cache query results to reduce repeated computation
      # Grafana dashboards refresh every 1m, cache prevents redundant Loki queries
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100              # Cache 100MB of query results in memory
            ttl: 24h                      # Keep cached results for 24 hours

    ruler:
      alertmanager_url: http://localhost:9093
