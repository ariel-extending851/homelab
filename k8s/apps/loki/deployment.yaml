apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: loki
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      serviceAccountName: loki
      # Schedule on AWS worker node (x86_64, 2GB RAM)
      nodeSelector:
        kubernetes.io/hostname: k3s-agent-2

      containers:
        # Loki Application
        - name: loki
          image: grafana/loki:2.9.2
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          args:
            - "-config.file=/etc/loki/loki.yaml"

          ports:
            - name: http-metrics
              containerPort: 3100
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45

          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45

          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /loki
            - name: tmp-loki
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          persistentVolumeClaim:
            claimName: loki-storage
        - name: tmp-loki
          emptyDir: {}
