---
# Syncs the ClusterPolicy objects under k8s/system/kyverno/policies/. Lives in
# a separate Application (and a later sync-wave) so the Kyverno chart and its
# CRDs are installed before the policies that reference them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hl-kyverno-policies
  namespace: argocd
  labels:
    app.kubernetes.io/name: hl-kyverno-policies
    app.kubernetes.io/part-of: homelab
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:ariel-extending851/homelab.git
    targetRevision: develop
    path: k8s/system/kyverno/policies

  destination:
    server: https://kubernetes.default.svc
    # ClusterPolicy is cluster-scoped; namespace is irrelevant but Argo
    # requires the field. Use kyverno (the chart's namespace) for affinity.
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
