---
# Mirrors k8s/policies/health_probes.rego (deny-on-missing-readinessProbe).
# livenessProbe is intentionally NOT enforced — the Rego only warns on it,
# and a misconfigured liveness probe restarts healthy containers.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: hl-require-readiness-probe
  annotations:
    policies.kyverno.io/title: Require readinessProbe on every container
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must declare a readinessProbe. Without it, Kubernetes
      sends traffic before the app is ready, causing errors during rollouts
      and restarts. Mirrors the conftest gate in k8s/policies/health_probes.rego.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: containers-must-declare-readiness-probe
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: >-
          Container '{{ element.name }}' must declare a readinessProbe
          (httpGet, tcpSocket, exec, or grpc).
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{ keys(element.readinessProbe || `{}`) | length(@) }}"
                    operator: Equals
                    value: 0
