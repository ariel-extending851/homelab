---
# Mirrors k8s/policies/security_context.rego. Every container — including
# initContainers — must explicitly set allowPrivilegeEscalation: false.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: hl-disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow privilege escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container in every Pod must set
      securityContext.allowPrivilegeEscalation to false. Without this a process
      can gain more privileges than its parent — a common container-escape
      vector. Mirrors the conftest gate in k8s/policies/security_context.rego.
spec:
  validationFailureAction: Audit  # flip to Enforce after one clean reporting cycle
  background: true
  rules:
    - name: containers-must-disable-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: >-
          Container '{{ element.name }}' must set
          securityContext.allowPrivilegeEscalation: false.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || 'unset' }}"
                    operator: NotEquals
                    value: false

    - name: init-containers-must-disable-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
      preconditions:
        all:
          - key: "{{ request.object.spec.initContainers || `[]` | length(@) }}"
            operator: GreaterThan
            value: 0
      validate:
        message: >-
          initContainer '{{ element.name }}' must set
          securityContext.allowPrivilegeEscalation: false.
        foreach:
          - list: request.object.spec.initContainers
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || 'unset' }}"
                    operator: NotEquals
                    value: false
