apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default
spec:
  statefulSet:
    pod:
      # No nodeSelector — let K8s scheduler distribute proxies across all nodes
      # Tailscale mesh works over WireGuard regardless of node placement
      # This prevents memory pressure on k3s-server-1 (2GB node)
      nodeSelector:
        kubernetes.io/os: linux
