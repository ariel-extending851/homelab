---
# Kustomization for ArgoCD/GitOps deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hl-longhorn

resources:
  - namespace.yaml
  - storageclass.yaml

# Helm chart configuration for ArgoCD Application
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.6.0
    releaseName: hl-longhorn
    namespace: hl-longhorn
    valuesFile: values.yaml
    includeCRDs: true

# LabelTransformer to ensure all resources have proper labels
transformers:
  - |
    apiVersion: builtin
    kind: LabelTransformer
    metadata:
      name: hl-labels
    labels:
      app.kubernetes.io/part-of: hl-homelab
      managed-by: argocd
    fieldSpecs:
      - path: metadata/labels
        create: true
