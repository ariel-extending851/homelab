# Strategic merge patch for argocd-repo-server
# Adds SOPS+Age decryption support via CMP sidecar (ArgoCD v2.6+/v3.x)
#
# Architecture:
#   init-container (install-sops) → downloads SOPS binary (arch-aware)
#   sidecar (cmp-sops) → runs argocd-cmp-server with SOPS plugin
#   repo-server → mounts Age key + SOPS binary for inline decryption
#
# Prerequisites:
#   - Secret 'sops-age-key' with Age private key in namespace 'argocd'
#   - ConfigMap 'cmp-plugin' with plugin.yaml in namespace 'argocd'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      # Pin to rasp-pi-04. The init container detects $(uname -m) so the
      # binary download is arch-correct; the constraint here is operational,
      # not architectural:
      #   - rasp-pi-03 is the AdGuard host. `rpi_optimization` replaces
      #     /etc/resolv.conf with a static upstream so the kubelet stops
      #     hijacking port 53. When argocd-repo-server lands there, CoreDNS
      #     forwards external lookups through that constrained path and
      #     `dial tcp: lookup github.com ... no such host` blocks every
      #     Application sync. pi-03 also has only 1 GB RAM — repo-server
      #     plus AdGuard would push it toward OOM.
      #   - rasp-pi-04 has 8 GB and a normal resolv.conf.
      # `$patch: replace` is required: strategic merge defaults to "merge"
      # for map[string]string, so without the directive the legacy
      # `kubernetes.io/arch: amd64` selector (from the hybrid era) would
      # survive and re-block scheduling on every patch re-apply.
      nodeSelector:
        $patch: replace
        kubernetes.io/hostname: rasp-pi-04
      # Init container: copy SOPS binary from a pre-built multi-arch image.
      # Previous version did `apk add curl` + `curl github releases`, which
      # required external DNS at pod startup. In this cluster CoreDNS forwards
      # to /etc/resolv.conf which lists Tailscale MagicDNS (100.100.100.100)
      # first; MagicDNS SERVFAILs externals (no "Override local DNS" set on
      # the tailnet admin) and CoreDNS does not fall through to 1.1.1.1/8.8.8.8.
      # Result: alpine + apk + curl was unreachable. The pre-built image needs
      # zero in-pod network — the image pull itself uses the host resolver
      # (which works) and the script only does cp+chmod.
      initContainers:
        - name: install-sops
          # Multi-arch (amd64 + arm64) manifest list pinned by digest.
          # Variant: alpine (~12 MB, no GPG/cloud-KMS — unneeded here).
          image: quay.io/getsops/sops:v3.9.4-alpine@sha256:4453219701ee1d6c6bef59839c1d59887c148f8a1930aec4fa112210fcddee88
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              cp /usr/local/bin/sops /custom-tools/sops
              chmod +x /custom-tools/sops
              /custom-tools/sops --version
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # cp preserves ownership/mode of the source binary.
                - CHOWN
                - FOWNER
            seccompProfile:
              type: RuntimeDefault
      containers:
        # Main repo-server container — mount Age key + SOPS for inline use
        - name: argocd-repo-server
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /helm-sops-tools/age-key/keys.txt
          # Only mount what the SOPS pipeline actually needs. Upstream already
          # provides tmp, ssh-known-hosts, gpg-keys, gpg-keyring, argocd-repo-
          # server-tls — redefining them as emptyDir here either produces
          # invalid volume specs (multiple types) or shadows upstream
          # configMap/secret content (e.g. ssh_known_hosts gets blanked,
          # breaking GitHub host-key validation).
          volumeMounts:
            - name: sops-age-key
              mountPath: /helm-sops-tools/age-key
              readOnly: true
            - name: custom-tools
              mountPath: /usr/local/bin/sops
              subPath: sops
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        # CMP sidecar: runs argocd-cmp-server with SOPS plugin
        # Discovers SOPS-encrypted files and decrypts before kustomize build
        - name: cmp-sops
          image: quay.io/argoproj/argocd:v3.3.0@sha256:ed0740273790e58154816104c1e1b41fb308a9c516ade3d0f195fa56f1840cca
          command:
            - /var/run/argocd/argocd-cmp-server
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /helm-sops-tools/age-key/keys.txt
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: cmp-plugin
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            - name: cmp-tmp
              mountPath: /tmp
            - name: sops-age-key
              mountPath: /helm-sops-tools/age-key
              readOnly: true
            - name: custom-tools
              mountPath: /usr/local/bin/sops
              subPath: sops
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: sops-age-key
          secret:
            secretName: sops-age-key
            # 0444: world-readable within the pod — safe because:
            #   1. Secret is RBAC-protected (only argocd-repo-server SA can mount)
            #   2. Pod runs runAsNonRoot (no privilege escalation)
            #   3. K8s mounted secrets are root-owned; uid 999 (argocd) needs read access
            defaultMode: 0444
        - name: custom-tools
          emptyDir: {}
        - name: cmp-plugin
          configMap:
            name: cmp-plugin
        - name: cmp-tmp
          emptyDir: {}
        # argocd-repo-server-{tmp,ssh,tls,gpg-source,gpg-keys} intentionally not
        # declared here — see comment in volumeMounts above. Upstream provides
        # tmp, ssh-known-hosts, argocd-repo-server-tls, gpg-keys, gpg-keyring
        # with the right types; redefining them as emptyDir would shadow the
        # upstream configMap/secret content.
