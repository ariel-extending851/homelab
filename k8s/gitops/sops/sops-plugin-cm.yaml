apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops-kustomize
    spec:
      allowConcurrency: true
      discover:
        find:
          command:
            - sh
            - "-c"
            - "find . -name '.sops.yaml'"
      generate:
        command:
          - bash
          - "-c"
          - |
            set -euo pipefail

            export SOPS_AGE_KEY_FILE=/helm-sops-tools/age-key/keys.txt

            # Decrypt all SOPS-encrypted YAML files in-place before kustomize build
            # Detection: presence of top-level 'sops:' key (SOPS envelope marker)
            while IFS= read -r -d '' file; do
              if grep -q '^sops:' "$file" 2>/dev/null; then
                echo "Decrypting $file..." >&2
                sops -d --input-type yaml --output-type yaml "$file" > "${file}.dec"
                mv "${file}.dec" "$file"
              fi
            done < <(find . \( -name '*.yaml' -o -name '*.yml' \) -not -name '.sops.yaml' -print0)

            # Render manifests via Kustomize or Helm
            if [ -f "Chart.yaml" ]; then
              helm template .
            elif [ -f "kustomization.yaml" ]; then
              kustomize build .
            else
              cat *.yaml
            fi
      lockRepo: false
