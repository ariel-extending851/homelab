---
# ArgoCD App-of-Apps — Hybrid AWS + Raspberry Pi variant.
#
# Two Applications in one manifest. Each points at its environment-scoped
# Kustomize overlay; scheduling between AWS and Pi nodes is handled by the
# per-app nodeSelector (`homelab.io/tier: cloud` for cloud apps,
# `kubernetes.io/hostname: rasp-pi-XX` for Pi-pinned apps). The cluster is
# single — AWS server is the control-plane, Pis join as agents — so both
# Applications target `https://kubernetes.default.svc`.
#
# Selected by the hybrid deploy via inventory/hybrid.yml overriding
# `apps_root_manifest_path: k8s/gitops/apps-root-hybrid.yaml`.
#
# The third Application in the homelab — `homelab-media-root` — is created
# separately by the argocd Ansible role's bootstrap_apps_extra.yml task
# (reads argocd_extra_* SOPS vars), pointing at the private homelab-media
# repo. It is NOT defined here because its repo URL is sensitive.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-apps-cloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: homelab-apps-cloud
    app.kubernetes.io/part-of: homelab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:ariel-extending851/homelab.git
    targetRevision: develop
    path: k8s/apps/envs/cloud
    plugin:
      name: sops-kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-apps-pi
  namespace: argocd
  labels:
    app.kubernetes.io/name: homelab-apps-pi
    app.kubernetes.io/part-of: homelab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:ariel-extending851/homelab.git
    targetRevision: develop
    path: k8s/apps/envs/pi-only
    plugin:
      name: sops-kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
