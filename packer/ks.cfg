text
lang en-US.UTF-8
keyboard us
network --onboot=yes --device=eth0 --bootproto=dhcp --ipv6=auto --activate

url --url="https://edgeuno-bog2.mm.fcix.net/fedora/linux/releases/42/Server/x86_64/os/"

timezone Europe/London --isUtc
rootpw --plaintext fedora
user --name=ariel --groups=wheel --password=fedora --plaintext

services --enabled=sshd
firewall --enabled --service=ssh

selinux --disabled

zerombr
clearpart --all --initlabel
autopart --type=lvm

%packages
@core
openssh-server
%end

skipx
reboot

%post
echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant
chmod 440 /etc/sudoers.d/vagrant
%end
