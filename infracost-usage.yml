version: 0.1
resource_usage:
  aws_s3_bucket.ssm_transfer:
    standard:
      storage_gb: 10
      monthly_put_copy_post_list_requests: 1000
      monthly_get_select_and_all_other_requests: 5000

  module.scheduler[0].aws_lambda_function.scheduler:
    monthly_requests: 10000
    request_duration_ms: 250

  aws_instance.shadow_server[0]:
    operating_system: linux
    monthly_hrs: 330

  aws_instance.shadow_agent[0]:
    operating_system: linux
    monthly_hrs: 330

  # Private ECR registry kept under the 500 MB free tier by the lifecycle policy.
  module.ecr[0].aws_ecr_repository.repos["hl-apps"]:
    storage_gb: 0.5

  # NOTE: DLM EBS snapshots (module.backup_ebs) are created at runtime by the
  # lifecycle policy, not as Terraform resources, so Infracost does not cost
  # them here. Estimate ~$1-3/month incremental — see cost-and-scheduling.md.
  # Budgets / Cost Anomaly Detection / Access Analyzer / SNS / the billing alarm
  # carry no billable usage knobs at homelab volume (all free tier).
