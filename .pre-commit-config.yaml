repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ".*\\.md$|.*\\.tfvars$"
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # mkdocs.yml uses Python-specific YAML tags (!!python/name:...) for
        # the pymdownx.superfences Mermaid extension, which check-yaml
        # cannot parse with the safe loader.
        exclude: "(.*\\.sops\\.yaml|k8s/charts/.*/templates/.*|^mkdocs\\.yml$)"
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-json
      - id: detect-private-key
      - id: mixed-line-ending

  # Secret scanning
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.82.6
    hooks:
      - id: trufflehog
        name: TruffleHog
        description: Detect secrets in your data
        entry: trufflehog git file://. --since-commit HEAD~1 --only-verified --fail
        language: system
        stages: ["pre-commit", "pre-push"]

  # Terraform formatting and validation
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
        args:
          - --args=-diff
          - --args=-write=true
      - id: terraform_validate
        exclude: ".*\\.tfplan$|.*\\.tfstate$"

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [-e, SC1091]
        files: "\\.sh$"

  # Python linting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3
        files: ".*\\.py$"

  # Markdown linting (style + syntax)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json", "--ignore-path", ".markdownlintignore"]

  # Service catalog drift check
  - repo: local
    hooks:
      - id: service-catalog-sync
        name: service-catalog-sync
        description: Verify docs/services/README.md matches k8s/apps/
        entry: python3 bin/generate_service_catalog.py --check
        language: system
        files: ^(k8s/apps/.*|docs/services/README\.md|bin/generate_service_catalog\.py)$
        pass_filenames: false
      - id: catalog-score
        name: catalog-score
        description: Validate k8s/apps/*/catalog-info.yaml against scorecard rules (R001-R009)
        entry: python3 bin/score_catalog.py
        language: system
        files: ^(k8s/apps/.*|bin/score_catalog\.py)$
        pass_filenames: false

  # GitHub Actions workflow linting (syntax + security)
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        description: Lint GitHub Actions workflow syntax
        entry: bash -c 'command -v actionlint >/dev/null 2>&1 && actionlint "$@" || mise exec -- actionlint "$@"' --
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true
      - id: zizmor
        name: zizmor
        description: Security-lint GitHub Actions workflows
        entry: bash -c 'command -v zizmor >/dev/null 2>&1 && zizmor --min-severity=medium "$@" || mise exec -- zizmor --min-severity=medium "$@"' --
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true
