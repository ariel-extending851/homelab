receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'meu-pc-exporter'
          scrape_interval: 10s
          static_configs:
            - targets: ['node-exporter:9100']

processors:
  batch:
  resource:
    attributes:
      - key: service.name
        value: "bluefin"
        action: upsert
      - key: os.type
        value: "workstation"
        action: upsert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889" # Porta onde a VM vai bater para pegar dados
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource, batch]
      exporters: [prometheus]
