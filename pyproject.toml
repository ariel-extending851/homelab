[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab"
version = "0.1.0"
description = "Homelab infrastructure-as-code project"

[project.optional-dependencies]
# Pinned CI/test toolchain. Single source of truth for any workflow step
# that needs python deps — install with `pip install -e '.[ci]'`.
# Floors driven by 2024 advisories: jinja2 (CVE-2024-34064), urllib3
# (CVE-2024-37891 — transitive via botocore, pinned explicitly), pyyaml
# safe-loader patches.
ci = [
  "pytest==9.0.3",
  "pytest-cov==6.0.0",
  "pytest-benchmark==5.1.0",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  "boto3==1.43.34",
  "urllib3>=2.7.0",
  "moto[ec2,s3,iam]==5.2.2",
]

[project.scripts]
homelab = "bin.homelab:main"

[tool.setuptools]
packages = ["bin"]

[tool.pytest.ini_options]
# Test discovery paths
testpaths = [
  "bin/tests",
  "infra/aws/modules/scheduler/lambda_src/tests",
]

# Pytest options
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Custom markers — see bin/tests/conftest.py for the --run-live opt-in.
markers = [
  "live: requires a live cluster (or external service); skipped unless --run-live is passed",
  "chaos: injects deterministic faults (OOM, mesh partition); requires CHAOS_ACK env and --run-live",
  "disruptive: cuts shared infra (mesh VPN, network); manual-trigger workflows only — never on schedule",
]

[tool.coverage.run]
# Measure branch coverage
branch = true

# Omit test files and __pycache__
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
  "*/venv/*",
  "*/.venv/*",
]

# Relative file paths
relative_files = true

[tool.coverage.report]
# Floor: any pytest run with --cov fails the suite if total coverage drops
# below this threshold. Current actual coverage is ~93%; 80 leaves a 13pt
# buffer so genuine refactors don't get blocked, but a real regression does.
fail_under = 80

# Skip lines with pragma: no cover
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]

# Show missing lines in output
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
