# GitHub Actions self-hosted runner — Docker Compose deployment.
#
# Target: a host with Docker available and sufficient capacity (pc-tower today:
# Bluefin / Fedora x86_64, 12c / 15G). Runs as a long-lived container that
# the Docker daemon keeps alive across DevPod / shell exits. The bind-mounted
# `/var/run/docker.sock` lets workflow jobs (k3d, kind, Trivy, etc.) spawn
# sibling containers without paying for nested-Docker overhead.
#
# Resource caps prevent the runner from saturating the host during heavy jobs.
#
# Bootstrap: `make runner-up` (decrypts SOPS, exports ACCESS_TOKEN, starts).

services:
  runner:
    image: myoung34/github-runner:2.319.1
    container_name: hl-github-runner
    restart: unless-stopped
    pull_policy: missing
    environment:
      REPO_URL: https://github.com/ariel-extending851/homelab
      RUNNER_NAME: pc-tower-runner
      LABELS: pc-homelab
      RUNNER_WORKDIR: /tmp/runner/work
      # Persistent runner: re-registers automatically on container restart,
      # picks up the same identity. Set EPHEMERAL=true to throw it away
      # after one job (slower but safer if jobs leave state behind).
      EPHEMERAL: "false"
      # Inject at runtime (never commit). `make runner-up` reads SOPS.
      ACCESS_TOKEN: ${ACCESS_TOKEN:?ACCESS_TOKEN must be set — run via make runner-up}
    volumes:
      # Sibling-container access: jobs can `docker run` / `docker build` and
      # those containers land on the host's daemon, not nested.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist runner work tree so cached tool downloads survive restarts.
      - runner-work:/tmp/runner/work
    deploy:
      resources:
        limits:
          # ~half the host's 12 cores; foreground work keeps a fair share.
          cpus: '6.0'
          # ~half the host's 15 GB; leaves headroom for desktop + DevContainer.
          memory: 8G

volumes:
  runner-work:
    name: hl-github-runner-work
