---
# rasp-pi-03 host overrides.
#
# AdGuard Home (k8s/apps/adguard) is pinned here via nodeSelector so the
# rpi_optimization role disables systemd-resolved on this host to free
# port 53 for the hostNetwork pod. The GL.iNet router's gatekeeper role
# DNATs LAN :53 traffic to this host's LAN IP (192.168.8.12, see
# group_vars/router.sops.yml DHCP reservations) and falls back to public
# DNS via cron when the host is unreachable.
adguard_dns_host: true
