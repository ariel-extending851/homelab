---
# Mock AWS Inventory (offline hybrid dry-run)
# Mirrors terraform_inventory_aws.py structure without live AWS access.

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
    ansible_python_interpreter: /usr/bin/python3

  children:
    k3s_server:
      hosts:
        k3s-server-aws:
          ansible_connection: local
          ansible_host: 100.64.0.1
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          mock_inventory: true
          node_ip: 100.64.0.1
          node_name: k3s-server-aws
          instance_type: t3.medium
          private_ip: 172.31.0.10
          public_ip: 203.0.113.10
          k3s_control_node: true
          k3s_server_config:
            write_kubeconfig_mode: "0644"
            cluster_cidr: 10.42.0.0/16
            service_cidr: 10.43.0.0/16
            tls_san:
              - 100.64.0.1
              - 172.31.0.10
              - k3s-server-aws
            disable:
              - traefik
            flannel_backend: vxlan
            disable_cloud_controller: true
            disable_network_policy: false
          node_labels:
            node.kubernetes.io/instance-type: t3.medium
            topology.kubernetes.io/zone: us-east-1a
          node_taints: []

    k3s_agent:
      hosts:
        k3s-agent-aws:
          ansible_connection: local
          ansible_host: 100.64.0.2
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          mock_inventory: true
          node_ip: 100.64.0.2
          node_name: k3s-agent-aws
          instance_type: t3.small
          private_ip: 172.31.0.11
          public_ip: 203.0.113.11
          k3s_control_node: false
          node_labels:
            node.kubernetes.io/instance-type: t3.small
            topology.kubernetes.io/zone: us-east-1a
          node_taints: []

    aws_instances:
      hosts:
        k3s-server-aws: {}
        k3s-agent-aws: {}

    amd64_nodes:
      hosts:
        k3s-server-aws: {}
        k3s-agent-aws: {}
