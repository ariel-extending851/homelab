---
# Hybrid AWS + Pi inventory overlay (used in addition to production.yml and
# terraform_inventory_aws.py).
#
# Purpose: keep the AWS k3s_server as the control plane (dynamic inventory
# already places it in the k3s_server group) and add per-host tier labels
# so the apps overlays (k8s/apps/envs/{cloud,pi-only}/) can pin pods via
# `nodeSelector: homelab.io/tier: <value>`. Also overrides
# `apps_root_manifest_path` so the argocd Ansible role bootstraps the
# hybrid app-of-apps manifest instead of the pi-only one.
#
# Layered usage (later -i wins on conflicts, merges otherwise):
#   ansible-playbook -i ansible/inventory/production.yml \
#                    -i ansible/inventory/terraform_inventory_aws.py \
#                    -i ansible/inventory/hybrid.yml \
#                    ansible/playbooks/site.yml
#
# Or simply: make hybrid-deploy
#
# Why this is split from pi-only.yml:
#   pi-only.yml promotes rasp-pi-04 to k3s_server and routes Pi-to-Pi traffic
#   over LAN. In hybrid mode the AWS server owns the control plane and the
#   Pis join it as plain k3s agents — production.yml + dynamic inventory
#   already describe that topology correctly, so the only thing left to add
#   are the node labels and the apps_root_manifest_path override.

all:
  children:
    k3s_server:
      hosts:
        # Dynamic inventory (terraform_inventory_aws.py) populates this group
        # with the AWS server hostname (`k3s-server`). The vars below apply
        # to that host via the group; if the hostname changes in the future,
        # consider moving to host_vars/k3s-server.yml.
        k3s-server:
          # Hybrid mode: apps-root points at the manifest that defines BOTH
          # the cloud overlay (k8s/apps/envs/cloud) and the Pi overlay
          # (k8s/apps/envs/pi-only) as separate ArgoCD Applications.
          # Host-scoped (not in all.vars) because group_vars/k3s_server.yml
          # declares this var and would otherwise win on precedence.
          apps_root_manifest_path: k8s/gitops/apps-root-hybrid.yaml

    k3s_agent:
      hosts:
        # AWS worker — heavy observability stack lives here (prometheus, loki,
        # grafana, otel-collector, falco, velero, etc.). Pods are pinned via
        # nodeSelector: homelab.io/tier: cloud in each Deployment.
        k3s-agent:
          node_labels:
            homelab.io/tier: cloud

        # Pi worker (8 GB) — hosts the homelab-media stack from the external
        # private repo. Pi-only apps that nodeSelector via hostname
        # (storage-latency) also land here.
        rasp-pi-04:
          node_labels:
            homelab.io/tier: pi-04
            # production.yml already sets `storage: media` here; this dict
            # is merged with the parent inventory's node_labels (Ansible
            # merges host_vars dicts by default with the `default(combine)`
            # filter applied in the k3s role).

        # Pi worker (1 GB) — dedicated to AdGuard via nodeSelector
        # `kubernetes.io/hostname: rasp-pi-03`. Opt out of Tailscale-based
        # flannel so the agent joins the AWS server over Tailscale only,
        # not via a broken-cross-Pi VXLAN path.
        rasp-pi-03:
          node_labels:
            homelab.io/tier: pi-03
