---
# Molecule test suite for tailscale role.
# Focus: validate RPi4-only subnet-router/exit-node branch and sysctl effects.
# We do not test authenticated Tailscale daemon behavior in Docker.

driver:
  name: docker

platforms:
  - name: rasp-pi-04
    # Pinned by digest to avoid drift in CI; bump when geerlingguy refreshes upstream.
    image: geerlingguy/docker-ubuntu2204-ansible:latest@sha256:3a9474d843917fbeb737a78626c1b8bc31daf6424fe51575e6ce4affffecfa24
    privileged: true
    pre_build_image: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  config_options:
    defaults:
      gathering: smart
      fact_caching: memory
  inventory:
    hosts:
      all:
        hosts:
          rasp-pi-04:

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint
