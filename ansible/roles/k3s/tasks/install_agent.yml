---
# ansible/roles/k3s/tasks/install_agent.yml
# Install and configure k3s agent (worker node)

- name: Check for server URL and token
  ansible.builtin.assert:
    that:
      - k3s_server_url is defined
      - k3s_node_token is defined
    fail_msg: "k3s_server_url and k3s_node_token must be provided for agent installation"

- name: Create k3s agent config file
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: '0644'
  notify: Restart k3s agent

- name: Create token file
  ansible.builtin.copy:
    content: "{{ k3s_node_token }}"
    dest: "{{ k3s_token_file }}"
    mode: '0600'

- name: Download and install k3s agent
  ansible.builtin.shell: |
    curl -sfL {{ k3s_install_url }} | \
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    INSTALL_K3S_CHANNEL="{{ k3s_channel }}" \
    K3S_URL="{{ k3s_server_url }}" \
    K3S_TOKEN="{{ k3s_node_token }}" \
    sh -s - agent \
    --config {{ k3s_config_dir }}/config.yaml
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_SKIP_START: "false"
  register: k3s_agent_install

- name: Wait for k3s-agent service to start
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
  register: k3s_agent_status
  until: k3s_agent_status.status.ActiveState == "active"
  retries: 12
  delay: 5

- name: Display agent installation status
  ansible.builtin.debug:
    msg:
      - "k3s agent installed successfully"
      - "Connected to server: {{ k3s_server_url }}"
      - "Node should appear in cluster within 30 seconds"
