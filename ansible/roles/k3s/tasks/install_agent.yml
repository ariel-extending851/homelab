---
# ansible/roles/k3s/tasks/install_agent.yml
# Install and configure k3s agent (worker node).
#
# Handles three distinct prior states of the node:
#   A) Fresh node             — no k3s at all → install agent from scratch.
#   B) Was a k3s server       — k3s.service present, no k3s-agent.service
#                              → run k3s-uninstall.sh first, then install agent.
#   C) Was a k3s agent        — k3s-agent.service present
#       C1. Healthy, correct URL → idempotent no-op (creates: guard skips).
#       C2. Unhealthy or stale URL → uninstall agent, reinstall.

# ── Pre-flight assertion ──────────────────────────────────────────────────────

- name: Assert server URL and token are defined
  ansible.builtin.assert:
    that:
      - k3s_server_url is defined
      - k3s_node_token is defined
    fail_msg: "k3s_server_url and k3s_node_token must be provided for agent installation"
  tags:
    - validate

# ── Tailscale IP detection ────────────────────────────────────────────────────

- name: Detect Tailscale IP (if Tailscale is enabled)
  ansible.builtin.shell: tailscale ip -4 2>/dev/null || echo ""
  register: tailscale_ip_detected
  changed_when: false
  failed_when: false
  when: k3s_use_tailscale | default(true) | bool

- name: Set Tailscale IP fact
  ansible.builtin.set_fact:
    k3s_tailscale_ip: "{{ tailscale_ip_detected.stdout | trim }}"
  when:
    - k3s_use_tailscale | default(true) | bool
    - tailscale_ip_detected.stdout | trim | length > 0

# ── Case B: Server-to-Agent Promotion ────────────────────────────────────────
# If this node was previously installed as a k3s server (control plane), the
# server unit and all of its state (/var/lib/rancher/k3s, etcd, certs) must be
# completely removed before re-joining as an agent.  k3s-uninstall.sh covers
# binaries, systemd units, iptables rules, and CNI interfaces.
#
# Implemented as a block so all promotion tasks share a single `when` condition
# and a rescue path can catch an incomplete uninstall before agent install runs.

- name: Detect legacy k3s server unit (node was previously a control plane)
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_legacy_server_unit

- name: "Case B: Server-to-Agent Promotion — full server cleanup"
  when: k3s_legacy_server_unit.stat.exists
  block:
    - name: Stop legacy k3s server before uninstall
      ansible.builtin.systemd:
        name: k3s
        state: stopped
      failed_when: false # tolerate already-stopped / failed service

    - name: Uninstall legacy k3s server role (node is being demoted to agent)
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      when: not ansible_check_mode
      changed_when: true

    - name: Purge residual server data directory after server uninstall
      ansible.builtin.file:
        path: /var/lib/rancher/k3s
        state: absent

    - name: Purge residual server config directory after server uninstall
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: absent

    - name: Reload systemd daemon after server uninstall
      ansible.builtin.systemd:
        daemon_reload: true

  rescue:
    # If any block task fails (e.g. uninstall script non-zero exit) log the
    # failure clearly.  The outer idempotency guard on the agent install
    # (creates: /etc/systemd/system/k3s-agent.service) ensures we don't
    # clobber an already-running agent.
    - name: Log server-to-agent promotion failure
      ansible.builtin.fail:
        msg: >
          Server-to-agent promotion failed on {{ inventory_hostname }}.
          Review the k3s-uninstall.sh output above.  You may need to run
          'make clean-pi-server' manually before re-running this playbook.

# ── Case C2: Stale / unhealthy agent detection ────────────────────────────────
# Even when the env file URL is already correct, stale CA certs in
# /var/lib/rancher/k3s/agent/ from a previous cluster cause the agent to stay
# in "activating" indefinitely.  We detect this via the service's ActiveState
# and trigger a full uninstall + reinstall.

- name: Read current k3s agent env file (URL + token)
  ansible.builtin.slurp:
    src: /etc/systemd/system/k3s-agent.service.env
  register: k3s_agent_env_raw
  failed_when: false # file may not exist on first install

- name: Check whether k3s-agent service is currently healthy
  ansible.builtin.command: systemctl is-active k3s-agent # noqa: command-instead-of-module
  register: k3s_agent_active
  changed_when: false
  failed_when: false

- name: Determine whether agent needs reinstall
  ansible.builtin.set_fact:
    k3s_agent_needs_reinstall: >-
      {{
        (k3s_agent_env_raw.content is defined and
         k3s_server_url not in (k3s_agent_env_raw.content | b64decode))
        or
        (k3s_agent_env_raw.content is defined and
         k3s_agent_active.stdout != 'active')
      }}

- name: Uninstall stale k3s agent (wrong server URL or unhealthy — full reinstall required)
  ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
  when:
    - k3s_agent_needs_reinstall | bool
    - k3s_agent_env_raw.content is defined # only when already installed
    - not ansible_check_mode
  changed_when: true

# ── Config directory ─────────────────────────────────────────────────────────
# Must exist after any uninstall path because uninstall scripts wipe /etc/rancher/.

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"

# ── Agent configuration files ────────────────────────────────────────────────

- name: Create k3s agent config file
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0644"
  notify: Restart k3s agent

- name: Create k3s token file
  ansible.builtin.copy:
    content: "{{ k3s_node_token }}"
    dest: "{{ k3s_token_file }}"
    mode: "0600"
  no_log: true

# ── Installation ─────────────────────────────────────────────────────────────

- name: Download and install k3s agent # noqa: command-instead-of-module
  ansible.builtin.shell: | # noqa: command-instead-of-module
    curl -sfL {{ k3s_install_url }} | sh -s - agent \
    --config {{ k3s_config_dir }}/config.yaml \
    {% if k3s_tailscale_ip is defined and k3s_tailscale_ip | length > 0 %}--node-ip {{ k3s_tailscale_ip | quote }} --flannel-iface tailscale0{% endif %}
  args:
    # MUDANÇA CRUCIAL: O gatilho agora é o arquivo de serviço.
    # Se o serviço não existe, o instalador PRECISA rodar de novo.
    creates: /etc/systemd/system/k3s-agent.service
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    # No INSTALL_K3S_NAME: the k3s installer's default for agent already
    # produces /etc/systemd/system/k3s-agent.service — the same name used
    # by the systemd tasks below. Setting INSTALL_K3S_NAME=k3s-agent would
    # produce 'k3s-k3s-agent.service' (installer prepends 'k3s-') and break
    # the subsequent enable/start tasks.
    INSTALL_K3S_BIN_DIR: "/usr/local/bin"
    INSTALL_K3S_SYSTEMD_DIR: "/etc/systemd/system"
    K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN: "{{ k3s_node_token }}"
    INSTALL_K3S_SKIP_START: "false"
  register: k3s_agent_install
  no_log: true
  timeout: 600

# ── Service management ───────────────────────────────────────────────────────

- name: Force systemd reload to detect k3s-agent unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

- name: Ensure k3s agent service is enabled and started
  # Usamos explicitamente o módulo systemd em vez de service para evitar erros de provedor
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
  register: agent_service_start
  until: agent_service_start is succeeded
  retries: 15
  delay: 5
  when: not ansible_check_mode

- name: Wait for k3s-agent service to reach active state
  ansible.builtin.command: systemctl is-active k3s-agent # noqa: command-instead-of-module
  register: k3s_agent_wait
  until: k3s_agent_wait.stdout == 'active'
  retries: 24
  delay: 10
  changed_when: false
  failed_when: k3s_agent_wait.stdout != 'active'
  when: not ansible_check_mode

# ── Summary ──────────────────────────────────────────────────────────────────

- name: Display agent installation status
  ansible.builtin.debug:
    msg:
      - "k3s agent installed successfully"
      - "Connected to server: {{ k3s_server_url }}"
      - "Node should appear in cluster within 30 seconds"
  tags:
    - validate
