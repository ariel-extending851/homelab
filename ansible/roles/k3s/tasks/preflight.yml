---
# ansible/roles/k3s/tasks/preflight.yml
# Pre-flight checks before k3s installation

- name: Install Python for Ansible (Amazon Linux 2023)
  ansible.builtin.raw: |
    dnf install -y python3 python3-pip
  args:
    executable: /bin/bash
  # default('') produces a silent skip on systems where ansible_os_family is undefined.
  # This is intentional: the raw module runs before facts are gathered, so ansible_os_family
  # may not be set on the first connection. On non-RedHat systems the skip is correct behaviour.
  when: ansible_os_family | default('') == "RedHat"
  changed_when: false
  become: true

- name: Check if running on supported architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ["aarch64", "x86_64"]
    fail_msg: "This role supports ARM64 (aarch64) and x86_64 (AMD64) architectures only. Found: {{ ansible_architecture }}"
    success_msg: "Architecture check passed: {{ ansible_architecture }}"

- name: Verify minimum system requirements
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= 512
    fail_msg: "Minimum 512MB RAM required for k3s"
    success_msg: "Memory check passed: {{ ansible_memtotal_mb }}MB"

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Get installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Display current k3s installation status
  ansible.builtin.debug:
    msg: >-
      k3s is {{ 'already installed: ' + k3s_installed_version.stdout.split()[2]
      if k3s_binary.stat.exists else 'not installed' }}

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ k3s_config_dir }}"
    - "{{ k3s_data_dir }}"

- name: Check if Tailscale is active (when k3s_use_tailscale is enabled)
  ansible.builtin.systemd:
    name: tailscaled
  register: tailscale_status
  failed_when: false
  when: k3s_use_tailscale | bool

- name: Warn if Tailscale is not running
  ansible.builtin.debug:
    msg: "WARNING: Tailscale is not active but k3s_use_tailscale is enabled"
  when:
    - k3s_use_tailscale | bool
    - tailscale_status.status.ActiveState | default('inactive') != 'active'
