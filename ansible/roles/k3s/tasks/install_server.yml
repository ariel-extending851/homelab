---
# ansible/roles/k3s/tasks/install_server.yml
# Install and configure k3s server (control plane)

# Detect if the node was previously installed as an agent (wrong role).
# The k3s install script creates a role-specific systemd unit; if we find
# k3s-agent.service but not k3s.service, we must uninstall and reinstall.
- name: Check if node was previously installed as k3s agent
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: k3s_agent_unit

- name: Check if k3s server unit already exists
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_unit

- name: Uninstall k3s agent role (node is being promoted to server)
  ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
  when:
    - k3s_agent_unit.stat.exists
    - not k3s_server_unit.stat.exists
  changed_when: true

# Ensure config dir exists after potential uninstall (uninstall wipes /etc/rancher/).
- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"

- name: Create k3s server config file
  ansible.builtin.template:
    src: server-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0644"
  notify: Restart k3s

# Authenticated Docker Hub pulls — zero-cost rate-limit fix (see template).
# Gated off by default; enable with k3s_dockerhub_auth_enabled + the SOPS
# dockerhub_username/dockerhub_token vars in group_vars/all.sops.yml.
- name: Configure authenticated Docker Hub registry (k3s registries.yaml)
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: "{{ k3s_config_dir }}/registries.yaml"
    mode: "0600" # contains a Docker Hub token
  no_log: true
  when: k3s_dockerhub_auth_enabled | default(false) | bool
  notify: Restart k3s

- name: Download and install k3s server # noqa: command-instead-of-module
  ansible.builtin.shell: |
    curl -sfL {{ k3s_install_url | quote }} | \
    INSTALL_K3S_VERSION="{{ k3s_version | quote }}" \
    INSTALL_K3S_CHANNEL="{{ k3s_channel | quote }}" \
    sh -s - server \
    --config {{ k3s_config_dir | quote }}/config.yaml
  args:
    # Skip install only when the server unit already exists (correct role installed).
    # After uninstalling the agent above, the binary is gone, so reinstall always runs.
    creates: /etc/systemd/system/k3s.service
  environment:
    INSTALL_K3S_SKIP_START: "false"
  register: k3s_server_install
  timeout: 600

# The install script starts k3s automatically (INSTALL_K3S_SKIP_START=false).
# This task is a belt-and-suspenders idempotent ensure for subsequent runs.
- name: Ensure k3s server service is enabled and started
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Wait for k3s server to be ready
  ansible.builtin.wait_for:
    path: "{{ k3s_kubeconfig_path }}"
    state: present
    timeout: 120
  when: not ansible_check_mode

- name: Wait for k3s API server to respond
  ansible.builtin.command: >
    kubectl --kubeconfig={{ k3s_kubeconfig_path }} get nodes
  register: kubectl_result
  until: kubectl_result.rc == 0
  retries: 12
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: Retrieve k3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_encoded
  when: not ansible_check_mode
  no_log: true

- name: Set k3s node token fact
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_node_token_encoded.content | b64decode | trim }}"
  when: not ansible_check_mode
  no_log: true
  tags:
    - validate

- name: Set dummy k3s node token for check mode
  ansible.builtin.set_fact:
    k3s_node_token: "K10xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx::server:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  when: ansible_check_mode
  tags:
    - validate

- name: Save token to config directory
  ansible.builtin.copy:
    content: "{{ k3s_node_token }}"
    dest: "{{ k3s_token_file }}"
    mode: "0600"
  when: not ansible_check_mode
  no_log: true

- name: Set server URL fact
  ansible.builtin.set_fact:
    # Use node_ip from inventory (LAN IP for Pi-to-Pi traffic; Tailscale IPs are
    # not peered between Pis). Falls back to private_ip (AWS) or the first LAN IP.
    k3s_server_url: "https://{{ node_ip | default(private_ip) | default(ansible_default_ipv4.address) }}:6443"
  tags:
    - validate

- name: Save server URL to file
  ansible.builtin.copy:
    content: "{{ k3s_server_url }}"
    dest: "{{ k3s_server_url_file }}"
    mode: "0644"

- name: Display server information
  ansible.builtin.debug:
    msg:
      - "k3s server installed successfully"
      - "Server URL: {{ k3s_server_url }}"
      - "Node token stored at: {{ k3s_token_file }}"
  tags:
    - validate
