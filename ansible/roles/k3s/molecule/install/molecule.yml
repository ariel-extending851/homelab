---
# Molecule scenario: install
# Tests install_server.yml execution in a Docker container with filesystem stubs.
#
# Strategy: run without check_mode so the template task actually writes
# /etc/rancher/k3s/config.yaml. The k3s install script (curl | sh) is skipped
# via its `creates: /etc/systemd/system/k3s.service` guard — that service file
# is pre-created in prepare.yml. A systemctl stub satisfies ansible.builtin.systemd
# without requiring a real systemd process.
#
# Key assertions in verify.yml:
#   • /etc/rancher/k3s/config.yaml rendered by template (cluster-cidr, node-name)
#   • /etc/rancher/k3s/k3s-token written (token persistence)
#   • /etc/rancher/k3s/k3s-server-url written (server URL fact)

driver:
  name: docker

platforms:
  - name: k3s-install-test
    image: debian:bookworm-slim
    pre_build_image: true
    hostname: k3s-install-test
    command: /bin/bash -c "sleep infinity"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  config_options:
    defaults:
      gathering: smart
      fact_caching: memory
  inventory:
    hosts:
      all:
        hosts:
          k3s-install-test:
      k3s_server:
        hosts:
          k3s-install-test:
    group_vars:
      all:
        # Docker containers run as root — sudo-based escalation is unnecessary.
        ansible_become: false
        # ── k3s role variables (mirrors molecule/default/molecule.yml) ─────────
        k3s_version: "v1.34.3+k3s1"
        k3s_channel: stable
        k3s_install_url: "https://get.k3s.io"
        k3s_config_dir: /etc/rancher/k3s
        k3s_data_dir: /var/lib/rancher/k3s
        k3s_token_file: /etc/rancher/k3s/k3s-token
        k3s_server_url_file: /etc/rancher/k3s/k3s-server-url
        k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
        k3s_pi_optimizations: false
        k3s_pi_max_pods: 50
        k3s_use_tailscale: false
        k3s_advertise_on_tailscale: false
        k3s_protect_kernel_defaults: false
        k3s_secrets_encryption: false
        k3s_enable_etcd_snapshots: false
        k3s_etcd_snapshot_schedule: "0 */12 * * *"
        k3s_etcd_snapshot_retention: 5
        k3s_cluster_name: hl-homelab
        k3s_server_url: "https://127.0.0.1:6443"
        k3s_node_token: "molecule-test-token"
        k3s_server_config:
          write_kubeconfig_mode: "0644"
          cluster_cidr: "10.42.0.0/16"
          service_cidr: "10.43.0.0/16"
          tls_san: ["127.0.0.1", "k3s-install-test"]
          disable: ["traefik"]
          flannel_backend: "vxlan"
          disable_cloud_controller: true
          disable_network_policy: false
        k3s_agent_config:
          node_label: []
          node_taint: []
    host_vars:
      k3s-install-test:
        k3s_control_node: true
        node_ip: "127.0.0.1"
        node_name: k3s-install-test

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence  # template + file tasks are idempotent; install is skipped via creates: guard
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
