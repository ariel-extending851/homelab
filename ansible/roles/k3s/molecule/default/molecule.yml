---
# Molecule test suite for the k3s role.
# Driver: Docker — runs fully offline, no real Raspberry Pi or AWS required.
#
# Strategy: run the role with check_mode: true so all curl/systemd/shell tasks
# are safely skipped by their "creates:" / "when: not ansible_check_mode" guards.
#
# Two containers simulate the hybrid topology:
#   k3s-server-node  → control plane  (k3s_control_node: true)
#   k3s-agent-node   → worker         (k3s_control_node: false)
#
# This validates:
#   • All defaults and variables render without undefined-var errors
#   • Template rendering (server-config.yaml.j2, agent-config.yaml.j2)
#   • preflight.yml assertions pass on a supported-arch / adequate-memory host
#   • No ArgoCD tasks accidentally leak into the k3s role
#   • Idempotent re-run produces no changes (check mode is deterministic)

driver:
  name: docker

platforms:
  - name: k3s-agent-node
    # Pinned by digest to avoid drift in CI; bump when geerlingguy refreshes upstream.
    # `pre_build_image: true` skips Molecule's wrapper Dockerfile build — the
    # geerlingguy image is already Ansible-ready, and the wrapper step
    # mangles `image@sha256:` digests into `image:sha256:` (invalid Docker ref).
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:3a9474d843917fbeb737a78626c1b8bc31daf6424fe51575e6ce4affffecfa24
    pre_build_image: true
    privileged: true
    user: root
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

  - name: k3s-server-node
    image: geerlingguy/docker-amazonlinux2023-ansible@sha256:f80ab9ffd982dd07c7804868ceb9d3cc5be60285ae8bd5229a0b0708cdecd60f
    pre_build_image: true
    privileged: true
    user: root
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  options:
    check: true
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  config_options:
    defaults:
      gathering: smart
      fact_caching: memory
  inventory:
    hosts:
      all:
        hosts:
          k3s-server-node:
          k3s-agent-node:
    group_vars:
      all:
        # Docker containers connect as root (user: root in platforms) —
        # sudo-based escalation is unnecessary and fails in DinD (PAM error).
        ansible_become: false
        # ── Global k3s vars (mirrors production.yml all.vars) ────────────
        k3s_version: "v1.34.3+k3s1"
        k3s_channel: stable
        k3s_install_url: "https://get.k3s.io"
        k3s_config_dir: /etc/rancher/k3s
        k3s_data_dir: /var/lib/rancher/k3s
        k3s_token_file: /etc/rancher/k3s/k3s-token
        k3s_server_url_file: /etc/rancher/k3s/k3s-server-url
        k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
        k3s_pi_optimizations: false # not a Pi inside Docker
        k3s_pi_max_pods: 50
        k3s_use_tailscale: false # no Tailscale daemon in container
        k3s_advertise_on_tailscale: false
        k3s_protect_kernel_defaults: false
        k3s_secrets_encryption: false
        k3s_enable_etcd_snapshots: false
        k3s_etcd_snapshot_schedule: "0 */12 * * *"
        k3s_etcd_snapshot_retention: 5
        k3s_cluster_name: hl-homelab
        # Provide a dummy URL and token so agent assertions don't fail
        k3s_server_url: "https://127.0.0.1:6443"
        k3s_node_token: "molecule-test-token"
        k3s_server_config:
          write_kubeconfig_mode: "0644"
          cluster_cidr: "10.42.0.0/16"
          service_cidr: "10.43.0.0/16"
          tls_san: ["127.0.0.1", "k3s-server-node"]
          disable: ["traefik"]
          flannel_backend: "vxlan"
          disable_cloud_controller: true
          disable_network_policy: false
        k3s_agent_config:
          node_label: []
          node_taint: []
    host_vars:
      k3s-server-node:
        k3s_control_node: true
        node_ip: "127.0.0.1"
        node_name: k3s-server-node
      k3s-agent-node:
        k3s_control_node: false
        node_ip: "127.0.0.2"
        node_name: k3s-agent-node

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence  <-- REMOVIDO: Incompatível com check: true
    - verify
    - cleanup
    - destroy
