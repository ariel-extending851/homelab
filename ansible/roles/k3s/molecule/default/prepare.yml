---
# Prepare: bootstrap python3 + sudo in the slim image before Ansible facts
# gather.  debian:bookworm-slim ships neither — both are required for
# become: true and gather_facts: true to work.

- name: Prepare — bootstrap python3 and sudo
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Bootstrap python3 and sudo (multi-distro raw bootstrap)
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1; then
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y python3 sudo
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 sudo
        elif command -v yum >/dev/null 2>&1; then
          yum install -y python3 sudo
        fi
      changed_when: false
