---
# ansible/roles/k3s/defaults/main.yml
# Default variables for k3s role
# Override these in playbook vars or group_vars as needed

# k3s version to install (stable by default)
k3s_version: "v1.28.5+k3s1"
k3s_channel: "stable"

# k3s installation method
k3s_install_url: "https://get.k3s.io"

# k3s server (control plane) configuration
k3s_server_config:
  write-kubeconfig-mode: "0644"
  tls-san: []  # Additional TLS SANs for API server certificate
  cluster-cidr: "10.42.0.0/16"
  service-cidr: "10.43.0.0/16"
  disable:
    - traefik  # Disable default Traefik (we'll manage ingress separately)
  flannel-backend: "vxlan"  # Use VXLAN for Tailscale compatibility
  disable-cloud-controller: true
  disable-network-policy: false

# k3s agent (worker) configuration
k3s_agent_config:
  node-label: []  # Additional node labels
  node-taint: []  # Node taints for scheduling

# Server node designation (set via inventory)
k3s_control_node: false

# Directories
k3s_config_dir: "/etc/rancher/k3s"
k3s_data_dir: "/var/lib/rancher/k3s"
k3s_token_file: "{{ k3s_config_dir }}/k3s-token"
k3s_server_url_file: "{{ k3s_config_dir }}/k3s-server-url"

# Service management
k3s_service_name: "k3s"
k3s_agent_service_name: "k3s-agent"

# Kubeconfig settings
k3s_kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
local_kubeconfig_path: "~/.kube/config"

# Resource constraints for Raspberry Pi nodes
k3s_pi_optimizations: true
k3s_pi_max_pods: 50  # Limit max pods on Pi nodes

# Tailscale integration
k3s_use_tailscale: true
k3s_advertise_on_tailscale: true

# Security settings
k3s_protect_kernel_defaults: false  # Set to true for production hardening
k3s_secrets_encryption: false  # Enable secrets encryption at rest

# Backup settings
k3s_enable_etcd_snapshots: true
k3s_etcd_snapshot_schedule: "0 */12 * * *"  # Every 12 hours
k3s_etcd_snapshot_retention: 5

# Architecture detection (supports ARM64 for OCI/Raspberry Pi, x86_64 for AWS)
k3s_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Prefix convention (from docs/conventions.md)
k3s_cluster_name: "hl-homelab"
