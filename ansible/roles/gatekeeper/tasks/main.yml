---
- name: Validate router Wi-Fi secret is set and not using placeholder values
  ansible.builtin.assert:
    that:
      - wifi_password is defined
      - wifi_password | length >= 8
      - wifi_password not in ['vaulted', 'REPLACE_WITH_REAL_WIFI_PASSWORD']
      - wifi_guest_password is defined
      - wifi_guest_password | length >= 8
      - wifi_guest_password not in ['vaulted_guest', 'REPLACE_WITH_REAL_GUEST_WIFI_PASSWORD']
    fail_msg: >-
      wifi_password or wifi_guest_password is missing or still using a placeholder.
      Edit ansible/group_vars/router.sops.yml with sops and set both fields.
    quiet: true
  no_log: true

- name: Regenerate SSH host keys to ed25519 if not already present
  ansible.builtin.raw: |
    if [ ! -f /etc/dropbear/dropbear_ed25519_host_key ]; then
      dropbearkey -t ed25519 -f /etc/dropbear/dropbear_ed25519_host_key
      /etc/init.d/dropbear restart
    fi
  changed_when: false

- name: Enable software and hardware flow offloading
  ansible.builtin.raw: |
    set -eu
    changed=0

    current_sw="$(uci -q get firewall.@defaults[0].flow_offloading || true)"
    if [ "$current_sw" != "1" ]; then
      uci set firewall.@defaults[0].flow_offloading='1'
      changed=1
    fi

    current_hw="$(uci -q get firewall.@defaults[0].flow_offloading_hw || true)"
    if [ "$current_hw" != "1" ]; then
      uci set firewall.@defaults[0].flow_offloading_hw='1'
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_perf
  changed_when: "'CHANGED' in gatekeeper_perf.stdout"

- name: Unify SSID and key across 2.4GHz and 5GHz radios
  ansible.builtin.raw: |
    set -eu
    changed=0

    current_radio0_disabled="$(uci -q get wireless.radio0.disabled || true)"
    if [ "$current_radio0_disabled" != "0" ]; then
      uci set wireless.radio0.disabled='0'
      changed=1
    fi

    current_radio1_disabled="$(uci -q get wireless.radio1.disabled || true)"
    if [ "$current_radio1_disabled" != "0" ]; then
      uci set wireless.radio1.disabled='0'
      changed=1
    fi

    current_ssid_24="$(uci -q get wireless.default_radio0.ssid || true)"
    if [ "$current_ssid_24" != "{{ wifi_ssid }}" ]; then
      uci set wireless.default_radio0.ssid='{{ wifi_ssid }}'
      changed=1
    fi

    current_key_24="$(uci -q get wireless.default_radio0.key || true)"
    if [ "$current_key_24" != '{{ wifi_password }}' ]; then
      uci set wireless.default_radio0.key='{{ wifi_password }}'
      changed=1
    fi

    current_iface0_disabled="$(uci -q get wireless.default_radio0.disabled || true)"
    if [ "$current_iface0_disabled" != "0" ]; then
      uci set wireless.default_radio0.disabled='0'
      changed=1
    fi

    current_enc_24="$(uci -q get wireless.default_radio0.encryption || true)"
    if [ "$current_enc_24" != "sae-mixed" ]; then
      uci set wireless.default_radio0.encryption='sae-mixed'
      changed=1
    fi

    current_ssid_5="$(uci -q get wireless.default_radio1.ssid || true)"
    if [ "$current_ssid_5" != "{{ wifi_ssid }}" ]; then
      uci set wireless.default_radio1.ssid='{{ wifi_ssid }}'
      changed=1
    fi

    current_key_5="$(uci -q get wireless.default_radio1.key || true)"
    if [ "$current_key_5" != '{{ wifi_password }}' ]; then
      uci set wireless.default_radio1.key='{{ wifi_password }}'
      changed=1
    fi

    current_iface1_disabled="$(uci -q get wireless.default_radio1.disabled || true)"
    if [ "$current_iface1_disabled" != "0" ]; then
      uci set wireless.default_radio1.disabled='0'
      changed=1
    fi

    current_enc_5="$(uci -q get wireless.default_radio1.encryption || true)"
    if [ "$current_enc_5" != "sae-mixed" ]; then
      uci set wireless.default_radio1.encryption='sae-mixed'
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      uci commit wireless
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_wifi
  changed_when: "'CHANGED' in gatekeeper_wifi.stdout"
  no_log: true

- name: Configure Guest WiFi using GL.iNet native interfaces (guest2g/guest5g)
  ansible.builtin.raw: |
    set -eu
    changed=0

    # Guest network interface (192.168.9.1/24)
    proto="$(uci -q get network.guest.proto || true)"
    [ "$proto" = "static" ] || { uci set network.guest=interface; uci set network.guest.proto='static'; changed=1; }
    type="$(uci -q get network.guest.type || true)"
    [ "$type" = "bridge" ] || { uci set network.guest.type='bridge'; changed=1; }
    disabled="$(uci -q get network.guest.disabled || true)"
    [ "$disabled" = "0" ] || { uci set network.guest.disabled='0'; changed=1; }
    ip="$(uci -q get network.guest.ipaddr || true)"
    [ "$ip" = "192.168.9.1" ] || { uci set network.guest.ipaddr='192.168.9.1'; changed=1; }
    mask="$(uci -q get network.guest.netmask || true)"
    [ "$mask" = "255.255.255.0" ] || { uci set network.guest.netmask='255.255.255.0'; changed=1; }

    # Guest DHCP pool
    dhcp_iface="$(uci -q get dhcp.guest.interface || true)"
    [ "$dhcp_iface" = "guest" ] || { uci set dhcp.guest=dhcp; uci set dhcp.guest.interface='guest'; \
      uci set dhcp.guest.start='100'; uci set dhcp.guest.limit='150'; \
      uci set dhcp.guest.leasetime='12h'; changed=1; }

    # Guest 2.4GHz (interface nativa guest2g)
    [ "$(uci -q get wireless.guest2g.disabled || true)" = "0" ] || \
      { uci set wireless.guest2g.disabled='0'; changed=1; }
    [ "$(uci -q get wireless.guest2g.ssid || true)" = "{{ wifi_guest_ssid_24 }}" ] || \
      { uci set wireless.guest2g.ssid='{{ wifi_guest_ssid_24 }}'; changed=1; }
    [ "$(uci -q get wireless.guest2g.encryption || true)" = "sae-mixed" ] || \
      { uci set wireless.guest2g.encryption='sae-mixed'; changed=1; }
    [ "$(uci -q get wireless.guest2g.network || true)" = "guest" ] || \
      { uci set wireless.guest2g.network='guest'; changed=1; }
    [ "$(uci -q get wireless.guest2g.isolate || true)" = "1" ] || \
      { uci set wireless.guest2g.isolate='1'; changed=1; }
    [ "$(uci -q get wireless.guest2g.key || true)" = '{{ wifi_guest_password }}' ] || \
      { uci set wireless.guest2g.key='{{ wifi_guest_password }}'; changed=1; }

    # Guest 5GHz (interface nativa guest5g)
    [ "$(uci -q get wireless.guest5g.disabled || true)" = "0" ] || \
      { uci set wireless.guest5g.disabled='0'; changed=1; }
    [ "$(uci -q get wireless.guest5g.ssid || true)" = "{{ wifi_guest_ssid_5 }}" ] || \
      { uci set wireless.guest5g.ssid='{{ wifi_guest_ssid_5 }}'; changed=1; }
    [ "$(uci -q get wireless.guest5g.encryption || true)" = "sae-mixed" ] || \
      { uci set wireless.guest5g.encryption='sae-mixed'; changed=1; }
    [ "$(uci -q get wireless.guest5g.network || true)" = "guest" ] || \
      { uci set wireless.guest5g.network='guest'; changed=1; }
    [ "$(uci -q get wireless.guest5g.isolate || true)" = "1" ] || \
      { uci set wireless.guest5g.isolate='1'; changed=1; }
    [ "$(uci -q get wireless.guest5g.key || true)" = '{{ wifi_guest_password }}' ] || \
      { uci set wireless.guest5g.key='{{ wifi_guest_password }}'; changed=1; }

    # Remover interfaces duplicadas criadas anteriormente
    if uci -q get wireless.guest_radio0 >/dev/null 2>&1; then
      uci delete wireless.guest_radio0; changed=1
    fi
    if uci -q get wireless.guest_radio1 >/dev/null 2>&1; then
      uci delete wireless.guest_radio1; changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      uci commit network
      uci commit dhcp
      uci commit wireless
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_guest_wifi
  changed_when: "'CHANGED' in gatekeeper_guest_wifi.stdout"
  no_log: true

- name: Add reverse route for Tailscale subnet via Pi gateway
  ansible.builtin.raw: |
    set -eu
    changed=0

    if ! uci -q get network.tailscale_reverse_route >/dev/null 2>&1; then
      uci set network.tailscale_reverse_route='route'
      changed=1
    fi

    current_target="$(uci -q get network.tailscale_reverse_route.target || true)"
    if [ "$current_target" != "100.64.0.0" ]; then
      uci set network.tailscale_reverse_route.target='100.64.0.0'
      changed=1
    fi

    current_mask="$(uci -q get network.tailscale_reverse_route.netmask || true)"
    if [ "$current_mask" != "255.192.0.0" ]; then
      uci set network.tailscale_reverse_route.netmask='255.192.0.0'
      changed=1
    fi

    current_gateway="$(uci -q get network.tailscale_reverse_route.gateway || true)"
    if [ "$current_gateway" != "{{ pi_tailscale_ip }}" ]; then
      uci set network.tailscale_reverse_route.gateway='{{ pi_tailscale_ip }}'
      changed=1
    fi

    current_interface="$(uci -q get network.tailscale_reverse_route.interface || true)"
    if [ "$current_interface" != "lan" ]; then
      uci set network.tailscale_reverse_route.interface='lan'
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_route
  changed_when: "'CHANGED' in gatekeeper_route.stdout"

- name: Check Pi (AdGuard Home) reachability — ICMP + DNS service health
  # ICMP-only is insufficient: host can respond to ping while AdGuard pod is
  # CrashLoopBackOff/restarting, leaving DNAT pointing at a dead :53 listener.
  ansible.builtin.raw: |
    ping -c1 -W2 {{ pi_adguard_ip }} >/dev/null 2>&1 || { echo UNREACHABLE; exit 0; }
    timeout 3 nslookup google.com {{ pi_adguard_ip }} 2>/dev/null | grep -q "Address" \
      && echo REACHABLE || echo UNREACHABLE
  register: gatekeeper_pi_check
  changed_when: false

- name: Force all LAN DNS traffic to AdGuard (only when Pi is reachable)
  ansible.builtin.raw: |
    set -eu
    changed=0
    pi_reachable="{{ 'yes' if gatekeeper_pi_check.stdout | trim == 'REACHABLE' else 'no' }}"

    if [ "$pi_reachable" = "no" ]; then
      if uci -q get firewall.dns_hijack_adguard >/dev/null 2>&1; then
        uci delete firewall.dns_hijack_adguard
        uci commit firewall
        changed=1
      fi
    else
      if ! uci -q get firewall.dns_hijack_adguard >/dev/null 2>&1; then
        uci set firewall.dns_hijack_adguard='redirect'
        changed=1
      fi

      current_name="$(uci -q get firewall.dns_hijack_adguard.name || true)"
      [ "$current_name" = "Force-DNS-to-AdGuard" ] || { uci set firewall.dns_hijack_adguard.name='Force-DNS-to-AdGuard'; changed=1; }

      current_src="$(uci -q get firewall.dns_hijack_adguard.src || true)"
      [ "$current_src" = "lan" ] || { uci set firewall.dns_hijack_adguard.src='lan'; changed=1; }

      current_proto="$(uci -q get firewall.dns_hijack_adguard.proto || true)"
      [ "$current_proto" = "tcp udp" ] || { uci set firewall.dns_hijack_adguard.proto='tcp udp'; changed=1; }

      current_src_port="$(uci -q get firewall.dns_hijack_adguard.src_dport || true)"
      [ "$current_src_port" = "53" ] || { uci set firewall.dns_hijack_adguard.src_dport='53'; changed=1; }

      if uci -q get firewall.dns_hijack_adguard.dest >/dev/null 2>&1; then
        uci delete firewall.dns_hijack_adguard.dest
        changed=1
      fi

      current_dest_ip="$(uci -q get firewall.dns_hijack_adguard.dest_ip || true)"
      [ "$current_dest_ip" = "{{ pi_adguard_ip }}" ] || { uci set firewall.dns_hijack_adguard.dest_ip='{{ pi_adguard_ip }}'; changed=1; }

      current_dest_port="$(uci -q get firewall.dns_hijack_adguard.dest_port || true)"
      [ "$current_dest_port" = "53" ] || { uci set firewall.dns_hijack_adguard.dest_port='53'; changed=1; }

      [ "$changed" -eq 1 ] && uci commit firewall
    fi

    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  register: gatekeeper_dns
  changed_when: "'CHANGED' in gatekeeper_dns.stdout"

- name: Configure dnsmasq DNS protection and upstream
  ansible.builtin.raw: |
    set -eu
    changed=0
    pi_reachable="{{ 'yes' if gatekeeper_pi_check.stdout | trim == 'REACHABLE' else 'no' }}"

    cur="$(uci -q get dhcp.@dnsmasq[0].rebind_protection || true)"
    [ "$cur" = "1" ] || { uci set dhcp.@dnsmasq[0].rebind_protection='1'; changed=1; }

    if [ "$pi_reachable" = "yes" ]; then
      desired="{{ pi_adguard_ip }}"
    else
      desired="{{ wan_dns_servers | join(' ') }}"
    fi
    cur="$(uci -q get dhcp.@dnsmasq[0].server || true)"
    if [ "$cur" != "$desired" ]; then
      uci -q delete dhcp.@dnsmasq[0].server || true
      if [ "$pi_reachable" = "yes" ]; then
        uci add_list dhcp.@dnsmasq[0].server="{{ pi_adguard_ip }}"
      else
        {% for srv in wan_dns_servers %}
        uci add_list dhcp.@dnsmasq[0].server='{{ srv }}'
        {% endfor %}
      fi
      changed=1
    fi

    [ "$changed" -eq 1 ] && uci commit dhcp
    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  register: gatekeeper_dnsmasq
  changed_when: "'CHANGED' in gatekeeper_dnsmasq.stdout"

- name: Install AdGuard failover monitor script
  ansible.builtin.raw: |
    tmp=$(mktemp)
    cat > "$tmp" << 'FAILOVER'
    #!/bin/sh
    # Self-healing AdGuard failover with hysteresis + force-reconcile.
    # Runs every minute via cron and once at boot via /etc/rc.local.
    # ICMP + DNS health (not just ping — pod can crashloop while host pings).
    # On state transition, toggles BOTH dnsmasq upstream AND the LAN DNAT.
    # Hysteresis: flip only after HYSTERESIS consecutive divergent observations
    # (avoids flap on transient packet loss). Force-reconcile: if config drifted
    # from committed state (e.g., manual UCI edit, half-applied role run), apply.
    PI_IP="{{ pi_adguard_ip }}"
    STATE_FILE="/var/run/adguard-failover.state"
    COUNTER_FILE="/var/run/adguard-failover.counter"
    PUBLIC_DNS="{{ wan_dns_servers | join(' ') }}"
    HYSTERESIS=2

    if ping -c2 -W2 "$PI_IP" >/dev/null 2>&1 && \
       timeout 3 nslookup google.com "$PI_IP" 2>/dev/null | grep -q "Address"; then
      obs="up"
    else
      obs="down"
    fi

    prev="$(cat "$STATE_FILE" 2>/dev/null || echo unknown)"

    if [ "$obs" = "$prev" ]; then
      count=0
    else
      count="$(cat "$COUNTER_FILE" 2>/dev/null || echo 0)"
      count=$((count + 1))
    fi
    echo "$count" > "$COUNTER_FILE"

    if [ "$prev" = "unknown" ] || [ "$count" -ge "$HYSTERESIS" ]; then
      state="$obs"
    else
      state="$prev"
    fi

    dnat_should_exist=0
    [ "$state" = "up" ] && dnat_should_exist=1
    dnat_exists=0
    uci -q get firewall.dns_hijack_adguard >/dev/null 2>&1 && dnat_exists=1

    if [ "$state" = "$prev" ] && [ "$dnat_should_exist" = "$dnat_exists" ]; then
      exit 0
    fi

    uci -q delete dhcp.@dnsmasq[0].server 2>/dev/null || true
    if [ "$state" = "up" ]; then
      uci add_list dhcp.@dnsmasq[0].server="$PI_IP"
    else
      for srv in $PUBLIC_DNS; do
        uci add_list dhcp.@dnsmasq[0].server="$srv"
      done
    fi
    uci commit dhcp
    /etc/init.d/dnsmasq reload

    if [ "$state" = "up" ]; then
      if [ "$dnat_exists" = "0" ]; then
        uci set firewall.dns_hijack_adguard='redirect'
        uci set firewall.dns_hijack_adguard.name='Force-DNS-to-AdGuard'
        uci set firewall.dns_hijack_adguard.src='lan'
        uci set firewall.dns_hijack_adguard.proto='tcp udp'
        uci set firewall.dns_hijack_adguard.src_dport='53'
        uci set firewall.dns_hijack_adguard.dest_ip="$PI_IP"
        uci set firewall.dns_hijack_adguard.dest_port='53'
        uci commit firewall
        /etc/init.d/firewall reload
      fi
      logger -t adguard-failover "Pi RECOVERED - dnsmasq+DNAT restored to AdGuard ($PI_IP)"
    else
      if [ "$dnat_exists" = "1" ]; then
        uci delete firewall.dns_hijack_adguard
        uci commit firewall
        /etc/init.d/firewall reload
      fi
      logger -t adguard-failover "Pi UNREACHABLE - dnsmasq fallback to public DNS, DNAT removed (LAN clients use router dnsmasq)"
    fi

    echo "$state" > "$STATE_FILE"
    echo 0 > "$COUNTER_FILE"
    FAILOVER
    if cmp -s "$tmp" /usr/bin/adguard-failover; then
      rm -f "$tmp"
      echo OK
    else
      mv "$tmp" /usr/bin/adguard-failover
      chmod +x /usr/bin/adguard-failover
      echo CHANGED
    fi
  register: gatekeeper_failover_script
  changed_when: "'CHANGED' in gatekeeper_failover_script.stdout"

- name: Schedule AdGuard failover monitor in cron
  ansible.builtin.raw: |
    set -eu
    line="* * * * * /usr/bin/adguard-failover"
    mkdir -p /etc/crontabs
    touch /etc/crontabs/root
    if grep -Fq "/usr/bin/adguard-failover" /etc/crontabs/root; then
      echo OK
    else
      echo "$line" >> /etc/crontabs/root
      echo CHANGED
    fi
  register: gatekeeper_failover_cron
  changed_when: "'CHANGED' in gatekeeper_failover_cron.stdout"

- name: Enable and start cron service
  ansible.builtin.raw: |
    set -eu
    changed=0
    if ! ls /etc/rc.d/S*cron >/dev/null 2>&1; then
      /etc/init.d/cron enable >/dev/null 2>&1 || true
      ls /etc/rc.d/S*cron >/dev/null 2>&1 && changed=1
    fi
    # Best-effort start/reload (does not affect idempotence; runtime-only state)
    pgrep -x crond >/dev/null 2>&1 || /etc/init.d/cron start >/dev/null 2>&1 || true
    if [ "{{ 'yes' if (gatekeeper_failover_cron is defined and gatekeeper_failover_cron is changed) else 'no' }}" = "yes" ]; then
      /etc/init.d/cron reload >/dev/null 2>&1 || /etc/init.d/cron restart >/dev/null 2>&1 || true
    fi
    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  register: gatekeeper_cron_service
  changed_when: "'CHANGED' in gatekeeper_cron_service.stdout"

- name: Run AdGuard failover at boot via /etc/rc.local
  # Cron's first tick is up to 60s after boot. If AdGuard is down at boot, LAN
  # clients have no DNS during that window. Running the script via rc.local
  # (backgrounded with sleep) reconciles within 30s of boot.
  ansible.builtin.raw: |
    set -eu
    line='( sleep 30 && /usr/bin/adguard-failover ) >/dev/null 2>&1 &'
    [ -f /etc/rc.local ] || printf '%s\n' '#!/bin/sh' 'exit 0' > /etc/rc.local
    if grep -Fq '/usr/bin/adguard-failover' /etc/rc.local; then
      echo OK
    else
      if grep -q '^exit 0$' /etc/rc.local; then
        sed -i "/^exit 0\$/i $line" /etc/rc.local
      else
        printf '%s\n' "$line" >> /etc/rc.local
      fi
      chmod +x /etc/rc.local
      echo CHANGED
    fi
  register: gatekeeper_failover_boot
  changed_when: "'CHANGED' in gatekeeper_failover_boot.stdout"

- name: Configure WAN interface with static IP for DMZ (Technicolor upstream)
  ansible.builtin.raw: |
    set -eu
    changed=0

    current_proto="$(uci -q get network.wan.proto || true)"
    if [ "$current_proto" != "static" ]; then
      uci set network.wan.proto='static'
      changed=1
    fi

    current_ip="$(uci -q get network.wan.ipaddr || true)"
    if [ "$current_ip" != "{{ wan_static_ip }}" ]; then
      uci set network.wan.ipaddr='{{ wan_static_ip }}'
      changed=1
    fi

    current_mask="$(uci -q get network.wan.netmask || true)"
    if [ "$current_mask" != "255.255.255.0" ]; then
      uci set network.wan.netmask='255.255.255.0'
      changed=1
    fi

    current_gw="$(uci -q get network.wan.gateway || true)"
    if [ "$current_gw" != "{{ wan_gateway }}" ]; then
      uci set network.wan.gateway='{{ wan_gateway }}'
      changed=1
    fi

    desired_dns="{{ wan_dns_servers | join(' ') }}"
    current_dns="$(uci -q get network.wan.dns || true)"
    if [ "$current_dns" != "$desired_dns" ]; then
      uci -q delete network.wan.dns 2>/dev/null || true
      {% for srv in wan_dns_servers %}
      uci add_list network.wan.dns='{{ srv }}'
      {% endfor %}
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_wan_dhcp
  changed_when: "'CHANGED' in gatekeeper_wan_dhcp.stdout"

- name: Harden WAN zone input and forward policy
  ansible.builtin.raw: |
    set -eu
    changed=0

    for zone in $(uci show firewall | sed -n "s/^firewall\.\([^=]*\)=zone$/\1/p"); do
      if uci -q show firewall.$zone | grep -Eq "network='[^']*wan([^']*)?'"; then
        current_input="$(uci -q get firewall.$zone.input || true)"
        if [ "$current_input" != "REJECT" ]; then
          uci set firewall.$zone.input='REJECT'
          changed=1
        fi

        current_forward="$(uci -q get firewall.$zone.forward || true)"
        if [ "$current_forward" != "REJECT" ]; then
          uci set firewall.$zone.forward='REJECT'
          changed=1
        fi
      fi
    done

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_wan
  changed_when: "'CHANGED' in gatekeeper_wan.stdout"

- name: Implement Zero Trust isolation (Guest network cannot access Admin network)
  ansible.builtin.raw: |
    set -eu
    changed=0

    # Define rule name for idempotency
    rule_name="block_guest_to_admin"

    # Check if rule already exists
    if ! uci show firewall | grep -q "name='$rule_name'"; then
      # Find the next available firewall rule index
      rule_idx=$(uci add firewall rule)

      # Configure the Zero Trust isolation rule
      uci set "firewall.$rule_idx.name=$rule_name"
      uci set "firewall.$rule_idx.src=guest"
      uci set "firewall.$rule_idx.dest=lan"
      uci set "firewall.$rule_idx.src_ip={{ guest_network_cidr }}"
      uci set "firewall.$rule_idx.dest_ip={{ network_cidr }}"
      uci set "firewall.$rule_idx.proto=all"
      uci set "firewall.$rule_idx.target=REJECT"
      uci set "firewall.$rule_idx.enabled=1"

      changed=1
      echo CHANGED
    else
      # Verify existing rule configuration
      rule_idx=$(uci show firewall | grep "name='$rule_name'" | cut -d'.' -f2 | cut -d'=' -f1)

      # Check if any settings need update
      current_target="$(uci -q get firewall.$rule_idx.target || true)"
      current_enabled="$(uci -q get firewall.$rule_idx.enabled || true)"
      current_src_ip="$(uci -q get firewall.$rule_idx.src_ip || true)"
      current_dest_ip="$(uci -q get firewall.$rule_idx.dest_ip || true)"

      if [ "$current_target" != "REJECT" ] || [ "$current_enabled" != "1" ] || \
         [ "$current_src_ip" != "{{ guest_network_cidr }}" ] || \
         [ "$current_dest_ip" != "{{ network_cidr }}" ]; then
        uci set "firewall.$rule_idx.target=REJECT"
        uci set "firewall.$rule_idx.enabled=1"
        uci set "firewall.$rule_idx.src_ip={{ guest_network_cidr }}"
        uci set "firewall.$rule_idx.dest_ip={{ network_cidr }}"
        changed=1
        echo CHANGED
      else
        echo OK
      fi
    fi
  register: gatekeeper_zero_trust
  changed_when: "'CHANGED' in gatekeeper_zero_trust.stdout"

- name: Block guest network from reaching upstream modem subnet (Claro)
  ansible.builtin.raw: |
    set -eu
    changed=0
    rule_name="block_guest_to_modem"

    if ! uci show firewall | grep -q "name='$rule_name'"; then
      rule_idx=$(uci add firewall rule)
      uci set "firewall.$rule_idx.name=$rule_name"
      uci set "firewall.$rule_idx.src=guest"
      uci set "firewall.$rule_idx.dest=wan"
      uci set "firewall.$rule_idx.src_ip={{ guest_network_cidr }}"
      uci set "firewall.$rule_idx.dest_ip={{ modem_subnet_cidr }}"
      uci set "firewall.$rule_idx.proto=all"
      uci set "firewall.$rule_idx.target=REJECT"
      uci set "firewall.$rule_idx.enabled=1"
      changed=1
      echo CHANGED
    else
      rule_idx=$(uci show firewall | grep "name='$rule_name'" | cut -d'.' -f2 | cut -d'=' -f1)
      current_target="$(uci -q get firewall.$rule_idx.target || true)"
      current_enabled="$(uci -q get firewall.$rule_idx.enabled || true)"
      current_src_ip="$(uci -q get firewall.$rule_idx.src_ip || true)"
      current_dest_ip="$(uci -q get firewall.$rule_idx.dest_ip || true)"

      if [ "$current_target" != "REJECT" ] || [ "$current_enabled" != "1" ] || \
         [ "$current_src_ip" != "{{ guest_network_cidr }}" ] || \
         [ "$current_dest_ip" != "{{ modem_subnet_cidr }}" ]; then
        uci set "firewall.$rule_idx.target=REJECT"
        uci set "firewall.$rule_idx.enabled=1"
        uci set "firewall.$rule_idx.src_ip={{ guest_network_cidr }}"
        uci set "firewall.$rule_idx.dest_ip={{ modem_subnet_cidr }}"
        changed=1
        echo CHANGED
      else
        echo OK
      fi
    fi
  register: gatekeeper_block_modem
  changed_when: "'CHANGED' in gatekeeper_block_modem.stdout"

- name: Configure DHCP reservations for known Raspberry Pis
  ansible.builtin.raw: |
    set -eu
    changed=0
    {% for r in pi_dhcp_reservations %}
    section="{{ r.section }}"
    if ! uci -q get dhcp.$section >/dev/null 2>&1; then
      uci set dhcp.$section=host
      uci set dhcp.$section.name='{{ r.name }}'
      uci set dhcp.$section.mac='{{ r.pi_mac }}'
      uci set dhcp.$section.ip='{{ r.pi_ip }}'
      changed=1
    else
      cur_mac="$(uci -q get dhcp.$section.mac || true)"
      cur_ip="$(uci -q get dhcp.$section.ip || true)"
      cur_name="$(uci -q get dhcp.$section.name || true)"
      if [ "$cur_mac" != "{{ r.pi_mac }}" ] || [ "$cur_ip" != "{{ r.pi_ip }}" ] || [ "$cur_name" != "{{ r.name }}" ]; then
        uci set dhcp.$section.name='{{ r.name }}'
        uci set dhcp.$section.mac='{{ r.pi_mac }}'
        uci set dhcp.$section.ip='{{ r.pi_ip }}'
        changed=1
      fi
    fi
    {% endfor %}
    if [ "$changed" -eq 1 ]; then
      uci commit dhcp
      /etc/init.d/dnsmasq reload >/dev/null 2>&1 || true
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_dhcp_reservations
  changed_when: "'CHANGED' in gatekeeper_dhcp_reservations.stdout"

- name: Install Tor package
  ansible.builtin.raw: |
    opkg list-installed 2>/dev/null | grep -q "^tor " && echo OK || {
      opkg update >/dev/null 2>&1 && opkg install tor >/dev/null 2>&1 && echo CHANGED || echo OK
    }
  register: gatekeeper_tor_install
  changed_when: "'CHANGED' in gatekeeper_tor_install.stdout"

- name: Configure Tor as transparent proxy
  ansible.builtin.raw: |
    mkdir -p /etc/tor
    tmp=$(mktemp)
    printf '%s\n' \
      'VirtualAddrNetworkIPv4 10.192.0.0/10' \
      'AutomapHostsOnResolve 1' \
      'TransPort 0.0.0.0:9040' \
      'DNSPort 0.0.0.0:5353' \
      > "$tmp"
    if cmp -s "$tmp" /etc/tor/torrc; then
      rm -f "$tmp"
      echo OK
    else
      mv "$tmp" /etc/tor/torrc
      echo CHANGED
    fi
  register: gatekeeper_tor_config
  changed_when: "'CHANGED' in gatekeeper_tor_config.stdout"

- name: Create Tor toggle script
  ansible.builtin.raw: |
    tmp=$(mktemp)
    cat > "$tmp" << 'TORSCRIPT'
    #!/bin/sh
    STATE=/var/run/tor-active
    tor_enable() {
      /etc/init.d/tor start
      sleep 3
      iptables -t nat -A PREROUTING -i br-lan -d 192.168.0.0/16 -j RETURN
      iptables -t nat -A PREROUTING -i br-lan -d 10.0.0.0/8 -j RETURN
      iptables -t nat -A PREROUTING -i br-lan -p udp --dport 53 -j REDIRECT --to-ports 5353
      iptables -t nat -A PREROUTING -i br-lan -p tcp --syn -j REDIRECT --to-ports 9040
      touch "$STATE"
      logger -t tor-toggle "Tor ENABLED - all traffic routed via Tor"
    }
    tor_disable() {
      iptables -t nat -D PREROUTING -i br-lan -d 192.168.0.0/16 -j RETURN 2>/dev/null || true
      iptables -t nat -D PREROUTING -i br-lan -d 10.0.0.0/8 -j RETURN 2>/dev/null || true
      iptables -t nat -D PREROUTING -i br-lan -p udp --dport 53 -j REDIRECT --to-ports 5353 2>/dev/null || true
      iptables -t nat -D PREROUTING -i br-lan -p tcp --syn -j REDIRECT --to-ports 9040 2>/dev/null || true
      /etc/init.d/tor stop
      rm -f "$STATE"
      logger -t tor-toggle "Tor DISABLED - normal routing restored"
    }
    [ -f "$STATE" ] && tor_disable || tor_enable
    TORSCRIPT
    if cmp -s "$tmp" /usr/bin/tor-toggle; then
      rm -f "$tmp"
      echo OK
    else
      mv "$tmp" /usr/bin/tor-toggle
      chmod +x /usr/bin/tor-toggle
      echo CHANGED
    fi
  register: gatekeeper_tor_script
  changed_when: "'CHANGED' in gatekeeper_tor_script.stdout"

- name: Create GL.iNet native Tor switch script
  ansible.builtin.raw: |
    mkdir -p /etc/gl-switch.d
    tmp=$(mktemp)
    cat > "$tmp" << 'TORSH'
    #!/bin/sh
    case "$1" in
      on)
        /etc/init.d/tor start
        sleep 3
        iptables -t nat -A PREROUTING -i br-lan -d 192.168.0.0/16 -j RETURN
        iptables -t nat -A PREROUTING -i br-lan -d 10.0.0.0/8 -j RETURN
        iptables -t nat -A PREROUTING -i br-lan -p udp --dport 53 -j REDIRECT --to-ports 5353
        iptables -t nat -A PREROUTING -i br-lan -p tcp --syn -j REDIRECT --to-ports 9040
        logger -t gl-switch "Tor ENABLED - all traffic via Tor"
        ;;
      off)
        iptables -t nat -D PREROUTING -i br-lan -d 192.168.0.0/16 -j RETURN 2>/dev/null || true
        iptables -t nat -D PREROUTING -i br-lan -d 10.0.0.0/8 -j RETURN 2>/dev/null || true
        iptables -t nat -D PREROUTING -i br-lan -p udp --dport 53 -j REDIRECT --to-ports 5353 2>/dev/null || true
        iptables -t nat -D PREROUTING -i br-lan -p tcp --syn -j REDIRECT --to-ports 9040 2>/dev/null || true
        /etc/init.d/tor stop
        logger -t gl-switch "Tor DISABLED - normal routing restored"
        ;;
    esac
    TORSH
    if cmp -s "$tmp" /etc/gl-switch.d/tor.sh; then
      rm -f "$tmp"
      echo OK
    else
      mv "$tmp" /etc/gl-switch.d/tor.sh
      chmod +x /etc/gl-switch.d/tor.sh
      echo CHANGED
    fi
  register: gatekeeper_tor_button
  changed_when: "'CHANGED' in gatekeeper_tor_button.stdout"

- name: Configure GL.iNet switch button function to Tor
  ansible.builtin.raw: |
    set -eu
    changed=0
    # switch-button is GL.iNet-specific; skip gracefully on standard OpenWrt
    uci -q show switch-button >/dev/null 2>&1 || { echo OK; exit 0; }
    current="$(uci -q get switch-button.@main[0].func || true)"
    if [ "$current" != "tor" ]; then
      uci set switch-button.@main[0].func='tor'
      uci commit switch-button
      changed=1
    fi
    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  register: gatekeeper_tor_switch_uci
  changed_when: "'CHANGED' in gatekeeper_tor_switch_uci.stdout"

- name: Ensure Tor does not start automatically on boot
  ansible.builtin.raw: |
    if ls /etc/rc.d/S*tor >/dev/null 2>&1; then
      /etc/init.d/tor disable
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_tor_autostart
  changed_when: "'CHANGED' in gatekeeper_tor_autostart.stdout"

- name: Disable and stop unnecessary services
  ansible.builtin.raw: |
    set -eu
    changed=0

    for svc in gl_tertf gl_health gl_macclone samba uhttpd; do
      if [ -x "/etc/init.d/$svc" ]; then
        if ls /etc/rc.d/S*"$svc" >/dev/null 2>&1; then
          /etc/init.d/$svc disable
          changed=1
        fi

        /etc/init.d/$svc stop >/dev/null 2>&1 || true
      fi
    done

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    else
      echo OK
    fi
  register: gatekeeper_services
  changed_when: "'CHANGED' in gatekeeper_services.stdout"

- name: Commit UCI changes and restart network and firewall
  ansible.builtin.raw: |
    uci commit
    /etc/init.d/network restart
    /etc/init.d/firewall restart
    wifi down && sleep 2 && wifi up
    echo CHANGED
  register: gatekeeper_commit
  changed_when: "'CHANGED' in gatekeeper_commit.stdout"
  when:
    - gatekeeper_perf is changed
      or gatekeeper_wifi is changed
      or gatekeeper_guest_wifi is changed
      or gatekeeper_route is changed
      or gatekeeper_dns is changed
      or gatekeeper_dnsmasq is changed
      or gatekeeper_wan is changed
      or gatekeeper_block_modem is changed
      or gatekeeper_services is changed

- name: Remove DNS DNAT rules when Pi (AdGuard) is unreachable
  ansible.builtin.raw: |
    chain="zone_lan_prerouting"
    changed=0
    iptables -t nat -S "$chain" 2>/dev/null | \
      grep 'Force-DNS-to-AdGuard' | \
      sed "s/-A $chain/-D $chain/" | \
      while IFS= read -r rule; do
        iptables -t nat $rule 2>/dev/null && changed=1
      done
    [ "$changed" -eq 1 ] && echo CHANGED || echo OK
  register: gatekeeper_dns_iptables
  changed_when: "'CHANGED' in gatekeeper_dns_iptables.stdout"
  when: gatekeeper_pi_check.stdout | trim != 'REACHABLE'
