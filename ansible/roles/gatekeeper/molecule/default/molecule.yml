---
driver:
  name: docker

platforms:
  - name: openwrt-router
    # Pinned by digest (x86_64 variant) to avoid CI drift; bump on intentional rebase.
    # Tag dropped (only digest) — Molecule docker driver rejects tag@sha256 combo.
    image: openwrt/rootfs@sha256:8acc3fb266a6b38b220bf40933c450724ba9d428b40b90bf3629041948bf7f1b
    pre_build_image: true
    command: /bin/sh -c "while true; do sleep 3600; done"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  inventory:
    hosts:
      all:
        hosts:
          openwrt-router:
    host_vars:
      openwrt-router:
        ansible_python_interpreter: /bin/false
        wifi_password: molecule-pass
        wifi_guest_password: molecule-guest-pass
        guest_network_cidr: 192.168.9.0/24
        network_cidr: 192.168.8.0/24
        wan_static_ip: 192.168.0.2
        wan_gateway: 192.168.0.1
        modem_subnet_cidr: 192.168.0.0/24
        # Test fixtures only — real MACs live in group_vars/router.sops.yml
        pi_dhcp_reservations:
          - section: rasp_pi_04
            name: rasp-pi-04
            pi_mac: "00:11:22:33:44:55"
            pi_ip: 192.168.8.11
          - section: rasp_pi_03
            name: rasp-pi-03
            pi_mac: "66:77:88:99:AA:BB"
            pi_ip: 192.168.8.12

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint
