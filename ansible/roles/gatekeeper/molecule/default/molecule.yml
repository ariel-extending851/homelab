---
driver:
  name: docker

platforms:
  - name: openwrt-router
    # Pinned by digest (x86_64 variant) to avoid CI drift; bump on intentional rebase.
    image: openwrt/rootfs:x86_64@sha256:8acc3fb266a6b38b220bf40933c450724ba9d428b40b90bf3629041948bf7f1b
    pre_build_image: true
    command: /bin/sh -c "while true; do sleep 3600; done"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  inventory:
    hosts:
      all:
        hosts:
          openwrt-router:
    host_vars:
      openwrt-router:
        ansible_python_interpreter: /bin/false
        wifi_password: molecule-pass
        wifi_guest_password: molecule-guest-pass
        guest_network_cidr: 192.168.9.0/24
        network_cidr: 192.168.8.0/24
        wan_static_ip: 192.168.0.2
        wan_gateway: 192.168.0.1
        wan_dns: 1.1.1.1

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint
