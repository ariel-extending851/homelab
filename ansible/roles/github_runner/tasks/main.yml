---
# Install + register a GitHub Actions self-hosted runner on this host.
# Idempotent: the registration step short-circuits if `.runner` config exists
# and the agent name still matches.
#
# Sandbox bypass flags (github_runner_skip_*) gate network + systemd calls
# so the same role passes Molecule under Docker without hitting api.github.com.
#
# Uninstall path (`github_runner_uninstall: true`) replaces the install path
# and tears everything down. See defaults/main.yml + uninstall.yml.

- name: Uninstall the runner (skipped when github_runner_uninstall is false)
  ansible.builtin.import_tasks: uninstall.yml
  when: github_runner_uninstall | bool
  tags: [github_runner, uninstall]

- name: Install + register block — skipped during uninstall
  when: not (github_runner_uninstall | bool)
  block:
    - name: Assert required variables are set (skipped when register bypassed)
      ansible.builtin.assert:
        that:
          - github_runner_pat | length > 0
          - github_runner_repo_owner | length > 0
          - github_runner_repo_name | length > 0
        fail_msg: >-
          github_runner_pat (PAT with repo scope), github_runner_repo_owner, and
          github_runner_repo_name must be set. PAT lives in
          ansible/group_vars/github_runners.sops.yml; see roles/github_runner/README.md.
      when: not github_runner_skip_register
      tags: [github_runner, validate]

    - name: Install runner prerequisites (Debian/Ubuntu)
      ansible.builtin.apt:
        name:
          - curl
          - tar
          - git
          - jq
          - ca-certificates
          - libicu-dev  # actions/runner needs libicu at runtime
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_pkg_mgr == 'apt'
      tags: [github_runner, packages]

    - name: Install runner prerequisites (Fedora/RHEL)
      ansible.builtin.dnf:
        name:
          - curl
          - tar
          - git
          - jq
          - ca-certificates
          - libicu  # actions/runner needs libicu at runtime (Fedora package name)
        state: present
      when: ansible_pkg_mgr in ['dnf', 'dnf5']
      tags: [github_runner, packages]

    - name: Create runner system group
      ansible.builtin.group:
        name: "{{ github_runner_group }}"
        system: true
        state: present
      tags: [github_runner]

    - name: Create runner system user
      ansible.builtin.user:
        name: "{{ github_runner_user }}"
        group: "{{ github_runner_group }}"
        home: "{{ github_runner_install_dir }}"
        shell: /bin/bash
        system: true
        create_home: false
        state: present
      tags: [github_runner]

    - name: Create runner install directory
      ansible.builtin.file:
        path: "{{ github_runner_install_dir }}"
        state: directory
        owner: "{{ github_runner_user }}"
        group: "{{ github_runner_group }}"
        mode: "0755"
      tags: [github_runner]

    - name: Check whether runner binary already extracted at the pinned version
      ansible.builtin.stat:
        path: "{{ github_runner_install_dir }}/bin/Runner.Listener"
      register: runner_listener_stat
      tags: [github_runner]

    - name: Read installed runner version (if present)
      ansible.builtin.slurp:
        src: "{{ github_runner_install_dir }}/.runner_version"
      register: installed_runner_version_raw
      failed_when: false
      changed_when: false
      tags: [github_runner]

    - name: Download runner tarball
      ansible.builtin.get_url:
        url: >-
          https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/actions-runner-linux-{{ github_runner_arch }}-{{ github_runner_version }}.tar.gz
        dest: "/tmp/actions-runner-{{ github_runner_version }}.tar.gz"
        mode: "0644"
      when:
        - not github_runner_skip_download
        - (not runner_listener_stat.stat.exists)
          or ((installed_runner_version_raw.content | default('') | b64decode | trim) != github_runner_version)
      tags: [github_runner]

    - name: Extract runner tarball
      ansible.builtin.unarchive:
        src: "/tmp/actions-runner-{{ github_runner_version }}.tar.gz"
        dest: "{{ github_runner_install_dir }}"
        remote_src: true
        owner: "{{ github_runner_user }}"
        group: "{{ github_runner_group }}"
        creates: "{{ github_runner_install_dir }}/bin/Runner.Listener"
      when:
        - not github_runner_skip_download
        - (not runner_listener_stat.stat.exists)
          or ((installed_runner_version_raw.content | default('') | b64decode | trim) != github_runner_version)
      tags: [github_runner]

    - name: Record installed runner version
      ansible.builtin.copy:
        content: "{{ github_runner_version }}\n"
        dest: "{{ github_runner_install_dir }}/.runner_version"
        owner: "{{ github_runner_user }}"
        group: "{{ github_runner_group }}"
        mode: "0644"
      when: not github_runner_skip_download
      tags: [github_runner]

    - name: Check whether runner already configured
      ansible.builtin.stat:
        path: "{{ github_runner_install_dir }}/.runner"
      register: runner_config_stat
      tags: [github_runner]

    - name: Read existing runner config (if any)
      ansible.builtin.slurp:
        src: "{{ github_runner_install_dir }}/.runner"
      register: runner_config_raw
      when: runner_config_stat.stat.exists
      changed_when: false
      tags: [github_runner]

    - name: Decide whether re-registration is needed (name drift)
      ansible.builtin.set_fact:
        runner_needs_register: >-
          {{
            (not runner_config_stat.stat.exists)
            or ((runner_config_raw.content | b64decode | from_json).agentName != github_runner_name)
          }}
      tags: [github_runner]

    # Registration token from GitHub is short-lived (~1h); exchange the long-lived
    # PAT in SOPS for one on demand. Repo-scoped endpoint used here.
    - name: Exchange PAT for short-lived runner registration token
      ansible.builtin.uri:
        url: >-
          https://api.github.com/repos/{{ github_runner_repo_owner }}/{{ github_runner_repo_name }}/actions/runners/registration-token
        method: POST
        headers:
          Accept: "application/vnd.github+json"
          Authorization: "Bearer {{ github_runner_pat }}"
          X-GitHub-Api-Version: "2022-11-28"
        status_code: 201
        return_content: true
      register: runner_token_response
      no_log: true
      when:
        - not github_runner_skip_register
        - runner_needs_register
      tags: [github_runner]

    - name: Unregister stale runner config (idempotent re-register)
      ansible.builtin.command:
        cmd: "./config.sh remove --token {{ runner_token_response.json.token }}"
        chdir: "{{ github_runner_install_dir }}"
      become_user: "{{ github_runner_user }}"
      become: true
      when:
        - not github_runner_skip_register
        - runner_needs_register
        - runner_config_stat.stat.exists
      changed_when: true
      no_log: true
      tags: [github_runner]

    - name: Register runner with GitHub
      ansible.builtin.command:
        cmd: >-
          ./config.sh
          --url https://github.com/{{ github_runner_repo_owner }}/{{ github_runner_repo_name }}
          --token {{ runner_token_response.json.token }}
          --name {{ github_runner_name }}
          --labels {{ github_runner_labels }}
          --runnergroup {{ github_runner_group_name }}
          --work {{ github_runner_work_dir }}
          --unattended
          --replace
        chdir: "{{ github_runner_install_dir }}"
      become_user: "{{ github_runner_user }}"
      become: true
      when:
        - not github_runner_skip_register
        - runner_needs_register
      changed_when: true
      no_log: true
      tags: [github_runner]

    - name: Install systemd service via vendor svc.sh
      ansible.builtin.command:
        cmd: "./svc.sh install {{ github_runner_user }}"
        chdir: "{{ github_runner_install_dir }}"
        creates: "/etc/systemd/system/actions.runner.{{ github_runner_repo_owner }}-{{ github_runner_repo_name }}.{{ github_runner_name }}.service"
      when: not github_runner_skip_service_start
      tags: [github_runner]

    - name: Drop resource caps into a systemd drop-in (so the runner cannot starve Jellyfin)
      ansible.builtin.file:
        path: >-
          /etc/systemd/system/actions.runner.{{ github_runner_repo_owner }}-{{ github_runner_repo_name }}.{{ github_runner_name }}.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: not github_runner_skip_service_start
      tags: [github_runner, resource_caps]

    - name: Render resource-caps.conf systemd drop-in
      ansible.builtin.template:
        src: resource-caps.conf.j2
        dest: >-
          /etc/systemd/system/actions.runner.{{ github_runner_repo_owner }}-{{ github_runner_repo_name }}.{{ github_runner_name }}.service.d/resource-caps.conf
        owner: root
        group: root
        mode: "0644"
      when: not github_runner_skip_service_start
      notify: Reload systemd and restart runner
      tags: [github_runner, resource_caps]

    - name: Ensure runner service enabled + started
      ansible.builtin.systemd:
        name: "actions.runner.{{ github_runner_repo_owner }}-{{ github_runner_repo_name }}.{{ github_runner_name }}.service"
        enabled: true
        state: started
        daemon_reload: true
      when: not github_runner_skip_service_start
      tags: [github_runner]

    # ── mise (so workflows that call `mise exec -- <tool>` work natively) ──────
    - name: Install mise system-wide (for workflows that call `mise exec --`)
      # Canonical github releases binary, mirrors the install script's runtime path.
      # The mise.jdx.dev redirect endpoint is for the install.sh script, not for
      # versioned raw binaries — that returns 404.
      ansible.builtin.get_url:
        url: "https://github.com/jdx/mise/releases/download/v{{ github_runner_mise_version }}/mise-v{{ github_runner_mise_version }}-linux-{{ github_runner_arch }}"
        dest: "/usr/local/bin/mise"
        mode: "0755"
        force: false
      when:
        - github_runner_install_mise
        - not github_runner_skip_download
      tags: [github_runner, mise]

    - name: Trust the repo's .mise.toml for the runner user
      ansible.builtin.file:
        path: "{{ github_runner_install_dir }}/.config/mise"
        state: directory
        owner: "{{ github_runner_user }}"
        group: "{{ github_runner_group }}"
        mode: "0755"
      when: github_runner_install_mise
      tags: [github_runner, mise]
