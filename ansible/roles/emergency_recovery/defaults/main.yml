---
# Default variables for emergency_recovery role

# Kubernetes API settings
k8s_api_timeout: 60
k8s_api_retries: 5

# Tailscale proxy services to recover
tailscale_proxy_services: []

# Recovery wait times (seconds)
recovery_wait_time: 60
pod_ready_timeout: 120

# Health check endpoints
health_check_endpoints: {}

# Namespace for Tailscale proxies
tailscale_namespace: tailscale

# Recovery actions
delete_statefulsets: true
wait_for_recreation: true
verify_endpoints: true
generate_report: true
