---
# Converge alloy role inside the Docker-driven sandbox.
# Stubs the Alloy binary download so the role runs without internet egress
# and without depending on a specific upstream SHA256.

- name: Converge alloy role
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Provide a fake alloy binary so the role's version check passes
      ansible.builtin.copy:
        dest: /usr/local/bin/alloy
        mode: '0755'
        content: |
          #!/bin/sh
          case "$1" in
            --version) echo "alloy, version 1.5.1 (branch: HEAD, revision: stub)" ;;
            fmt)       exit 0 ;;
            run)       sleep infinity ;;
            *)         exit 0 ;;
          esac

    - name: Bypass network download via host_var
      ansible.builtin.set_fact:
        alloy_grafana_cloud_user: "molecule-tenant"
        alloy_grafana_cloud_token: "molecule-token-not-real"

  roles:
    - role: alloy
