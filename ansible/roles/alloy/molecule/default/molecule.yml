---
# Molecule test suite for the alloy role.
# Focus: validate preflight gates (kernel/arch/memory), install idempotency,
# template rendering. We do NOT exercise eBPF/Beyla — those require a real
# host kernel and live network access to Grafana Cloud, neither of which is
# available inside the Docker-driven Molecule sandbox.

driver:
  name: docker

platforms:
  - name: rasp-pi-04
    # Pinned by digest to avoid drift in CI; bump when geerlingguy refreshes
    # the upstream image. Same image the tailscale role uses.
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:3a9474d843917fbeb737a78626c1b8bc31daf6424fe51575e6ce4affffecfa24
    privileged: true
    pre_build_image: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - raspberry_pi
      - alloy_native

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  config_options:
    defaults:
      gathering: smart
      fact_caching: memory
  inventory:
    host_vars:
      rasp-pi-04:
        # Bypass real binary download — converge.yml lays down a stub
        # before the role runs.
        alloy_skip_download: true
        # Skip the systemd start step — the Docker-driven sandbox does not
        # support the unit's CAP_BPF / MemoryMax / ProtectKernelTunables
        # interactions. Enable-only confirms the unit drops correctly.
        alloy_skip_service_start: true
        # Force the easier branch of the systemd unit (no Beyla on the
        # Docker-driven sandbox; the kernel inside the container does not
        # expose CAP_BPF properly).
        alloy_enable_beyla: false

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint
