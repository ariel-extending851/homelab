---
# Render the River config and the env file holding the SOPS-decrypted
# Grafana Cloud token. Templates are arch-agnostic; the Jinja conditionals
# branch on `alloy_enable_*` flags so the same template serves RPi 3 (Beyla
# disabled by group_var if RAM is too tight), RPi 4 (full pipeline), and
# EC2 (full pipeline + awss3 exporter via Instance Profile).

- name: Render Alloy River configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: "{{ alloy_user }}"
    group: "{{ alloy_user }}"
    mode: "0640"
    # Bug 19 of PR #114: `alloy fmt --test` requires canonical whitespace;
    # the Jinja template's iteration produces non-canonical output even when
    # syntactically valid. Use plain `fmt` to parse-validate without strict
    # whitespace check. Runtime systemd unit + `wait for /-/ready` still
    # catch any real config errors.
    validate: "/usr/local/bin/alloy fmt %s"
  notify: Restart alloy

- name: Render Alloy environment file (token + S3 bucket name + AWS region)
  ansible.builtin.template:
    src: alloy.env.j2
    dest: /etc/default/alloy
    owner: root
    group: "{{ alloy_user }}"
    mode: "0640"
  notify: Restart alloy
  no_log: true   # contains the Grafana Cloud token
