---
# Fetch the Alloy binary from upstream releases, verify SHA256 against the
# checksum file Grafana publishes alongside every release (no hardcoded
# hashes — they drift on every version bump), install to /usr/local/bin,
# and lay down the data + config directories Alloy owns at runtime.

- name: Map host architecture to Grafana release suffix
  ansible.builtin.set_fact:
    alloy_release_arch: "{{ alloy_arch_map[ansible_architecture] }}"

- name: Ensure dependencies for Alloy binary install are present (Debian / Ubuntu)
  ansible.builtin.apt:
    name:
      - unzip
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Ensure dependencies for Alloy binary install are present (Amazon Linux)
  ansible.builtin.dnf:
    name:
      - unzip
      - ca-certificates
    state: present
  when: ansible_os_family == 'RedHat'

- name: Create alloy system user (no login shell, no home directory writes)
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/alloy
    create_home: false

- name: Create Alloy runtime + config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ alloy_user }}"
    group: "{{ alloy_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/alloy, mode: "0750" }
    - { path: /var/lib/alloy, mode: "0750" }
    - { path: /var/lib/alloy/wal, mode: "0750" }

- name: Download Alloy archive (SHA256 verified via upstream SHA256SUMS)
  ansible.builtin.get_url:
    url: "{{ alloy_download_url_base }}/v{{ alloy_version }}/alloy-linux-{{ alloy_release_arch }}.zip"
    dest: "/tmp/alloy-{{ alloy_version }}-{{ alloy_release_arch }}.zip"
    checksum: "sha256:{{ alloy_download_url_base }}/v{{ alloy_version }}/SHA256SUMS"
    mode: "0640"
    timeout: 120
  register: alloy_archive
  when: not (alloy_skip_download | default(false))

- name: Stat the installed binary to decide whether to extract
  ansible.builtin.stat:
    path: /usr/local/bin/alloy
  register: alloy_existing_binary

- name: Extract Alloy binary into /usr/local/bin (only when archive is new or binary is missing)
  ansible.builtin.unarchive:
    src: "/tmp/alloy-{{ alloy_version }}-{{ alloy_release_arch }}.zip"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/alloy
  when:
    - not (alloy_skip_download | default(false))
    - alloy_archive.changed or not alloy_existing_binary.stat.exists

# Bug 18 of PR #114: the upstream zip ships the binary as
# `alloy-linux-{arch}` (e.g. alloy-linux-arm64). The role's `creates:`
# guard above and downstream `/usr/local/bin/alloy --version` both
# expect the file to be named `alloy`.
- name: Rename arch-suffixed binary to /usr/local/bin/alloy
  ansible.builtin.command:
    cmd: "mv /usr/local/bin/alloy-linux-{{ alloy_release_arch }} /usr/local/bin/alloy"
    creates: /usr/local/bin/alloy
  when:
    - not (alloy_skip_download | default(false))

- name: Verify Alloy reports the expected version
  ansible.builtin.command: /usr/local/bin/alloy --version
  register: alloy_version_check
  changed_when: false
  failed_when:
    - alloy_version_check.rc != 0
    - alloy_version not in alloy_version_check.stdout
  when: not (alloy_skip_download | default(false))

- name: Clean up downloaded archive
  ansible.builtin.file:
    path: "/tmp/alloy-{{ alloy_version }}-{{ alloy_release_arch }}.zip"
    state: absent
  when: not (alloy_skip_download | default(false))
