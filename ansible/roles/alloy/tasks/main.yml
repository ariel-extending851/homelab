---
# Grafana Alloy native-systemd installer.
# Targets: Raspberry Pi k3s-agent nodes (alloy_native group) and optionally
# the AWS EC2 nodes when the operator prefers a host-level agent over the
# in-cluster DaemonSet at k8s/apps/alloy/.
#
# Pipeline:
#   preflight  — kernel / arch / memory / BTF gates before any disk writes
#   install    — fetch binary, verify SHA256, place under /usr/local/bin
#   configure  — render config.alloy + /etc/default/alloy from templates
#   service    — drop systemd unit, enable, start, wait for /-/ready
#
# Idempotent end-to-end; second-run gate enforced in CI per CLAUDE.md
# "Phased delivery" / definition-of-done.

- name: Run Alloy preflight gates (kernel / arch / memory / BTF)
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - alloy
    - observability
    - validate

- name: Install Alloy binary + system user
  ansible.builtin.import_tasks: install.yml
  tags:
    - alloy
    - observability

- name: Render Alloy configuration + env file
  ansible.builtin.import_tasks: configure.yml
  tags:
    - alloy
    - observability
    - config

- name: Install and start the alloy systemd unit
  ansible.builtin.import_tasks: service.yml
  tags:
    - alloy
    - observability
    - service
