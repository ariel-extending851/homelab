---
# Configure Git repository credentials for ArgoCD

- name: Display repository configuration banner
  ansible.builtin.debug:
    msg: |
      =========================================
      Configuring Git Repository
      =========================================
      Repository: {{ git_repo_url }}
      Branch: {{ git_repo_branch }}
      Path: {{ git_repo_path }}
      =========================================
  tags:
    - validate

- name: Check if SSH deploy key exists
  ansible.builtin.stat:
    path: "{{ git_ssh_private_key_path }}"
  register: ssh_key_file
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when:
    - git_repo_url is match('git@.*')
    - not ansible_check_mode
  tags:
    - validate

# Postmortem 2026-05-03 (gotcha #5): if the key file is absent, the apply-secret
# task below was previously skipped silently — apps-root would then fail to sync
# with "SSH_AUTH_SOCK not-specified" because no homelab-repo-secret was created.
# Fail explicitly so the operator fixes it before bootstrap_apps.yml runs.
- name: Fail loudly if SSH deploy key required but missing
  ansible.builtin.fail:
    msg: |
      git_repo_url is "{{ git_repo_url }}" (SSH) but no key found at
      {{ git_ssh_private_key_path }} on the control machine.

      Generate one and register the public key as a GitHub deploy key:
        ssh-keygen -t ed25519 -f {{ git_ssh_private_key_path }} -C "argocd@homelab" -N ""
        cat {{ git_ssh_private_key_path }}.pub
        # paste at https://github.com/<owner>/<repo>/settings/keys/new
        ssh -T -i {{ git_ssh_private_key_path }} git@github.com   # confirm OK

      Without this, apps-root will be applied with no repository credentials and
      ArgoCD will report Sync=Unknown forever.
  when:
    - git_repo_url is match('git@.*')
    - not ansible_check_mode
    - ssh_key_file is defined
    - ssh_key_file.stat is defined
    - not ssh_key_file.stat.exists

- name: Read SSH private key
  ansible.builtin.slurp:
    src: "{{ git_ssh_private_key_path }}"
  register: ssh_private_key_content
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when:
    - git_repo_url is match('git@.*')
    - not ansible_check_mode
    - ssh_key_file is defined
    - ssh_key_file.stat is defined
    - ssh_key_file.stat.exists
  no_log: true

- name: Write ArgoCD repository secret to temp file
  ansible.builtin.copy:
    dest: /tmp/argocd-repo-secret.yaml
    mode: '0600'
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: homelab-repo-secret
        namespace: {{ argocd_namespace }}
        labels:
          argocd.argoproj.io/secret-type: repository
      type: Opaque
      stringData:
        type: git
        url: "{{ git_repo_url }}"
        sshPrivateKey: |
      {{ ssh_private_key_content.content | b64decode | indent(4, True) }}
        insecure: "false"
        enableLfs: "false"
  when:
    - git_repo_url is match('git@.*')
    - not ansible_check_mode
    - ssh_key_file is defined
    - ssh_key_file.stat is defined
    - ssh_key_file.stat.exists
  no_log: true

- name: Apply ArgoCD repository secret for SSH
  ansible.builtin.command: kubectl apply -f /tmp/argocd-repo-secret.yaml
  environment: "{{ kubeconfig_env }}"
  register: repo_secret_apply
  changed_when: "'created' in repo_secret_apply.stdout or 'configured' in repo_secret_apply.stdout"
  when:
    - git_repo_url is match('git@.*')
    - not ansible_check_mode
    - ssh_key_file is defined
    - ssh_key_file.stat is defined
    - ssh_key_file.stat.exists
  no_log: true

- name: Remove temp repo secret file
  ansible.builtin.file:
    path: /tmp/argocd-repo-secret.yaml
    state: absent
  when:
    - git_repo_url is match('git@.*')
    - not ansible_check_mode
    - ssh_key_file is defined
    - ssh_key_file.stat is defined
    - ssh_key_file.stat.exists

- name: Display repository configuration (SSH)
  ansible.builtin.debug:
    msg: |
      ✓ SSH deploy key configured (or skipped in check mode)
      ✓ Repository: {{ git_repo_url }}
      ArgoCD can now clone private repositories
  when: git_repo_url is match('git@.*')
  tags:
    - validate

- name: Display repository configuration (HTTPS - no auth needed)
  ansible.builtin.debug:
    msg: |
      ⚠ Public repository detected (HTTPS)
      No authentication configured
      Repository: {{ git_repo_url }}
  when: not (git_repo_url is match('git@.*'))
  tags:
    - validate

- name: Verify ArgoCD can access repository
  ansible.builtin.command: |
    kubectl exec -n {{ argocd_namespace }} deployment/argocd-server -- \
      argocd repo list --output json
  environment: "{{ kubeconfig_env }}"
  register: argocd_repos
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Display configured repositories
  ansible.builtin.debug:
    msg: "{{ argocd_repos.stdout | from_json if (argocd_repos is defined and argocd_repos.rc is defined and argocd_repos.rc == 0 and argocd_repos.stdout | length > 0) else 'Skipped in check mode' }}"
  tags:
    - validate
