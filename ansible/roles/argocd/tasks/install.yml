---
# ArgoCD Installation Tasks
# Uses kubectl directly — no Python kubernetes library required on the remote host.

- name: Create ArgoCD namespace
  ansible.builtin.command: kubectl create namespace {{ argocd_namespace }}
  environment: "{{ kubeconfig_env }}"
  register: create_ns
  changed_when: create_ns.rc == 0
  failed_when: create_ns.rc != 0 and 'already exists' not in create_ns.stderr

- name: Check if argocd-redis secret already exists
  ansible.builtin.command: kubectl get secret argocd-redis -n {{ argocd_namespace }}
  environment: "{{ kubeconfig_env }}"
  register: redis_secret_exists
  changed_when: false
  failed_when: false

- name: Create argocd-redis secret (only if it does not exist)
  # IMPORTANT: Only create once — never rotate on subsequent runs.
  # All ArgoCD components read this password at pod startup from the secret.
  # Rotating it without restarting ALL components simultaneously causes
  # WRONGPASS errors that break the repo-server → Redis connection.
  ansible.builtin.shell: |
    kubectl create secret generic argocd-redis \
    -n {{ argocd_namespace }} \
    --from-literal=auth={{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') | b64encode }}
  environment: "{{ kubeconfig_env }}"
  register: redis_secret
  changed_when: true
  when: redis_secret_exists.rc != 0

- name: Check if ArgoCD is already installed
  ansible.builtin.command: kubectl get deployment argocd-server -n {{ argocd_namespace }}
  environment: "{{ kubeconfig_env }}"
  register: argocd_existing
  changed_when: false
  failed_when: false
  tags:
    - validate

- name: Display ArgoCD status
  ansible.builtin.debug:
    msg: "{{ 'ArgoCD already installed — skipping download/apply' if argocd_existing.rc == 0 else 'Installing ArgoCD ' + argocd_version + '...' }}"
  tags:
    - validate

- name: Check for locally cached ArgoCD manifest
  ansible.builtin.stat:
    path: "{{ role_path }}/files/argocd-{{ argocd_version }}-install.yaml"
  register: argocd_manifest_cache
  delegate_to: localhost
  become: false
  when: argocd_existing.rc != 0

- name: Use cached ArgoCD manifest (offline-safe)
  ansible.builtin.copy:
    src: "argocd-{{ argocd_version }}-install.yaml"
    dest: /tmp/argocd-install.yaml
    mode: '0644'
  when: argocd_existing.rc != 0 and argocd_manifest_cache.stat.exists

- name: Download ArgoCD manifest (no local cache found)
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: /tmp/argocd-install.yaml
    mode: '0644'
  when: argocd_existing.rc != 0 and not argocd_manifest_cache.stat.exists

- name: Apply ArgoCD manifest
  ansible.builtin.command: kubectl apply -n {{ argocd_namespace }} -f /tmp/argocd-install.yaml
  environment: "{{ kubeconfig_env }}"
  register: argocd_apply
  changed_when: "'created' in argocd_apply.stdout or 'configured' in argocd_apply.stdout"
  when: argocd_existing.rc != 0

- name: Wait for ArgoCD pods to be scheduled (give API server time to process)
  ansible.builtin.pause:
    seconds: 60
  when: argocd_apply is changed

- name: Wait for ArgoCD server deployment to appear in API
  ansible.builtin.command: kubectl get deployment argocd-server -n {{ argocd_namespace }}
  environment: "{{ kubeconfig_env }}"
  register: argocd_server_exists
  until: argocd_server_exists.rc == 0
  retries: 20
  delay: 10
  changed_when: false

- name: Wait for ArgoCD server deployment to be ready
  ansible.builtin.command: >
    kubectl rollout status deployment/argocd-server
    -n {{ argocd_namespace }}
    --timeout=300s
  environment: "{{ kubeconfig_env }}"
  register: argocd_server_rollout
  changed_when: false

- name: Wait for ArgoCD repo-server deployment to be ready
  ansible.builtin.command: >
    kubectl rollout status deployment/argocd-repo-server
    -n {{ argocd_namespace }}
    --timeout=300s
  environment: "{{ kubeconfig_env }}"
  register: argocd_repo_rollout
  changed_when: false

# Pin application-controller to a specific node. The manifest install ships
# with no nodeSelector, so the StatefulSet pod can land anywhere — including
# memory-constrained workers where 200+ MiB RSS triggers swap-thrash and
# kernel freezes. Patch is idempotent: kubectl prints "(no change)" when the
# desired nodeSelector already matches, and we filter that out of changed.
- name: Read current application-controller nodeSelector
  ansible.builtin.command: >
    kubectl get statefulset/argocd-application-controller
    -n {{ argocd_namespace }}
    -o jsonpath={.spec.template.spec.nodeSelector.kubernetes\.io/hostname}
  environment: "{{ kubeconfig_env }}"
  register: argocd_controller_node_current
  changed_when: false
  when: argocd_application_controller_node | length > 0
  tags:
    - argocd-pin

- name: Pin application-controller to {{ argocd_application_controller_node }}
  ansible.builtin.command: >
    kubectl patch statefulset/argocd-application-controller
    -n {{ argocd_namespace }}
    --type=merge
    -p {{ patch_body | to_json | quote }}
  vars:
    patch_body:
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: "{{ argocd_application_controller_node }}"
  environment: "{{ kubeconfig_env }}"
  register: argocd_controller_patch
  changed_when: "'patched' in argocd_controller_patch.stdout and 'no change' not in argocd_controller_patch.stdout"
  when:
    - argocd_application_controller_node | length > 0
    - argocd_controller_node_current.stdout != argocd_application_controller_node
  tags:
    - argocd-pin

- name: Wait for ArgoCD application-controller to be ready
  ansible.builtin.command: >
    kubectl rollout status statefulset/argocd-application-controller
    -n {{ argocd_namespace }}
    --timeout=300s
  environment: "{{ kubeconfig_env }}"
  register: argocd_controller_rollout
  changed_when: false

- name: Get ArgoCD pods status
  ansible.builtin.command: kubectl get pods -n {{ argocd_namespace }}
  environment: "{{ kubeconfig_env }}"
  register: argocd_pods
  changed_when: false
  tags:
    - validate

- name: Display ArgoCD pods
  ansible.builtin.debug:
    msg: "{{ argocd_pods.stdout_lines }}"
  tags:
    - validate

- name: Display installation summary
  ansible.builtin.debug:
    msg: |
      ✓ ArgoCD {{ argocd_version }} installed
      ✓ Namespace: {{ argocd_namespace }}
      ✓ Server: Ready
      ✓ Repo Server: Ready
      ✓ Application Controller: Ready
  tags:
    - validate
