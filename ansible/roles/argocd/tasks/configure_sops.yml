---
# Configure SOPS (Secrets OPerationS) for ArgoCD
# Uses kubectl directly — no Python kubernetes library required on the remote host.
#
# Design:
#   - Secret 'sops-age-key' holds the Age private key (matches argocd-repo-server-patch.yaml)
#   - ConfigMap 'cmp-plugin' (from k8s/gitops/sops/sops-plugin-cm.yaml) defines the CMP
#   - argocd-repo-server patched via k8s/gitops/sops/argocd-repo-server-patch.yaml
#     which adds a 'cmp-sops' sidecar using quay.io/argoproj/argocd (has kustomize built-in)
#
# Source of truth: k8s/gitops/sops/ — Ansible must not diverge from those files.

- name: Display SOPS configuration banner
  ansible.builtin.debug:
    msg: |
      =========================================
      Configuring SOPS for ArgoCD
      =========================================
      Age public key: {{ sops_age_public_key }}
      =========================================
  tags:
    - validate

- name: Create SOPS age-key secret (idempotent — only create if absent)
  ansible.builtin.shell: |
    set -e
    if kubectl get secret sops-age-key -n {{ argocd_namespace }} >/dev/null 2>&1; then
      echo "sops-age-key already exists — skipping"
      exit 0
    fi
    kubectl create secret generic sops-age-key \
      -n {{ argocd_namespace }} \
      --from-literal=keys.txt="{{ sops_age_private_key }}"
  environment: "{{ kubeconfig_env }}"
  register: sops_secret_result
  changed_when: "'already exists' not in sops_secret_result.stdout"
  no_log: true
  when: not ansible_check_mode

- name: Ensure remote temp directory for ArgoCD SOPS exists
  ansible.builtin.file:
    path: /tmp/argocd-sops
    state: directory
    mode: '0755'
  when: not ansible_check_mode

- name: Copy SOPS manifests to target node
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../k8s/gitops/sops/{{ item }}"
    dest: "/tmp/argocd-sops/{{ item }}"
    mode: '0644'
  loop:
    - sops-plugin-cm.yaml
    - argocd-repo-server-patch.yaml
  when: not ansible_check_mode

- name: Apply ArgoCD SOPS ConfigManagementPlugin configmap
  ansible.builtin.command: >
    kubectl apply -f /tmp/argocd-sops/sops-plugin-cm.yaml
  environment: "{{ kubeconfig_env }}"
  register: cmp_apply
  changed_when: "'created' in cmp_apply.stdout or 'configured' in cmp_apply.stdout"
  when: not ansible_check_mode

- name: Apply strategic merge patch to argocd-repo-server (adds cmp-sops sidecar)
  # kubectl patch is itself idempotent: on a no-op it returns
  # "deployment.apps/... patched (no change)". We always apply so that
  # later edits to k8s/gitops/sops/argocd-repo-server-patch.yaml (e.g.,
  # removing the amd64 nodeSelector that blocked Pi-only deploys) are
  # picked up even when the sidecar is already present.
  ansible.builtin.command: >
    kubectl patch deployment argocd-repo-server
    -n {{ argocd_namespace }}
    --type=strategic
    --patch-file /tmp/argocd-sops/argocd-repo-server-patch.yaml
  environment: "{{ kubeconfig_env }}"
  register: repo_server_patch
  changed_when:
    - "'patched' in repo_server_patch.stdout"
    - "'no change' not in repo_server_patch.stdout"
  when: not ansible_check_mode

- name: Wait for argocd-repo-server to restart with cmp-sops sidecar
  ansible.builtin.command: >
    kubectl rollout status deployment/argocd-repo-server
    -n {{ argocd_namespace }}
    --timeout=300s
  environment: "{{ kubeconfig_env }}"
  register: argocd_repo_rollout
  changed_when: false
  when:
    - not ansible_check_mode
    - repo_server_patch is changed

- name: Verify cmp-sops sidecar is present and has kustomize
  ansible.builtin.command: >
    kubectl exec -n {{ argocd_namespace }} deployment/argocd-repo-server
    -c cmp-sops -- which kustomize
  environment: "{{ kubeconfig_env }}"
  register: kustomize_check
  changed_when: false
  failed_when: kustomize_check.rc != 0
  when: not ansible_check_mode

- name: Display SOPS configuration summary
  ansible.builtin.debug:
    msg: |
      ✓ SOPS age-key secret created (or already existed)
      ✓ ConfigManagementPlugin 'cmp-plugin' applied
      ✓ argocd-repo-server patched with cmp-sops sidecar (quay.io/argoproj/argocd)
      ✓ kustomize available in sidecar: {{ kustomize_check.stdout | default('(check mode)') }}

      SOPS will automatically decrypt files matching:
        - Directories containing .sops.yaml marker files
  tags:
    - validate
