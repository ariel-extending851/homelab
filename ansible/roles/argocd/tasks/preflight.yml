---
# Pre-flight checks for ArgoCD installation

- name: Check if running on k3s control plane
  ansible.builtin.stat:
    path: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Fail if not on k3s control plane
  ansible.builtin.fail:
    msg: "This role must run on k3s control plane (server node)"
  when: not k3s_kubeconfig.stat.exists

- name: Set kubeconfig environment
  ansible.builtin.set_fact:
    kubeconfig_env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Verify Kubernetes API is available
  ansible.builtin.command: kubectl get nodes
  environment: "{{ kubeconfig_env }}"
  register: k8s_api_check
  failed_when: k8s_api_check.rc != 0
  changed_when: false

- name: Display cluster info
  ansible.builtin.debug:
    msg: "{{ k8s_api_check.stdout_lines }}"

- name: Check if SOPS age key exists (if SOPS enabled)
  ansible.builtin.stat:
    path: "{{ sops_age_private_key_path }}"
  register: sops_key_file
  delegate_to: localhost
  become: false
  when: sops_enabled | bool

- name: Fail if SOPS key not found
  ansible.builtin.fail:
    msg: |
      SOPS age private key not found at {{ sops_age_private_key_path }}

      To generate a new key:
        age-keygen -o ~/.config/sops/age/keys.txt

      Or disable SOPS:
        Set sops_enabled=false in group_vars/all.yml
  when:
    - sops_enabled | bool
    - not sops_key_file.stat.exists

- name: Read SOPS age private key
  ansible.builtin.slurp:
    src: "{{ sops_age_private_key_path }}"
  register: sops_private_key_content
  delegate_to: localhost
  become: false
  when: sops_enabled | bool
  no_log: true

- name: Set SOPS key fact
  ansible.builtin.set_fact:
    sops_age_private_key: "{{ sops_private_key_content.content | b64decode }}"
  when: sops_enabled | bool
  no_log: true

- name: Display pre-flight check summary
  ansible.builtin.debug:
    msg: |
      ✓ Kubernetes API available
      ✓ Running on k3s control plane
      {{ '✓ SOPS age key loaded' if sops_enabled else '⚠ SOPS disabled' }}
      Ready to install ArgoCD {{ argocd_version }}
