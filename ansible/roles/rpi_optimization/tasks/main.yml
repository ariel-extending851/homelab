---
# RPi Optimization Tasks
# Migrated from: scripts/optimize-rpi4-swap.sh
# Purpose: Optimize Raspberry Pi memory, swap, and system settings

- name: Display optimization banner
  ansible.builtin.debug:
    msg: |
      =========================================
      Raspberry Pi Optimization Script
      Host: {{ inventory_hostname }}
      Architecture: {{ architecture }}
      Memory: {{ memory_gb }}GB
      =========================================

- name: Check current memory status
  ansible.builtin.command: free -h
  register: memory_status
  changed_when: false

- name: Display current memory
  ansible.builtin.debug:
    msg: "{{ memory_status.stdout_lines }}"

- name: Check current swap status
  ansible.builtin.command: swapon -s
  register: swap_status
  failed_when: false
  changed_when: false

- name: Display current swap
  ansible.builtin.debug:
    msg: "{{ swap_status.stdout_lines if swap_status.stdout else 'No swap currently active' }}"

- name: Check available disk space
  ansible.builtin.shell: df / | tail -1 | awk '{print $4}'
  register: disk_space_kb
  changed_when: false

- name: Calculate available disk space in GB
  ansible.builtin.set_fact:
    available_disk_gb: "{{ (disk_space_kb.stdout | int / 1024 / 1024) | int }}"

- name: Display disk space check
  ansible.builtin.debug:
    msg: |
      Disk space check:
        Available: {{ available_disk_gb }}GB
        Required:  {{ required_disk_space_gb }}GB

- name: Fail if insufficient disk space
  ansible.builtin.fail:
    msg: |
      ERROR: Not enough disk space!
      Need {{ required_disk_space_gb }}GB, have {{ available_disk_gb }}GB

      Options:
      1. Free up disk space
      2. Reduce swap size (set swap.size_mb to 1024 for 1GB)
  when: (available_disk_gb | int) < required_disk_space_gb

- name: Check if swap file already exists
  ansible.builtin.stat:
    path: "{{ swap.file_path }}"
  register: swap_file

- name: Create swap file with fallocate (fast method)
  ansible.builtin.command: fallocate -l {{ swap.size_mb }}M {{ swap.file_path }}
  when:
    - not swap_file.stat.exists
    - swap.use_fallocate | bool
    - swap.enabled | bool
  register: fallocate_result
  failed_when: false

- name: Create swap file with dd (fallback method)
  ansible.builtin.command: dd if=/dev/zero of={{ swap.file_path }} bs=1M count={{ swap.size_mb }}
  when:
    - not swap_file.stat.exists
    - swap.enabled | bool
    - (fallocate_result is defined and fallocate_result.rc != 0) or not (swap.use_fallocate | bool)
  register: dd_result

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap.file_path }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - swap.enabled | bool
    - not swap_file.stat.exists

- name: Initialize swap file
  ansible.builtin.command: mkswap {{ swap.file_path }}
  when:
    - swap.enabled | bool
    - not swap_file.stat.exists
  register: mkswap_result

- name: Display swap creation result
  ansible.builtin.debug:
    msg: "✓ Swap file created successfully"
  when: mkswap_result is changed

- name: Check if swap is already enabled
  ansible.builtin.shell: swapon -s | grep -q {{ swap.file_path }}
  register: swap_active
  failed_when: false
  changed_when: false

- name: Enable swap
  ansible.builtin.command: swapon {{ swap.file_path }}
  when:
    - swap.enabled | bool
    - swap_active.rc != 0
  register: swapon_result

- name: Display swap enable result
  ansible.builtin.debug:
    msg: "✓ Swap enabled"
  when: swapon_result is changed

- name: Check if swap is in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ swap.file_path }}"
    state: absent
  check_mode: yes
  register: fstab_check
  changed_when: false

- name: Add swap to fstab for persistence
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap.file_path }} none swap sw 0 0"
    state: present
  when: fstab_check is not changed

- name: Configure kernel memory parameters
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-rpi-optimization.conf
  loop:
    - { key: 'vm.swappiness', value: '{{ swap.swappiness }}' }
    - { key: 'vm.vfs_cache_pressure', value: '{{ swap.vfs_cache_pressure }}' }
    - { key: 'vm.overcommit_memory', value: '{{ memory.overcommit_memory }}' }
    - { key: 'vm.min_free_kbytes', value: '{{ memory.min_free_kbytes }}' }
    - { key: 'vm.dirty_ratio', value: '{{ memory.dirty_ratio }}' }
    - { key: 'vm.dirty_background_ratio', value: '{{ memory.dirty_background_ratio }}' }
  loop_control:
    label: "{{ item.key }}"

- name: Configure kernel parameters for containers
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-k8s-optimization.conf
  loop:
    - { key: 'vm.max_map_count', value: '{{ kernel.max_map_count }}' }
    - { key: 'fs.inotify.max_user_watches', value: '{{ kernel.max_user_watches }}' }
    - { key: 'fs.file-max', value: '{{ kernel.file_max }}' }
    - { key: 'net.netfilter.nf_conntrack_max', value: '{{ kernel.netfilter_connection_tracking_max }}' }
  loop_control:
    label: "{{ item.key }}"

- name: Configure log rotation for containerd
  ansible.builtin.template:
    src: logrotate-containerd.j2
    dest: /etc/logrotate.d/containerd
    mode: '0644'
  when: log_rotation.enabled | bool

- name: Configure log rotation for k3s
  ansible.builtin.template:
    src: logrotate-k3s.j2
    dest: /etc/logrotate.d/k3s
    mode: '0644'
  when: log_rotation.enabled | bool

- name: Display final memory status
  ansible.builtin.command: free -h
  register: final_memory
  changed_when: false

- name: Display final swap status
  ansible.builtin.command: swapon -s
  register: final_swap
  changed_when: false

- name: Display kernel parameters
  ansible.builtin.command: sysctl vm.swappiness vm.vfs_cache_pressure vm.overcommit_memory
  register: kernel_params
  changed_when: false

- name: Display optimization summary
  ansible.builtin.debug:
    msg: |
      =========================================
      Optimization Complete!
      =========================================

      Memory Status:
      {{ final_memory.stdout }}

      Swap Status:
      {{ final_swap.stdout }}

      Kernel Parameters:
      {{ kernel_params.stdout }}

      Summary of changes:
        • Swap size: {{ swap.size_mb }}MB ({{ swap.size_mb / 1024 }}GB)
        • Swappiness: {{ swap.swappiness }} (less aggressive)
        • Cache pressure: {{ swap.vfs_cache_pressure }} (better caching)
        • Overcommit: Enabled (allows container flexibility)
        • All changes are persistent across reboots

      Benefits:
        ✓ Better memory management under pressure
        ✓ Reduced OOM killer triggers
        ✓ Improved container stability
        ✓ Optimized for SD card/flash storage

      Monitor improvement with:
        watch -n 5 'free -h && uptime'
      =========================================
