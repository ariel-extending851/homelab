---
# RPi Optimization Tasks
# Migrated from: scripts/optimize-rpi4-swap.sh
# Purpose: Optimize Raspberry Pi memory, swap, and system settings

- name: Display optimization banner
  ansible.builtin.debug:
    msg: |
      =========================================
      Raspberry Pi Optimization Script
      Host: {{ inventory_hostname }}
      Architecture: {{ architecture }}
      Memory: {{ memory_gb }}GB
      =========================================
  tags:
    - validate

- name: Check current memory status
  ansible.builtin.command: free -h
  register: memory_status
  changed_when: false
  tags:
    - validate

- name: Display current memory
  ansible.builtin.debug:
    msg: "{{ memory_status.stdout_lines }}"
  tags:
    - validate

- name: Check current swap status
  ansible.builtin.command: swapon -s
  register: swap_status
  failed_when: false
  changed_when: false
  tags:
    - validate

- name: Display current swap
  ansible.builtin.debug:
    msg: "{{ swap_status.stdout_lines if swap_status.stdout else 'No swap currently active' }}"
  tags:
    - validate

- name: Find root filesystem facts
  ansible.builtin.set_fact:
    root_mount: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/') | list | first) | default({'size_available': 0}) }}"
  tags:
    - validate

- name: Calculate available disk space in GB
  ansible.builtin.set_fact:
    available_disk_gb: "{{ (root_mount.size_available / 1024 / 1024 / 1024) | round(2) }}"
  tags:
    - validate

- name: Display disk space check
  ansible.builtin.debug:
    msg: |
      Disk space check:
        Available: {{ available_disk_gb }}GB
        Required:  {{ required_disk_space_gb }}GB
  tags:
    - validate

- name: Fail if insufficient disk space
  ansible.builtin.fail:
    msg: |
      ERROR: Not enough disk space!
      Need {{ required_disk_space_gb }}GB, have {{ available_disk_gb }}GB

      Options:
      1. Free up disk space
      2. Reduce swap size (set swap.size_mb to 1024 for 1GB)
  when: (available_disk_gb | float) < (required_disk_space_gb | float)
  tags:
    - validate

- name: Check if swap file already exists
  ansible.builtin.stat:
    path: "{{ swap.file_path }}"
  register: swap_file
  tags:
    - validate

- name: Create swap file with fallocate (fast method)
  ansible.builtin.command: fallocate -l {{ swap.size_mb }}M {{ swap.file_path }}
  when:
    - not swap_file.stat.exists
    - swap.use_fallocate | bool
    - swap.enabled | bool
  register: fallocate_result
  failed_when: false

- name: Create swap file with dd (fallback method)
  ansible.builtin.command: dd if=/dev/zero of={{ swap.file_path }} bs=1M count={{ swap.size_mb }}
  when:
    - not swap_file.stat.exists
    - swap.enabled | bool
    - not (swap.use_fallocate | bool) or (fallocate_result is defined and fallocate_result.rc | default(0) != 0)
  register: dd_result

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap.file_path }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - swap.enabled | bool
    - not swap_file.stat.exists

- name: Initialize swap file
  ansible.builtin.command: mkswap {{ swap.file_path }}
  when:
    - swap.enabled | bool
    - not swap_file.stat.exists
  register: mkswap_result

- name: Display swap creation result
  ansible.builtin.debug:
    msg: "✓ Swap file created successfully"
  when: mkswap_result is defined and mkswap_result is changed

- name: Check if swap is already enabled
  ansible.builtin.shell: swapon -s | grep -q {{ swap.file_path }}
  register: swap_active
  failed_when: false
  changed_when: false
  tags:
    - validate

- name: Enable swap
  ansible.builtin.command: swapon {{ swap.file_path }}
  when:
    - swap.enabled | bool
    - swap_active.rc != 0
    # swapon is unsupported on overlayfs (Docker). Skip in Molecule/CI.
    - not (molecule_testing | default(false) | bool)
  register: swapon_result

- name: Display swap enable result
  ansible.builtin.debug:
    msg: "✓ Swap enabled"
  when: swapon_result is defined and swapon_result is changed

- name: Check if swap is in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ swap.file_path }}"
    state: absent
  check_mode: yes
  register: fstab_check
  changed_when: false
  tags:
    - validate

- name: Add swap to fstab for persistence
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap.file_path }} none swap sw 0 0"
    state: present
  when: fstab_check is not changed

- name: Configure kernel memory parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-rpi-optimization.conf
  loop:
    - { key: 'vm.swappiness', value: '{{ swap.swappiness }}' }
    - { key: 'vm.vfs_cache_pressure', value: '{{ swap.vfs_cache_pressure }}' }
    - { key: 'vm.overcommit_memory', value: '{{ memory.overcommit_memory }}' }
    - { key: 'vm.min_free_kbytes', value: '{{ memory.min_free_kbytes }}' }
    - { key: 'vm.dirty_ratio', value: '{{ memory.dirty_ratio }}' }
    - { key: 'vm.dirty_background_ratio', value: '{{ memory.dirty_background_ratio }}' }
  loop_control:
    label: "{{ item.key }}"

- name: Configure kernel parameters for containers
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-k8s-optimization.conf
  loop:
    - { key: 'vm.max_map_count', value: '{{ kernel.max_map_count }}' }
    - { key: 'fs.inotify.max_user_watches', value: '{{ kernel.max_user_watches }}' }
    - { key: 'fs.file-max', value: '{{ kernel.file_max }}' }
  loop_control:
    label: "{{ item.key }}"

# net.netfilter.nf_conntrack_max requires the nf_conntrack kernel module.
# In Docker containers the module may not be loaded; ignore failure in Molecule/CI.
- name: Configure nf_conntrack_max (requires nf_conntrack module)
  ansible.posix.sysctl:
    name: net.netfilter.nf_conntrack_max
    value: "{{ kernel.netfilter_connection_tracking_max }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-k8s-optimization.conf
  ignore_errors: "{{ molecule_testing | default(false) | bool }}"

- name: Configure log rotation for containerd
  ansible.builtin.template:
    src: logrotate-containerd.j2
    dest: /etc/logrotate.d/containerd
    mode: '0644'
  when: log_rotation.enabled | bool

- name: Configure log rotation for k3s
  ansible.builtin.template:
    src: logrotate-k3s.j2
    dest: /etc/logrotate.d/k3s
    mode: '0644'
  when: log_rotation.enabled | bool

# /proc/device-tree/model is the authoritative hardware identifier on a Pi —
# it reports e.g. "Raspberry Pi 3 Model B Rev 1.2" or "Raspberry Pi 4 Model B Rev 1.4".
# The file is absent in Docker, so we tolerate that and let rpi_model_override
# (set by molecule) take over when running tests.
- name: Detect Raspberry Pi hardware model
  ansible.builtin.slurp:
    src: /proc/device-tree/model
  register: rpi_model_raw
  failed_when: false
  changed_when: false
  tags:
    - validate
    - rpi3

- name: Set rpi_model fact
  ansible.builtin.set_fact:
    rpi_model: >-
      {{ rpi_model_override
         | default((rpi_model_raw.content | default('') | b64decode).replace('\u0000', '')) }}
  tags:
    - validate
    - rpi3

- name: Apply RPi 3-only power optimizations
  ansible.builtin.include_tasks: rpi3_power.yml
  when:
    - rpi3_power.enabled | bool
    - "'Raspberry Pi 3' in rpi_model"
  tags:
    - rpi3

# ─── AdGuard DNS host prep ────────────────────────────────────────────────
# Frees port 53 on this host so the AdGuard pod (hostNetwork=true) can bind
# it. Required for k8s/apps/adguard/deployment.yaml's nodeSelector target.
# Idempotent: stop/disable returns "ok" when already disabled; the regex on
# /etc/resolv.conf only rewrites when content differs.
- name: AdGuard DNS host prep — stop systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  when: adguard_dns_host | bool
  tags:
    - adguard-dns-host

- name: AdGuard DNS host prep — replace /etc/resolv.conf with static upstream
  ansible.builtin.copy:
    # owner/group/mode pinned so the file is reproducible across re-runs.
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (rpi_optimization role, adguard_dns_host=true).
      # Host-only resolver — keeps apt/k3s working independently of the
      # AdGuard pod, which serves LAN clients on this same node:53.
      {% for srv in host_dns_servers %}
      nameserver {{ srv }}
      {% endfor %}
    # Belt-and-braces: Ubuntu's symlink to /run/systemd/resolve/stub-resolv.conf
    # would survive `copy` if `force: false`; keep default force=true.
  when: adguard_dns_host | bool
  tags:
    - adguard-dns-host

- name: Display final memory status
  ansible.builtin.command: free -h
  register: final_memory
  changed_when: false
  tags:
    - validate

- name: Display final swap status
  ansible.builtin.command: swapon -s
  register: final_swap
  changed_when: false
  tags:
    - validate

- name: Display kernel parameters
  ansible.builtin.command: sysctl vm.swappiness vm.vfs_cache_pressure vm.overcommit_memory
  register: kernel_params
  changed_when: false
  tags:
    - validate

- name: Display optimization summary
  ansible.builtin.debug:
    msg: |
      =========================================
      Optimization Complete!
      =========================================

      Memory Status:
      {{ final_memory.stdout }}

      Swap Status:
      {{ final_swap.stdout }}

      Kernel Parameters:
      {{ kernel_params.stdout }}

      Summary of changes:
        • Swap size: {{ swap.size_mb }}MB ({{ swap.size_mb / 1024 }}GB)
        • Swappiness: {{ swap.swappiness }} (less aggressive)
        • Cache pressure: {{ swap.vfs_cache_pressure }} (better caching)
        • Overcommit: Enabled (allows container flexibility)
        • All changes are persistent across reboots

      Benefits:
        ✓ Better memory management under pressure
        ✓ Reduced OOM killer triggers
        ✓ Improved container stability
        ✓ Optimized for SD card/flash storage

      Monitor improvement with:
        watch -n 5 'free -h && uptime'
      =========================================
  tags:
    - validate
