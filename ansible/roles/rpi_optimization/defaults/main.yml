---
# Default variables for rpi_optimization role

# Swap configuration
swap:
  enabled: true
  file_path: /swapfile
  size_mb: 2048  # 2GB
  swappiness: 10  # Less aggressive (default: 60)
  vfs_cache_pressure: 50  # Keep cache longer (default: 100)
  use_fallocate: true  # Try fallocate first, fall back to dd

# Required disk space (safety check)
required_disk_space_gb: 2

# Memory optimization
memory:
  transparent_hugepage: madvise
  overcommit_memory: 1
  min_free_kbytes: 16384
  dirty_ratio: 10
  dirty_background_ratio: 5

# Kernel tuning for containers.
# inotify limits matter for k3s nodes hosting many pods: every containerd-shim
# and every container that opens watches consumes from the per-UID budget. Root
# burns through the default max_user_instances=128 once ~50 pods land on the
# node (each shim takes ~2 instances), and systemd then fails to create cgroup
# inotify objects ("Too many open files"), blocking pod spawn. 8192/1048576 is
# the Kubernetes/Elastic/Grafana recommended floor.
kernel:
  max_map_count: 262144
  max_user_instances: 8192
  max_user_watches: 1048576
  file_max: 2097152
  netfilter_connection_tracking_max: 131072

# Containerd optimization for ARM
containerd:
  max_container_log_line_size: 8192
  stream_idle_timeout: 4h
  max_concurrent_downloads: 2

# Log rotation
log_rotation:
  enabled: true
  max_size: 50M
  max_files: 3
  compress: true

# Filesystem tuning
filesystem:
  mount_options: "noatime,nodiratime,errors=remount-ro"
  io_scheduler: deadline

# Thermal monitoring (for RPi)
thermal:
  enabled: true
  warning_temp: 70
  critical_temp: 80

# RPi 3-only power optimizations for external SSD stability.
# Disables WiFi/Bluetooth radios (SBC draws less current) and raises the USB
# bus current limit so an attached SSD is less likely to brown out.
# Skipped on RPi 4 Model B — its native USB 3.0 power delivery handles SSDs.
rpi3_power:
  enabled: true
  config_path: /boot/firmware/config.txt
  overlays:
    - disable-wifi
    - disable-bt
  max_usb_current: 1

# AdGuard DNS host preparation. When true, the role disables systemd-resolved
# and rewrites /etc/resolv.conf to free port 53 so the AdGuard pod (with
# hostNetwork=true) can bind it. Override to true via host_vars on whichever
# Pi is pinned by the AdGuard k8s nodeSelector (currently rasp-pi-03).
# host_dns_servers populates the static /etc/resolv.conf that the host itself
# uses once systemd-resolved is gone — keeps apt/k3s working independently of
# AdGuard's pod state.
adguard_dns_host: false
# Override per-host (via host_vars) on non-AdGuard nodes whose /etc/resolv.conf
# would otherwise be hand-edited. Keeps the resolver list under the role and
# prevents drift like the 2026-06-03 pi-04 incident where a stale
# 100.100.100.100 entry forwarded CoreDNS through tailscaled CorpDNS=false and
# broke ArgoCD repo-server's lookup of github.com. systemd-resolved is left
# running on this path (only adguard_dns_host=true stops it).
host_dns_managed: false
# Public-only upstreams for the host's own resolver. Tailscale's MagicDNS
# (100.100.100.100) is deliberately NOT listed: tailscaled runs with
# accept-dns=false (CorpDNS=false in prefs) on these nodes, so the
# coordination server does not push upstream resolvers to it; any query for a
# non-tailnet name sent to 100.100.100.100 returns SERVFAIL and the host falls
# through to 1.1.1.1 / 8.8.8.8 with extra latency plus a journal line each
# time. The host doesn't need to resolve *.<tailnet>.ts.net itself — kubeconfig,
# Ansible inventory and the AdGuard pod's own upstreams use IPs.
host_dns_servers:
  - 1.1.1.1
  - 8.8.8.8
