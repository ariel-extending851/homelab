---
- name: Apply ProxyClass manifests
  ansible.builtin.command: kubectl apply -f {{ item }}
  environment:
    KUBECONFIG: "{{ tailscale_operator_kubeconfig }}"
  delegate_to: localhost
  become: false
  loop: "{{ tailscale_operator_proxyclass_files }}"
  loop_control:
    label: "{{ item | basename }}"
  register: _ts_op_proxyclass
  changed_when: >-
    'created' in _ts_op_proxyclass.stdout or
    'configured' in _ts_op_proxyclass.stdout
  when: not ansible_check_mode
