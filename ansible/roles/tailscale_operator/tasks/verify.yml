---
- name: Wait for the operator pod to reach Running
  ansible.builtin.command: >-
    {{ tailscale_operator__kubectl_bin }} get pods -n {{ tailscale_operator_namespace }}
    -l app=operator
    -o jsonpath={.items[0].status.phase}
  environment:
    KUBECONFIG: "{{ tailscale_operator_kubeconfig }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: tailscale_operator__phase
  changed_when: false
  retries: 12
  delay: 10
  until: tailscale_operator__phase.stdout == "Running"
  when: not ansible_check_mode

- name: Display tailscale-operator readiness summary
  ansible.builtin.debug:
    msg: |
      ===========================================
      Tailscale Operator Ready
      ===========================================
      Pod phase: {{ tailscale_operator__phase.stdout | default('(check mode — not invoked)') }}
      Namespace: {{ tailscale_operator_namespace }}

      Existing ingresses with `class: tailscale` will materialize on the tailnet
      shortly. Verify with:
        kubectl get ingress -A
        kubectl get pods -n {{ tailscale_operator_namespace }} | grep ^ts-
      ===========================================
