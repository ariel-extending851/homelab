---
# ansible/roles/ssm_agent/tasks/main.yml
# Registers the node as an AWS SSM managed instance via hybrid activation
# (standard tier — Run Command, free). Break-glass for when Tailscale is down:
# `aws ssm send-command` can run recovery commands without SSH. See
# docs/runbooks/tailscale-logged-out.md.

- name: Assert SSM activation credentials are present
  ansible.builtin.assert:
    that:
      - ssm_activation_id | default('') | length > 0
      - ssm_activation_code | default('') | length > 0
      - ssm_region | default('') | length > 0
    fail_msg: >-
      ssm_activation_id / ssm_activation_code / ssm_region must be set (from
      infra/aws-velero outputs via `make ssm-activation-bootstrap`, stored in
      group_vars/all.sops.yml). Got id='{{ ssm_activation_id | default('') }}'.
  when: not (ssm_skip_install | default(false) | bool)

- name: Select the amazon-ssm-agent .deb for this architecture
  ansible.builtin.set_fact:
    _ssm_agent_deb_arch: >-
      {{ {'aarch64': 'arm64', 'x86_64': 'amd64', 'armv7l': 'arm'}[ansible_architecture] | default('arm64') }}

- name: Download amazon-ssm-agent package
  ansible.builtin.get_url:
    url: "https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/debian_{{ _ssm_agent_deb_arch }}/amazon-ssm-agent.deb"
    dest: /tmp/amazon-ssm-agent.deb
    mode: "0644"
  when: not (ssm_skip_install | default(false) | bool)

- name: Install amazon-ssm-agent
  ansible.builtin.apt:
    deb: /tmp/amazon-ssm-agent.deb
  when: not (ssm_skip_install | default(false) | bool)

# RegistrationKey vault file marks an already-registered agent — `creates:`
# makes the register step idempotent (skipped on re-runs).
- name: Register the agent with the SSM hybrid activation
  ansible.builtin.command:
    cmd: >-
      amazon-ssm-agent -register -y
      -code {{ ssm_activation_code }}
      -id {{ ssm_activation_id }}
      -region {{ ssm_region }}
    creates: /var/lib/amazon/ssm/Vault/Store/RegistrationKey
  no_log: true
  when: not (ssm_skip_register | default(false) | bool)
  notify: Restart amazon-ssm-agent

- name: Ensure amazon-ssm-agent is enabled and started
  ansible.builtin.systemd:
    name: amazon-ssm-agent
    enabled: true
    state: started
  when: not (ssm_skip_service | default(false) | bool)
