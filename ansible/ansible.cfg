[defaults]
# Inventory configuration
inventory = inventory/production.yml
host_key_checking = False
remote_user = agfonseca
interpreter_python = auto_silent

# Output configuration
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
deprecation_warnings = False
display_ok_hosts = True
callbacks_enabled = profile_tasks, timer

# Performance tuning
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/cache
fact_caching_timeout = 86400

# SSH configuration
timeout = 30
pipelining = True

# Privilege escalation
become = True
become_method = sudo
become_ask_pass = False

# Roles path
roles_path = roles

# Collections path
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

# Retry files
retry_files_enabled = False

[inventory]
# Enable Terraform dynamic inventory scripts
enable_plugins = ini, yaml, host_list, script, auto

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# Use multiplexing for faster SSH connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

# SOPS integration for encrypted secrets
# Requires: pip install ansible-modules-hashivault community.sops
# Usage: !vault | for inline secrets, or vars_files with .sops.yml extension
[vault]
# vault_password_file = ~/.ansible/vault_pass
