---
# Health Check Playbook
# Purpose: Verify cluster health and resource status
#
# Usage:
#   ansible-playbook -i inventory/production.yml playbooks/maintenance/health_check.yml

- name: Cluster Health Check
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Check system uptime
      ansible.builtin.command: timeout 8 uptime
      register: uptime_result
      changed_when: false
      failed_when: false
      tags:
        - validate
      when: not ansible_check_mode

    - name: Check memory usage
      ansible.builtin.command: timeout 8 free -h
      register: memory_result
      changed_when: false
      failed_when: false
      tags:
        - validate
      when: not ansible_check_mode

    - name: Check disk usage
      ansible.builtin.command: timeout 8 df -h /
      register: disk_result
      changed_when: false
      failed_when: false
      tags:
        - validate
      when: not ansible_check_mode

    - name: Check swap status
      ansible.builtin.command: timeout 8 swapon -s
      register: swap_result
      failed_when: false
      changed_when: false
      tags:
        - validate
      when: not ansible_check_mode

    - name: Display node health
      ansible.builtin.debug:
        msg: |
          =========================================
          Health Check: {{ inventory_hostname }}
          =========================================

          Uptime:
          {{ uptime_result.stdout | default('Skipped in check mode') }}

          Memory:
          {{ memory_result.stdout | default('Skipped in check mode') }}

          Disk:
          {{ disk_result.stdout | default('Skipped in check mode') }}

          Swap:
          {{ swap_result.stdout | default('No swap configured') if (swap_result is defined and swap_result.rc is defined and swap_result.rc == 0) else 'No swap configured' }}
          =========================================
      tags:
        - validate

- name: Kubernetes Health Check
  hosts: k3s_server
  become: yes
  gather_facts: no
  tasks:
    - name: Get node status
      ansible.builtin.command: timeout 15 kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: nodes_result
      changed_when: false
      failed_when: false
      tags:
        - validate
      when: not ansible_check_mode

    - name: Get pod status
      ansible.builtin.command: timeout 15 kubectl get pods -A -o wide
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: pods_result
      changed_when: false
      failed_when: false
      tags:
        - validate
      when: not ansible_check_mode

    - name: Check for unhealthy pods
      ansible.builtin.shell: |
        timeout 15 kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: unhealthy_pods
      changed_when: false
      failed_when: false
      tags:
        - validate
      when: not ansible_check_mode

    - name: Display Kubernetes health
      ansible.builtin.debug:
        msg: |
          =========================================
          Kubernetes Cluster Health
          =========================================

          Nodes:
          {{ nodes_result.stdout | default('Skipped in check mode') }}

          {% if (unhealthy_pods is defined) and (unhealthy_pods.stdout | default('')) %}
          ⚠️  Unhealthy Pods Detected:
          {{ unhealthy_pods.stdout }}
          {% else %}
          ✓ All pods are healthy (or skipped in check mode)
          {% endif %}
          =========================================
      run_once: true
      tags:
        - validate
