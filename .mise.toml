[tools]
# Core Infrastructure.
# `terraform` matches what develop's CI implicitly used (its `latest` pin was
# resolving to 1.15.x). Tried 1.11 first to align with the setup-terraform
# action pin in ci-validation.yml's `terraform-plan` job, but 1.11 surfaced
# two test-framework regressions vs 1.15:
#   - prevent_destroy enforcement during mock_provider teardown of resources
#     not under test (backend.tftest.hcl)
#   - && short-circuit timing in `for` expressions called against jsondecoded
#     IAM policies (oidc.tftest.hcl — also patched defensively via flatten()
#     in PR #66's fix(ci) commit)
# The setup-terraform pin in ci-validation.yml stays at 1.11.0 since that
# job only runs `terraform plan`, never tests, so the cross-job mismatch is
# cosmetic.
terraform = "1.15.2"
ansible = { version = "13.4.0", pipx_args = "--include-deps", uvx = "false" }
infracost = "0.10.43"
sops = "3.10.2"

# Cloud & Kubernetes Tools.
# `kubectl` is pinned to the k3s server minor (1.30.x) — see
# docs/runbooks/staging-deploy-2026-05-postmortem.md gotcha #1 for the
# class of failures that env/version mismatches between local + CI cause.
awscli = "2.34.45"
kubectl = "1.30.14"
kustomize = "5.8.1"
jq = "1.7.1"
tflint = "0.60.0"
kubeconform = "0.7.0"
age = "1.2.1"
conftest = "0.57.0"
trivy = "0.70.0"

# Local Testing (LocalStack). The two pipx tools below only run in the
# LocalStack integration job (continue-on-error: true) so floating is OK.
localstack = "4.13.1"
"pipx:terraform-local" = "latest"
"pipx:awscli-local" = "latest"

# Quality Assurance & Linting
"pipx:pre-commit" = "4.6.0"
"pipx:ansible-lint" = "26.1.1"
"pipx:yamllint" = "1.38.0"
"pipx:molecule" = "25.12.0"
"pipx:ansible-core" = "2.18.0"
"pipx:pytest" = "9.0.3"
"pipx:copier" = "9.4.1"

# Note: mkdocs-material is intentionally NOT pinned in mise. It pulls in
# transitive CLI tools (mkdocs, ghp-import, watchdog, pygments, …) and
# pipx requires `--include-deps` to expose them, which mise's pipx
# backend does not pass through cleanly. The docs workflow installs it
# via plain pipx instead — see `.github/workflows/docs.yml`.

# GitHub Actions workflow linting
actionlint = "1.7.11"
"pipx:zizmor" = "1.24.1"

# Shell testing
bats = "1.11.1"

# Local cluster for pre-deploy GitOps convergence test
# (k3d ships k3s — same distro as prod; matches sync-wave timing more
# faithfully than upstream kind/kubeadm.)
k3d = "5.8.3"

# Runtimes
node = "lts"
npm = "11.12.1"
pipx = "1.8.0"

[tasks.setup-molecule-deps]
description = "Inject AWS/SSM deps into ansible-core and Docker plugin into molecule"
run = '''
# Função para encontrar o Python real por trás de um binário gerenciado pelo mise
get_python_from_bin() {
    local bin_name=$1
    local bin_path
    bin_path=$(mise which "$bin_name" 2>/dev/null)
    if [ -n "$bin_path" ]; then
        # Lê a primeira linha (#!...), remove o prefixo #! e qualquer argumento extra
        head -n 1 "$bin_path" | sed 's/^#!//' | sed 's/ .*//' | tr -d '\r'
    fi
}

# 1. Configura dependências do Ansible
ANSIBLE_PYTHON=$(get_python_from_bin ansible-playbook)
echo "  🔍 Ansible Python detectado em: $ANSIBLE_PYTHON"

if [ -x "$ANSIBLE_PYTHON" ]; then
    "$ANSIBLE_PYTHON" -m pip install --quiet requests docker kubernetes boto3 botocore
    echo "  ✓ Dependências de AWS/SSM instaladas no ambiente do Ansible"
else
    echo "  ❌ Erro: Não foi possível localizar o Python do Ansible"
    exit 1
fi

# 2. Configura dependências do Molecule
MOLECULE_PYTHON=$(get_python_from_bin molecule)
echo "  🔍 Molecule Python detectado em: $MOLECULE_PYTHON"

if [ -x "$MOLECULE_PYTHON" ]; then
    "$MOLECULE_PYTHON" -m pip install --quiet "molecule-plugins[docker]"
    echo "  ✓ Plugin de Docker injetado no ambiente do Molecule"
else
    echo "  ❌ Erro: Não foi possível localizar o Python do Molecule"
    exit 1
fi
'''

[tasks.install-ssm-plugin]
description = "Installs the AWS SSM session manager plugin (deb)"
run = """
curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "/tmp/session-manager-plugin.deb"
sudo dpkg -i /tmp/session-manager-plugin.deb
"""

[settings]
experimental = true

# AWS Configuration for Homelab Project
# These environment variables are automatically set when you enter this directory
[env]
AWS_PROFILE = "Homelab"
AWS_DEFAULT_REGION = "us-east-1"

# Defaults to the production bucket name. Staging deploys MUST override at runtime:
#   ANSIBLE_AWS_SSM_BUCKET_NAME=homelab-ssm-transfer-bucket-staging make ansible-deploy
# See docs/runbooks/staging-deploy-2026-05-postmortem.md gotcha #1.
ANSIBLE_AWS_SSM_BUCKET_NAME = "homelab-ssm-transfer-bucket"

SOPS_AGE_KEY_FILE = "/home/vscode/.config/sops/age/keys.txt"

# TF_VAR_* with dynamic values: set at runtime by CI/environment
# These require network access which may not be available during config parsing
# TF_VAR_ssh_allowed_cidr = "{{ exec(command='curl -s ifconfig.me') }}/32"
# TF_VAR_k3s_api_allowed_cidr = "{{ exec(command='curl -s ifconfig.me') }}/32"
